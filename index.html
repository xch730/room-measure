<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>房屋丈量畫圖工具</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;
background:#f3f4f6;
color:#222;
}

header{
background:#111827;
color:white;
padding:14px 16px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:20;
}

header h1{
font-size:18px;
margin:0;
}

.header-buttons{
display:flex;
gap:8px;
}

button{
border:0;
border-radius:8px;
padding:9px 12px;
font-size:15px;
cursor:pointer;
}

button:active{
transform:scale(.97);
}

.btn-dark{
background:#374151;
color:white;
}

.btn-blue{
background:#2563eb;
color:white;
}

.btn-red{
background:#dc2626;
color:white;
}

.btn-green{
background:#16a34a;
color:white;
}

.btn-gray{
background:#e5e7eb;
color:#111;
}

.container{
padding:12px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
border-radius:12px;
padding:12px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card-title{
font-weight:bold;
font-size:16px;
margin-bottom:10px;
}

.row{
display:flex;
gap:8px;
align-items:center;
flex-wrap:wrap;
}

input,
select{
font-size:16px;
padding:9px 10px;
border:1px solid #d1d5db;
border-radius:8px;
background:white;
}

input[type="number"]{
width:130px;
}

.tool-buttons{
display:flex;
gap:7px;
flex-wrap:wrap;
}

.tool-btn{
background:#f3f4f6;
border:2px solid transparent;
}

.tool-btn.active{
background:#dbeafe;
border-color:#2563eb;
color:#1d4ed8;
font-weight:bold;
}

.direction-buttons{
display:grid;
grid-template-columns:repeat(3,50px);
gap:5px;
justify-content:center;
margin:10px 0;
}

.direction-buttons button{
height:45px;
padding:0;
font-size:22px;
}

.direction-empty{
visibility:hidden;
}

.info{
background:#eff6ff;
border:1px solid #bfdbfe;
border-radius:8px;
padding:9px;
font-size:13px;
line-height:1.6;
color:#1e40af;
}

.warning{
background:#fff7ed;
border:1px solid #fed7aa;
border-radius:8px;
padding:9px;
font-size:13px;
line-height:1.6;
color:#9a3412;
}

.case-list{
display:flex;
flex-direction:column;
gap:7px;
}

.case-item{
display:flex;
align-items:center;
justify-content:space-between;
padding:10px;
border:1px solid #e5e7eb;
border-radius:8px;
background:#fafafa;
}

.case-name{
font-weight:bold;
}

svg{
width:100%;
height:65vh;
min-height:450px;
background:#fff;
border:1px solid #d1d5db;
border-radius:10px;
touch-action:none;
display:block;
}

.wall{
stroke:#111;
stroke-width:24;
stroke-linecap:round;
}

.window{
stroke:#2563eb;
stroke-width:18;
}

.window-line{
stroke:#2563eb;
stroke-width:8;
}

.door{
stroke:#f97316;
stroke-width:18;
}

.door-leaf{
stroke:#f97316;
stroke-width:14;
}

.door-arc{
fill:none;
stroke:#f97316;
stroke-width:8;
stroke-dasharray:18 12;
}

.beam{
stroke:#dc2626;
stroke-width:28;
stroke-dasharray:35 20;
}

.selected-wall{
stroke:#9333ea;
stroke-width:35;
stroke-dasharray:20 15;
}

.dimension-line{
stroke:#6b7280;
stroke-width:5;
}

.dimension-tick{
stroke:#6b7280;
stroke-width:5;
}

.dimension-text{
font-size:70px;
font-weight:bold;
fill:#374151;
}

.window-text{
font-size:58px;
font-weight:bold;
fill:#2563eb;
}

.door-text{
font-size:58px;
font-weight:bold;
fill:#ea580c;
}

.offset-text{
font-size:50px;
font-weight:bold;
fill:#4b5563;
}

.height-text{
font-size:82px;
font-weight:bold;
fill:#059669;
}

.beam-text{
font-size:60px;
font-weight:bold;
fill:#dc2626;
}

.beam-distance-text{
font-size:50px;
font-weight:bold;
fill:#dc2626;
}

.center-label{
font-size:34px;
font-weight:bold;
fill:#6b7280;
}

.small-note{
font-size:12px;
color:#6b7280;
margin-top:5px;
}

.hidden{
display:none !important;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:flex;
align-items:center;
justify-content:center;
z-index:100;
padding:20px;
}

.modal-box{
background:white;
width:100%;
max-width:430px;
border-radius:14px;
padding:18px;
box-shadow:0 10px 40px rgba(0,0,0,.2);
}

.modal-title{
font-size:18px;
font-weight:bold;
margin-bottom:12px;
}

.modal-actions{
display:flex;
gap:8px;
justify-content:flex-end;
margin-top:15px;
}

@media(max-width:600px){

header h1{
font-size:16px;
}

header{
padding:11px 12px;
}

.container{
padding:8px;
}

.card{
padding:10px;
}

svg{
height:58vh;
min-height:400px;
}

input[type="number"]{
width:120px;
}

}

</style>

</head>

<body>

<header>

<h1>房屋丈量畫圖工具</h1>

<div class="header-buttons">

<button
class="btn-dark"
onclick="newCase()"
>
＋案件
</button>

<button
class="btn-dark"
onclick="openCaseList()"
>
📁
</button>

</div>

</header>


<div class="container">


<!-- 案件資訊 -->

<div class="card">

<div class="card-title">
目前案件
</div>

<div class="row">

<input
id="caseName"
type="text"
placeholder="案件名稱"
style="flex:1;min-width:180px;"
onchange="saveCase()"
>

<button
class="btn-blue"
onclick="saveCase()"
>
儲存
</button>

</div>

</div>


<!-- 工具 -->

<div class="card">

<div class="card-title">
工具
</div>

<div class="tool-buttons">

<button
id="tool-wall"
class="tool-btn active"
onclick="setTool('wall')"
>
🧱 牆線
</button>

<button
id="tool-window"
class="tool-btn"
onclick="setTool('window')"
>
🪟 窗戶
</button>

<button
id="tool-door"
class="tool-btn"
onclick="setTool('door')"
>
🚪 門
</button>

<button
id="tool-height"
class="tool-btn"
onclick="setTool('height')"
>
🏠 樓高
</button>

<button
id="tool-beam"
class="tool-btn"
onclick="setTool('beam')"
>
▰ 樑
</button>

</div>

</div>


<!-- 牆線 -->

<div
id="wallPanel"
class="card"
>

<div class="card-title">
牆線
</div>

<div class="row">

<label>
牆長
</label>

<input
id="wallLength"
type="number"
inputmode="numeric"
placeholder="mm"
autocomplete="off"
>

<button
class="btn-blue"
onclick="addWall()"
>
新增牆
</button>

<button
class="btn-gray"
onclick="undo()"
>
↩ 復原
</button>

<button
class="btn-red"
onclick="clearDrawing()"
>
清除
</button>

<button
class="btn-gray"
onclick="fitView()"
>
適合畫面
</button>

</div>


<div class="direction-buttons">

<div class="direction-empty"></div>

<button
id="dir-up"
class="btn-gray"
onclick="setDirection('up')"
>
↑
</button>

<div class="direction-empty"></div>


<button
id="dir-left"
class="btn-gray"
onclick="setDirection('left')"
>
←
</button>

<button
class="btn-gray"
disabled
>
●
</button>

<button
id="dir-right"
class="btn-gray"
onclick="setDirection('right')"
>
→
</button>


<div class="direction-empty"></div>

<button
id="dir-down"
class="btn-gray"
onclick="setDirection('down')"
>
↓
</button>

<div class="direction-empty"></div>

</div>


<div class="info">

電腦版可使用鍵盤
↑ ↓ ← →
切換牆線方向。

在牆長輸入框按 Enter，
會直接新增牆。

新增牆後輸入框會自動清空，
可以直接輸入下一段尺寸。

</div>

</div>


<!-- 窗戶 -->

<div
id="windowPanel"
class="card hidden"
>

<div class="card-title">
窗戶
</div>

<div class="row">

<button
class="btn-blue"
onclick="startWindowSelection()"
>
選擇牆
</button>

<span id="windowWallInfo">
尚未選擇牆
</span>

</div>


<div class="row">

<label>
左側／右側
</label>

<select id="windowSide">

<option value="left">
左側
</option>

<option value="right">
右側
</option>

</select>

<label>
距離
</label>

<input
id="windowOffset"
type="number"
placeholder="mm"
>

<label>
窗寬
</label>

<input
id="windowWidth"
type="number"
placeholder="mm"
>

<button
class="btn-blue"
onclick="addWindow()"
>
新增窗戶
</button>

</div>


<div class="info">

左側／右側以
「站在室內、面向這面牆」
的視角判斷。

距離是從門／窗靠近的那一端牆端開始計算。

</div>

</div>


<!-- 門 -->

<div
id="doorPanel"
class="card hidden"
>

<div class="card-title">
門
</div>

<div class="row">

<button
class="btn-blue"
onclick="startDoorSelection()"
>
選擇牆
</button>

<span id="doorWallInfo">
尚未選擇牆
</span>

</div>


<div class="row">

<label>
左側／右側
</label>

<select id="doorSide">

<option value="left">
左側
</option>

<option value="right">
右側
</option>

</select>

<label>
距離
</label>

<input
id="doorOffset"
type="number"
placeholder="mm"
>

<label>
門寬
</label>

<input
id="doorWidth"
type="number"
placeholder="mm"
>

<label>
開門
</label>

<select id="doorSwing">

<option value="left">
左開
</option>

<option value="right">
右開
</option>

</select>

<button
class="btn-blue"
onclick="addDoor()"
>
新增門
</button>

</div>


<div class="info">

左開門＝絞鍊在左側。

右開門＝絞鍊在右側。

左側／右側以
「站在室內、面向這面牆」
的視角判斷。

</div>

</div>


<!-- 樓高 -->

<div
id="heightPanel"
class="card hidden"
>

<div class="card-title">
樓高
</div>

<div class="row">

<label>
樓高
</label>

<input
id="floorHeight"
type="number"
placeholder="mm"
>

<button
class="btn-green"
onclick="setFloorHeight()"
>
設定樓高
</button>

</div>

</div>


<!-- 樑 -->

<div
id="beamPanel"
class="card hidden"
>

<div class="card-title">
樑
</div>

<div class="row">

<button
class="btn-blue"
onclick="startBeamSelection()"
>
選擇牆
</button>

<span id="beamWallInfo">
尚未選擇牆
</span>

</div>


<div class="row">

<label>
離牆
</label>

<input
id="beamDistance"
type="number"
placeholder="mm"
>

<label>
樑底高
</label>

<input
id="beamBottom"
type="number"
placeholder="mm"
>

<label>
樑深
</label>

<input
id="beamDepth"
type="number"
placeholder="mm"
>

<button
class="btn-red"
onclick="addBeam()"
>
新增樑
</button>

</div>


<div class="info">

樑高會依照：

樓高 − 樑底高

自動計算。

</div>

</div>


<!-- 畫布 -->

<div class="card">

<div class="card-title">
平面圖
</div>

<svg
id="drawing"
viewBox="-500 -500 1500 1500"
xmlns="http://www.w3.org/2000/svg"
>

<g id="drawingGroup"></g>

</svg>

</div>


</div>


<!-- 案件清單 -->

<div
id="caseModal"
class="modal hidden"
onclick="closeCaseList(event)"
>

<div
class="modal-box"
onclick="event.stopPropagation()"
>

<div class="modal-title">
案件
</div>

<div
id="caseList"
class="case-list"
></div>

<div class="modal-actions">

<button
class="btn-gray"
onclick="closeCaseList()"
>
關閉
</button>

</div>

</div>

</div>


<script>


/* =========================
   基本資料
========================= */

let currentTool="wall";

let currentDirection="right";

let walls=[];

let windows=[];

let doors=[];

let beams=[];

let points=[
{x:0,y:0}
];

let floorHeight=0;

let selectedWallIndex=-1;

let history=[];

let currentCaseId=null;


/* =========================
   案件
========================= */

function generateId(){

return Date.now().toString()+Math.random().toString(16).slice(2);

}


function newCase(){

const name=prompt("請輸入案件名稱");

if(!name){

return;

}

currentCaseId=generateId();

walls=[];

windows=[];

doors=[];

beams=[];

points=[
{x:0,y:0}
];

floorHeight=0;

history=[];

document.getElementById("caseName").value=name;

saveCase();

render();

}


function saveCase(){

const name=
document.getElementById("caseName").value.trim();

if(!name){

return;

}

if(!currentCaseId){

currentCaseId=generateId();

}

const cases=
JSON.parse(
localStorage.getItem("measureCases")||"[]"
);

const data={

id:currentCaseId,

name:name,

walls:walls,

windows:windows,

doors:doors,

beams:beams,

points:points,

floorHeight:floorHeight,

updatedAt:Date.now()

};

const index=
cases.findIndex(
x=>x.id===currentCaseId
);

if(index>=0){

cases[index]=data;

}else{

cases.push(data);

}

localStorage.setItem(
"measureCases",
JSON.stringify(cases)
);

}


function loadCase(data){

currentCaseId=data.id;

document.getElementById("caseName").value=data.name||"";

walls=data.walls||[];

windows=data.windows||[];

doors=data.doors||[];

beams=data.beams||[];

points=data.points||[{x:0,y:0}];

floorHeight=data.floorHeight||0;

history=[];

render();

}


function openCaseList(){

const modal=
document.getElementById("caseModal");

const list=
document.getElementById("caseList");

const cases=
JSON.parse(
localStorage.getItem("measureCases")||"[]"
);

list.innerHTML="";

if(cases.length===0){

list.innerHTML=
"<div class='small-note'>目前沒有案件</div>";

}else{

cases
.sort((a,b)=>
(b.updatedAt||0)-(a.updatedAt||0)
)
.forEach(data=>{

const item=
document.createElement("div");

item.className="case-item";

const name=
document.createElement("div");

name.className="case-name";

name.textContent=data.name;

const buttons=
document.createElement("div");

buttons.className="row";

const openBtn=
document.createElement("button");

openBtn.className="btn-blue";

openBtn.textContent="開啟";

openBtn.onclick=function(){

loadCase(data);

closeCaseList();

};

const deleteBtn=
document.createElement("button");

deleteBtn.className="btn-red";

deleteBtn.textContent="刪除";

deleteBtn.onclick=function(){

if(confirm("確定要刪除這個案件嗎？")){

deleteCase(data.id);

openCaseList();

}

};

buttons.appendChild(openBtn);

buttons.appendChild(deleteBtn);

item.appendChild(name);

item.appendChild(buttons);

list.appendChild(item);

});

}

modal.classList.remove("hidden");

}


function closeCaseList(event){

if(event && event.target!==event.currentTarget){

return;

}

document
.getElementById("caseModal")
.classList.add("hidden");

}


function deleteCase(id){

let cases=
JSON.parse(
localStorage.getItem("measureCases")||"[]"
);

cases=cases.filter(
x=>x.id!==id
);

localStorage.setItem(
"measureCases",
JSON.stringify(cases)
);

if(currentCaseId===id){

currentCaseId=null;

}

}


/* =========================
   工具切換
========================= */

function setTool(tool){

currentTool=tool;

document
.querySelectorAll(".tool-btn")
.forEach(btn=>{
btn.classList.remove("active");
});

const button=
document.getElementById("tool-"+tool);

if(button){

button.classList.add("active");

}

document
.getElementById("wallPanel")
.classList.toggle(
"hidden",
tool!=="wall"
);

document
.getElementById("windowPanel")
.classList.toggle(
"hidden",
tool!=="window"
);

document
.getElementById("doorPanel")
.classList.toggle(
"hidden",
tool!=="door"
);

document
.getElementById("heightPanel")
.classList.toggle(
"hidden",
tool!=="height"
);

document
.getElementById("beamPanel")
.classList.toggle(
"hidden",
tool!=="beam"
);

selectedWallIndex=-1;

render();

}


/* =========================
   方向
========================= */

function setDirection(direction){

currentDirection=direction;

["up","down","left","right"]
.forEach(dir=>{

const btn=
document.getElementById("dir-"+dir);

if(btn){

btn.classList.toggle(
"btn-blue",
dir===direction
);

btn.classList.toggle(
"btn-gray",
dir!==direction
);

}

});

}


setDirection("right");


/* =========================
   歷史
========================= */

function saveHistory(){

history.push(
JSON.stringify({

walls:walls,

windows:windows,

doors:doors,

beams:beams,

points:points,

floorHeight:floorHeight

})
);

if(history.length>30){

history.shift();

}

}


function undo(){

if(history.length===0){

return;

}

const state=
JSON.parse(
history.pop()
);

walls=state.walls||[];

windows=state.windows||[];

doors=state.doors||[];

beams=state.beams||[];

points=state.points||[{x:0,y:0}];

floorHeight=state.floorHeight||0;

saveCase();

render();

}


/* =========================
   牆線
========================= */

function addWall(){

const input=
document.getElementById("wallLength");

const length=
Number(input.value);

if(!length || length<=0){

input.focus();

return;

}

const last=
points[points.length-1];

let dx=0;

let dy=0;

if(currentDirection==="right")
dx=length;

if(currentDirection==="left")
dx=-length;

if(currentDirection==="down")
dy=length;

if(currentDirection==="up")
dy=-length;

const end={
x:last.x+dx,
y:last.y+dy
};

saveHistory();

walls.push({

start:{...last},

end:{...end},

length:length

});

points.push(end);

saveCase();

render();


/* 新增牆後清空輸入框 */

input.value="";


/* 電腦版繼續把游標留在牆長輸入框 */

setTimeout(function(){

input.focus();

},0);

}


function clearDrawing(){

if(!confirm("確定要清除目前圖面嗎？")){

return;

}

saveHistory();

walls=[];

windows=[];

doors=[];

beams=[];

points=[
{x:0,y:0}
];

selectedWallIndex=-1;

saveCase();

render();

}


/* =========================
   幾何
========================= */

function wallGeometry(wall){

const dx=
wall.end.x-wall.start.x;

const dy=
wall.end.y-wall.start.y;

const len=
Math.hypot(dx,dy);

if(!len){

return{
len:0,
ux:0,
uy:0,
nx:0,
ny:0
};

}

const ux=dx/len;

const uy=dy/len;

const nx=-uy;

const ny=ux;

return{
len:len,
ux:ux,
uy:uy,
nx:nx,
ny:ny
};

}


function pointToSegment(
px,
py,
x1,
y1,
x2,
y2
){

const dx=x2-x1;

const dy=y2-y1;

if(dx===0 && dy===0){

return{

distance:
Math.hypot(
px-x1,
py-y1
),

t:0

};

}

const t=
Math.max(
0,
Math.min(
1,
(
(px-x1)*dx+
(py-y1)*dy
)/
(dx*dx+dy*dy)
)
);

const x=
x1+t*dx;

const y=
y1+t*dy;

return{

distance:
Math.hypot(
px-x,
py-y
),

t:t

};

}


/* =========================
   室內中心
========================= */

function getRoomCenter(){

const all=[];

walls.forEach(w=>{

all.push(w.start);

all.push(w.end);

});

if(all.length===0){

return{
x:0,
y:0
};

}

let minX=Infinity;

let maxX=-Infinity;

let minY=Infinity;

let maxY=-Infinity;

all.forEach(p=>{

minX=Math.min(minX,p.x);

maxX=Math.max(maxX,p.x);

minY=Math.min(minY,p.y);

maxY=Math.max(maxY,p.y);

});

return{

x:(minX+maxX)/2,

y:(minY+maxY)/2

};

}


/* =========================
   左右參考
   以站在室內、
   面向牆面判斷
========================= */

function getWallReferenceInfo(wall){

if(!wall){

return{

leftAtStart:true,

rightAtStart:false

};

}

const g=
wallGeometry(wall);

if(!g.len){

return{

leftAtStart:true,

rightAtStart:false

};

}

const center=
getRoomCenter();

const midX=
(wall.start.x+wall.end.x)/2;

const midY=
(wall.start.y+wall.end.y)/2;

const toCenterX=
center.x-midX;

const toCenterY=
center.y-midY;

const cross=
g.ux*toCenterY-
g.uy*toCenterX;

if(Math.abs(cross)<0.001){

return{

leftAtStart:true,

rightAtStart:false

};

}

if(cross>0){

return{

leftAtStart:false,

rightAtStart:true

};

}

return{

leftAtStart:true,

rightAtStart:false

};

}


function referenceDistanceToOffset(
wall,
side,
distance,
width
){

const info=
getWallReferenceInfo(wall);

distance=
Number(distance)||0;

width=
Number(width)||0;

if(side==="left"){

if(info.leftAtStart){

return distance;

}else{

return wall.length-distance-width;

}

}

if(info.rightAtStart){

return distance;

}else{

return wall.length-distance-width;

}

}


function offsetToReferenceDistance(
wall,
side,
offset,
width
){

const info=
getWallReferenceInfo(wall);

offset=
Number(offset)||0;

width=
Number(width)||0;

if(side==="left"){

if(info.leftAtStart){

return offset;

}else{

return wall.length-offset-width;

}

}

if(info.rightAtStart){

return offset;

}else{

return wall.length-offset-width;

}

}


function tapDistanceToReference(
wall,
side,
tapDistance
){

const info=
getWallReferenceInfo(wall);

tapDistance=
Number(tapDistance)||0;

if(side==="left"){

return info.leftAtStart
?tapDistance
:wall.length-tapDistance;

}

return info.rightAtStart
?tapDistance
:wall.length-tapDistance;

}

function createSvgElement(

){

document.createElementNS(
"http://www.w3.org/2000/svg",
tag
);

Object.entries(attrs)
.forEach(([key,value])=>{
el.setAttribute(key,value);
});

return el;

}

/* =========================
   尺寸線
========================= */

function drawDimension(
group,
x1,
y1,
x2,
y2,
offset
){

const dx=x2-x1;

const dy=y2-y1;

const len=
Math.hypot(dx,dy);

if(!len){

return;

}

const ux=dx/len;

const uy=dy/len;

const nx=-uy;

const ny=ux;

const ax=
x1+nx*offset;

const ay=
y1+ny*offset;

const bx=
x2+nx*offset;

const by=
y2+ny*offset;

const line=
createSvgElement(
"line",
{
x1:ax,
y1:ay,
x2:bx,
y2:by,
"class":"dimension-line"
}
);

group.appendChild(line);

const tick1=
createSvgElement(
"line",
{
x1:ax-ux*25-nx*25,
y1:ay-uy*25-ny*25,
x2:ax+ux*25+nx*25,
y2:ay+uy*25+ny*25,
"class":"dimension-tick"
}
);

const tick2=
createSvgElement(
"line",
{
x1:bx-ux*25-nx*25,
y1:by-uy*25-ny*25,
x2:bx+ux*25+nx*25,
y2:by+uy*25+ny*25,
"class":"dimension-tick"
}
);

group.appendChild(tick1);

group.appendChild(tick2);

addText(
group,
(ax+bx)/2,
(ay+by)/2,
Math.round(len)+"",
"dimension-text"
);

}

wallGeometry(wall);

wall.start.x+

sx+

sy+

/*

  右開＝絞鍊在右側

  作為幾何基準。
*/

let hingeX;
let hingeY;

let freeY;

hingeX=sx;
hingeY=sy;

freeX=ex;
freeY=ey;

hingeY=ey;

freeY=sy;

${hingeX+g.nx*door.width}
${hingeY+g.ny*door.width}`,

}
);

group.appendChild(arc);

(sx+ex)/2+
g.nx*75;

(sy+ey)/2+
g.ny*75;

/* =========================

========================= */

function fitView(){

const svg=
document.getElementById("drawing");

const group=
document.getElementById("drawingGroup");

if(!group){

return;

}

const bbox=
group.getBBox();

if(
!bbox.width ||
!bbox.height
){

return;

}

const padding=350;

let x=
bbox.x-padding;

let y=
bbox.y-padding;

let width=
bbox.width+padding*2;

let height=
bbox.height+padding*2;

const minSize=1500;

if(width<minSize){

const extra=
(minSize-width)/2;

x-=extra;

width=minSize;

}

if(height<minSize){

const extra=
(minSize-height)/2;

y-=extra;

height=minSize;

}

svg.setAttribute(
"viewBox",
`${x} ${y} ${width} ${height}`
);

}

function getSvgPoint(evt){

const svg=
document.getElementById("drawing");

const pt=
svg.createSVGPoint();

pt.x=evt.clientX;

pt.y=evt.clientY;

const matrix=
svg.getScreenCTM();

if(!matrix){

return{
x:0,
y:0
};

}

return pt.matrixTransform(
matrix.inverse()
);

}


document

);

/* =========================
   鍵盤操作
========================= */

document.addEventListener(
"keydown",
function(evt){

const active=
document.activeElement;


/* Enter */

if(evt.key==="Enter"){

if(
currentTool==="wall" &&
active &&
active.id==="wallLength"
){

evt.preventDefault();

addWall();

return;

}

return;

}


/* 非牆線工具 */

if(currentTool!=="wall"){

return;

}


const directionMap={

ArrowUp:"up",

ArrowDown:"down",

ArrowLeft:"left",

ArrowRight:"right"

};

const direction=
directionMap[evt.key];

if(!direction){

return;

}


/*
  如果正在牆長輸入框：
  方向鍵用來選方向
*/

if(
active &&
active.id==="wallLength"
){

evt.preventDefault();

setDirection(direction);

return;

}


/*
  其他輸入框不要搶方向鍵
*/

if(
active &&
(
active.tagName==="INPUT" ||
active.tagName==="TEXTAREA" ||
active.tagName==="SELECT"
)
){

return;

}

evt.preventDefault();

setDirection(direction);

}
);

}
);

);

canvas.height
);

URL.revokeObjectURL(url);

canvas.toBlob(
function(blob){

(
document.getElementById("caseName").value||

/* =========================
   簡易 PDF 產生
========================= */

function createSimplePDF(
imageData,
width,
height
){

const binary=
atob(
imageData.split(",")[1]
);

const imgBytes=
new Uint8Array(
binary.length
);

for(
let i=0;
i<binary.length;
i++
){

imgBytes[i]=
binary.charCodeAt(i);

}

const encoder=
new TextEncoder();

const objects=[];

objects.push(
encoder.encode(
"1 0 obj\n"+
"<< /Type /Catalog /Pages 2 0 R >>\n"+
"endobj\n"
)
);

objects.push(
encoder.encode(
"2 0 obj\n"+
"<< /Type /Pages /Kids [3 0 R] /Count 1 >>\n"+
"endobj\n"
)
);

objects.push(
encoder.encode(
"3 0 obj\n"+
"<< /Type /Page /Parent 2 0 R "+
"/MediaBox [0 0 "+width+" "+height+"] "+
"/Resources << /XObject << /Im0 4 0 R >> >> "+
"/Contents 5 0 R >>\n"+
"endobj\n"
)
);

const imageHeader=
encoder.encode(
"4 0 obj\n"+
"<< /Type /XObject "+
"/Subtype /Image "+
"/Width "+width+" "+
"/Height "+height+" "+
"/ColorSpace /DeviceRGB "+
"/BitsPerComponent 8 "+
"/Filter /DCTDecode "+
"/Length "+imgBytes.length+" >>\n"+
"stream\n"
);

const imageFooter=
encoder.encode(
"\nendstream\n"+
"endobj\n"
);

objects.push(
concatUint8(
imageHeader,
imgBytes,
imageFooter
)
);

const content=
"q\n"+
width+" 0 0 "+height+" 0 0 cm\n"+
"/Im0 Do\n"+
"Q\n";

objects.push(
encoder.encode(
"5 0 obj\n"+
"<< /Length "+content.length+" >>\n"+
"stream\n"+
content+
"endstream\n"+
"endobj\n"
)
);

let pdfParts=[];

const header=
encoder.encode(
"%PDF-1.4\n%\xFF\xFF\xFF\xFF\n"
);

pdfParts.push(header);

let offset=header.length;

const offsets=[0];

objects.forEach(obj=>{

offsets.push(offset);

pdfParts.push(obj);

offset+=obj.length;

});

let xref="xref\n0 "+(objects.length+1)+"\n";

xref+="0000000000 65535 f \n";

for(
let i=1;
i<offsets.length;
i++
){

xref+=
String(offsets[i])
.padStart(10,"0")+
" 00000 n \n";

}

const trailer=
"trailer\n"+
"<< /Size "+(objects.length+1)+
" /Root 1 0 R >>\n"+
"startxref\n"+
offset+
"\n%%EOF";

pdfParts.push(
encoder.encode(
xref+
trailer
)
);

return new Blob(
pdfParts,
{
type:"application/pdf"
}
);

}


function concatUint8(
...arrays
){

let total=0;

arrays.forEach(
a=>total+=a.length
);

const result=
new Uint8Array(total);

let offset=0;

arrays.forEach(a=>{

result.set(
a,
offset
);

offset+=a.length;

});

return result;

}

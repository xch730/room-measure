<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房屋丈量畫圖工具</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#fff;
  padding:14px 16px;
  border-bottom:1px solid #ddd;
}

h1{
  font-size:18px;
  margin:0 0 8px;
}

.case-row{
  display:flex;
  gap:8px;
}

.case-row input{
  flex:1;
  height:42px;
  border:1px solid #ccc;
  border-radius:9px;
  padding:0 12px;
  font-size:15px;
}

.case-row button{
  border:0;
  border-radius:9px;
  padding:0 14px;
  background:#111;
  color:white;
}

.case-name{
  font-size:13px;
  color:#666;
  margin-top:7px;
}

.canvas-wrap{
  height:50vh;
  min-height:350px;
  background:white;
  margin:12px;
  border:1px solid #ddd;
  border-radius:12px;
  overflow:hidden;
}

svg{
  width:100%;
  height:100%;
  display:block;
  background:#fafafa;
}

.controls{
  background:#fff;
  padding:14px 14px 24px;
  border-top:1px solid #ddd;
}

.direction-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  max-width:320px;
  margin:0 auto 14px;
}

.dir{
  height:48px;
  border:1px solid #ccc;
  background:#fff;
  border-radius:10px;
  font-size:22px;
}

.dir.active{
  background:#222;
  color:#fff;
}

.dir.up{grid-column:2}
.dir.left{grid-column:1;grid-row:2}
.dir.center{
  grid-column:2;
  grid-row:2;
  background:#f2f2f2;
  font-size:13px;
}
.dir.right{grid-column:3;grid-row:2}
.dir.down{grid-column:2;grid-row:3}

.input-row{
  display:flex;
  gap:8px;
  max-width:520px;
  margin:auto;
}

#length{
  flex:1;
  height:48px;
  border:1px solid #ccc;
  border-radius:10px;
  padding:0 14px;
  font-size:18px;
}

.primary{
  height:48px;
  padding:0 18px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
  font-size:16px;
}

.action-row{
  display:flex;
  gap:8px;
  max-width:520px;
  margin:10px auto 0;
}

.action-row button{
  flex:1;
  height:42px;
  border:1px solid #ccc;
  background:#fff;
  border-radius:10px;
}

.hint{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:10px;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:flex-end;
  z-index:100;
}

.panel{
  width:100%;
  background:white;
  border-radius:18px 18px 0 0;
  padding:20px;
  max-height:70vh;
  overflow:auto;
}

.panel h2{
  margin:0 0 15px;
  font-size:20px;
}

.case-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.case-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
}

.case-item button{
  margin-left:auto;
  border:0;
  background:#eee;
  border-radius:8px;
  padding:8px 10px;
}

.close-btn{
  width:100%;
  height:44px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
}
</style>
</head>

<body>

<header>

<h1>📐 房屋丈量畫圖工具</h1>

<div class="case-row">

<input
  id="caseName"
  type="text"
  placeholder="輸入案件名稱，例如：王先生左營案">

<button id="newCase">
  新案件
</button>

<button id="openCases">
  案件
</button>

</div>

<div class="case-name" id="currentCase">
  尚未建立案件
</div>

</header>


<div class="canvas-wrap">

<svg id="plan"
     viewBox="-500 -500 1000 1000"
     preserveAspectRatio="xMidYMid meet">

<defs>

<pattern
  id="grid"
  width="100"
  height="100"
  patternUnits="userSpaceOnUse">

<path
  d="M 100 0 L 0 0 0 100"
  fill="none"
  stroke="#e9e9e9"
  stroke-width="1"/>

</pattern>

</defs>

<rect
  x="-10000"
  y="-10000"
  width="20000"
  height="20000"
  fill="url(#grid)"/>

<g id="drawing"></g>

</svg>

</div>


<div class="controls">

<div class="direction-grid">

<button class="dir up" data-dir="up">↑</button>

<button class="dir left" data-dir="left">←</button>

<button class="dir center" id="currentDir">→</button>

<button class="dir right" data-dir="right">→</button>

<button class="dir down" data-dir="down">↓</button>

</div>


<div class="input-row">

<input
  id="length"
  type="number"
  inputmode="numeric"
  min="1"
  placeholder="輸入長度，例如 3200">

<button class="primary" id="add">
新增線段
</button>

</div>


<div class="action-row">

<button id="undo">
↩ 上一步
</button>

<button id="clear">
🗑 清除
</button>

</div>


<div class="hint">
單位：mm　每次新增後會自動儲存
</div>

</div>


<!-- 案件清單 -->

<div class="overlay" id="overlay">

<div class="panel">

<h2>📁 我的案件</h2>

<div class="case-list" id="caseList"></div>

<button class="close-btn" id="closeCases">
關閉
</button>

</div>

</div>


<script>

const svg=document.getElementById("plan");
const drawing=document.getElementById("drawing");

const lengthInput=document.getElementById("length");

const caseNameInput=document.getElementById("caseName");

const currentCase=document.getElementById("currentCase");

const currentDirBtn=document.getElementById("currentDir");

const overlay=document.getElementById("overlay");

const caseList=document.getElementById("caseList");


let direction="right";

let points=[{x:0,y:0}];

let segments=[];

let currentCaseId=null;


const dirNames={
  up:"↑ 上",
  down:"↓ 下",
  left:"← 左",
  right:"→ 右"
};


/* =========================
   案件儲存
========================= */

function getCases(){

  return JSON.parse(
    localStorage.getItem("measureCases") || "{}"
  );

}


function saveCase(){

  if(!currentCaseId){
    return;
  }

  const cases=getCases();

  cases[currentCaseId]={

    name:caseNameInput.value || "未命名案件",

    points:points,

    segments:segments,

    updatedAt:Date.now()

  };

  localStorage.setItem(
    "measureCases",
    JSON.stringify(cases)
  );

}


function createNewCase(){

  const name=caseNameInput.value.trim();

  if(!name){

    alert("請先輸入案件名稱");

    caseNameInput.focus();

    return;
  }


  currentCaseId=
    Date.now().toString();


  points=[{x:0,y:0}];

  segments=[];

  currentCase.textContent=
    "目前案件："+name;

  render();

  saveCase();

}


function loadCase(id){

  const cases=getCases();

  const data=cases[id];

  if(!data){
    return;
  }


  currentCaseId=id;

  caseNameInput.value=data.name;

  currentCase.textContent=
    "目前案件："+data.name;


  points=data.points || [{x:0,y:0}];

  segments=data.segments || [];


  overlay.style.display="none";

  render();

}


function deleteCase(id){

  const cases=getCases();

  if(!cases[id]){
    return;
  }


  if(!confirm("確定要刪除這個案件嗎？")){
    return;
  }


  delete cases[id];

  localStorage.setItem(
    "measureCases",
    JSON.stringify(cases)
  );


  if(currentCaseId===id){

    currentCaseId=null;

    caseNameInput.value="";

    currentCase.textContent=
      "尚未建立案件";

    points=[{x:0,y:0}];

    segments=[];

    render();

  }


  showCases();

}


function showCases(){

  const cases=getCases();

  caseList.innerHTML="";


  const ids=Object.keys(cases)
    .sort((a,b)=>
      cases[b].updatedAt-cases[a].updatedAt
    );


  if(ids.length===0){

    caseList.innerHTML=
      "<div style='color:#777'>目前沒有案件</div>";

  }


  ids.forEach(id=>{

    const item=
      document.createElement("div");

    item.className="case-item";


    const title=
      document.createElement("span");

    title.textContent=
      cases[id].name;


    const open=
      document.createElement("button");

    open.textContent="開啟";

    open.onclick=()=>{
      loadCase(id);
    };


    const del=
      document.createElement("button");

    del.textContent="刪除";

    del.onclick=()=>{
      deleteCase(id);
    };


    item.appendChild(title);

    item.appendChild(open);

    item.appendChild(del);

    caseList.appendChild(item);

  });


  overlay.style.display="flex";

}


/* =========================
   方向
========================= */

document
.querySelectorAll(".dir[data-dir]")
.forEach(btn=>{

  btn.addEventListener("click",()=>{

    direction=btn.dataset.dir;

    updateDirectionUI();

  });

});


function updateDirectionUI(){

  document
  .querySelectorAll(".dir[data-dir]")
  .forEach(btn=>{

    btn.classList.toggle(
      "active",
      btn.dataset.dir===direction
    );

  });


  currentDirBtn.textContent=
    dirNames[direction].split(" ")[0];

}


/* =========================
   新增線段
========================= */

function addSegment(){

  if(!currentCaseId){

    alert("請先建立案件");

    return;

  }


  const len=Number(
    lengthInput.value
  );


  if(!len || len<=0){

    alert("請輸入正確尺寸");

    return;

  }


  const start=
    points[points.length-1];


  let end={...start};


  if(direction==="right")
    end.x+=len;

  if(direction==="left")
    end.x-=len;

  if(direction==="down")
    end.y+=len;

  if(direction==="up")
    end.y-=len;


  segments.push({

    start:{...start},

    end:{...end},

    length:len,

    direction:direction

  });


  points.push(end);


  lengthInput.value="";


  render();

  saveCase();

  lengthInput.focus();

}


/* =========================
   上一步
========================= */

document
.getElementById("undo")
.addEventListener("click",()=>{

  if(!segments.length)
    return;


  segments.pop();

  points.pop();


  render();

  saveCase();

});


/* =========================
   清除
========================= */

document
.getElementById("clear")
.addEventListener("click",()=>{

  if(!segments.length)
    return;


  if(confirm("確定清除目前案件的全部線段嗎？")){

    points=[{x:0,y:0}];

    segments=[];

    render();

    saveCase();

  }

});


/* =========================
   按鈕
========================= */

document
.getElementById("newCase")
.addEventListener(
  "click",
  createNewCase
);


document
.getElementById("openCases")
.addEventListener(
  "click",
  showCases
);


document
.getElementById("closeCases")
.addEventListener(
  "click",
  ()=>{
    overlay.style.display="none";
  }
);


document
.getElementById("add")
.addEventListener(
  "click",
  addSegment
);


lengthInput.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Enter"){
      addSegment();
    }

  }
);


/* =========================
   SVG
========================= */

function el(name,attrs={}){

  const n=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      name
    );


  Object.entries(attrs)
  .forEach(([k,v])=>{
    n.setAttribute(k,v);
  });


  return n;

}


function render(){

  drawing.innerHTML="";


  segments.forEach(s=>{

    const line=el("line",{

      x1:s.start.x,

      y1:s.start.y,

      x2:s.end.x,

      y2:s.end.y,

      stroke:"#111",

      "stroke-width":8,

      "stroke-linecap":"round"

    });


    drawing.appendChild(line);


    const mx=
      (s.start.x+s.end.x)/2;

    const my=
      (s.start.y+s.end.y)/2;


    const text=el("text",{

      x:mx,

      y:my,

      "font-size":
        Math.max(
          45,
          Math.min(90,s.length/15)
        ),

      "text-anchor":"middle",

      "dominant-baseline":"middle",

      fill:"#111",

      "font-weight":"600"

    });


    if(
      s.direction==="up" ||
      s.direction==="down"
    ){

      text.setAttribute(
        "transform",
        `rotate(-90 ${mx} ${my})`
      );

    }


    text.textContent=
      `${s.length} mm`;


    drawing.appendChild(text);


    const point=el("circle",{

      cx:s.end.x,

      cy:s.end.y,

      r:12,

      fill:"#111"

    });


    drawing.appendChild(point);

  });


  fitView();

}


function fitView(){

  const pad=500;


  const xs=
    points.map(p=>p.x);

  const ys=
    points.map(p=>p.y);


  const minX=
    Math.min(...xs)-pad;

  const maxX=
    Math.max(...xs)+pad;

  const minY=
    Math.min(...ys)-pad;

  const maxY=
    Math.max(...ys)+pad;


  const w=
    Math.max(maxX-minX,1000);

  const h=
    Math.max(maxY-minY,800);


  svg.setAttribute(
    "viewBox",
    `${minX} ${minY} ${w} ${h}`
  );

}


/* =========================
   啟動
========================= */

updateDirectionUI();

render();

</script>

</body>
</html>

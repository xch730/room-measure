<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>房屋丈量畫圖工具</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;
background:#f3f4f6;
color:#222;
}

header{
background:#111827;
color:white;
padding:14px 16px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:20;
}

header h1{
font-size:18px;
margin:0;
}

.header-buttons{
display:flex;
gap:8px;
}

button{
border:0;
border-radius:8px;
padding:9px 12px;
font-size:15px;
cursor:pointer;
}

button:active{
transform:scale(.97);
}

button:disabled{
opacity:.7;
cursor:default;
}

.btn-dark{
background:#374151;
color:white;
}

.btn-blue{
background:#2563eb;
color:white;
}

.btn-red{
background:#dc2626;
color:white;
}

.btn-green{
background:#16a34a;
color:white;
}

.btn-gray{
background:#e5e7eb;
color:#111;
}

.container{
padding:12px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
border-radius:12px;
padding:12px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card-title{
font-weight:bold;
font-size:16px;
margin-bottom:10px;
}

.row{
display:flex;
gap:8px;
align-items:center;
flex-wrap:wrap;
}

input,
select{
font-size:16px;
padding:9px 10px;
border:1px solid #d1d5db;
border-radius:8px;
background:white;
}

input[type="number"]{
width:130px;
}

.tool-buttons{
display:flex;
gap:7px;
flex-wrap:wrap;
}

.tool-btn{
background:#f3f4f6;
border:2px solid transparent;
}

.tool-btn.active{
background:#dbeafe;
border-color:#2563eb;
color:#1d4ed8;
font-weight:bold;
}

.direction-buttons{
display:grid;
grid-template-columns:repeat(3,50px);
gap:5px;
justify-content:center;
margin:10px 0;
}

.direction-buttons button{
height:45px;
padding:0;
font-size:22px;
}

.direction-empty{
visibility:hidden;
}

.info{
background:#eff6ff;
border:1px solid #bfdbfe;
border-radius:8px;
padding:9px;
font-size:13px;
line-height:1.6;
color:#1e40af;
}

.warning{
background:#fff7ed;
border:1px solid #fed7aa;
border-radius:8px;
padding:9px;
font-size:13px;
line-height:1.6;
color:#9a3412;
}

.case-list{
display:flex;
flex-direction:column;
gap:7px;
}

.case-item{
display:flex;
align-items:center;
justify-content:space-between;
padding:10px;
border:1px solid #e5e7eb;
border-radius:8px;
background:#fafafa;
}

.case-name{
font-weight:bold;
}

.export-buttons{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px;
}

.export-buttons button{
flex:1;
min-width:140px;
}

svg{
width:100%;
height:65vh;
min-height:450px;
background:#fff;
border:1px solid #d1d5db;
border-radius:10px;
touch-action:none;
display:block;
}

.wall{
stroke:#111;
stroke-width:24;
stroke-linecap:round;
}

.window{
stroke:#2563eb;
stroke-width:18;
}

.window-line{
stroke:#2563eb;
stroke-width:8;
}

.door{
stroke:#f97316;
stroke-width:18;
}

.door-leaf{
stroke:#f97316;
stroke-width:14;
}

.door-arc{
fill:none;
stroke:#f97316;
stroke-width:8;
stroke-dasharray:18 12;
}

.beam{
stroke:#dc2626;
stroke-width:28;
stroke-dasharray:35 20;
}

.selected-wall{
stroke:#9333ea;
stroke-width:35;
stroke-dasharray:20 15;
}

.dimension-line{
stroke:#6b7280;
stroke-width:5;
}

.dimension-tick{
stroke:#6b7280;
stroke-width:5;
}

.dimension-text{
font-size:70px;
font-weight:bold;
fill:#374151;
}

.window-text{
font-size:58px;
font-weight:bold;
fill:#2563eb;
}

.door-text{
font-size:58px;
font-weight:bold;
fill:#ea580c;
}

.offset-text{
font-size:50px;
font-weight:bold;
fill:#4b5563;
}

.height-text{
font-size:82px;
font-weight:bold;
fill:#059669;
}

.beam-text{
font-size:60px;
font-weight:bold;
fill:#dc2626;
}

.beam-distance-text{
font-size:50px;
font-weight:bold;
fill:#dc2626;
}

.center-label{
font-size:34px;
font-weight:bold;
fill:#6b7280;
}

.opening-info-text{
font-size:46px;
font-weight:bold;
}

.window-detail-text{
fill:#2563eb;
}

.door-detail-text{
fill:#ea580c;
}

.small-note{
font-size:12px;
color:#6b7280;
margin-top:5px;
}

.hidden{
display:none !important;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:flex;
align-items:center;
justify-content:center;
z-index:100;
padding:20px;
}

.modal-box{
background:white;
width:100%;
max-width:430px;
border-radius:14px;
padding:18px;
box-shadow:0 10px 40px rgba(0,0,0,.2);
}

.modal-title{
font-size:18px;
font-weight:bold;
margin-bottom:12px;
}

.modal-actions{
display:flex;
gap:8px;
justify-content:flex-end;
margin-top:15px;
}

.field-group{
display:flex;
flex-direction:column;
gap:4px;
}

.field-group label{
font-size:13px;
color:#4b5563;
font-weight:600;
}

.opening-fields{
display:flex;
gap:8px;
flex-wrap:wrap;
align-items:flex-end;
}

@media(max-width:600px){

header h1{
font-size:16px;
}

header{
padding:11px 12px;
}

.container{
padding:8px;
}

.card{
padding:10px;
}

svg{
height:58vh;
min-height:400px;
}

input[type="number"]{
width:120px;
}

.opening-fields{
display:grid;
grid-template-columns:repeat(2,1fr);
}

.opening-fields .field-group{
width:100%;
}

.opening-fields select{
width:100%;
}

.opening-fields input{
width:100%;
}

.opening-fields button{
grid-column:1 / -1;
}

}

</style>

</head>

<body>


<header>

<h1>房屋丈量畫圖工具</h1>

<div class="header-buttons">

<button
class="btn-dark"
onclick="newCase()"
>
＋案件
</button>

<button
class="btn-dark"
onclick="openCaseList()"
>
📁
</button>

</div>

</header>


<div class="container">


<!-- 案件 -->

<div class="card">

<div class="card-title">
目前案件
</div>

<div class="row">

<input
id="caseName"
type="text"
placeholder="案件名稱"
style="flex:1;min-width:180px;"
onchange="saveCase()"
>

<button
class="btn-blue"
onclick="saveCase()"
>
儲存
</button>

</div>

</div>


<!-- 工具 -->

<div class="card">

<div class="card-title">
工具
</div>

<div class="tool-buttons">

<button
id="tool-wall"
class="tool-btn active"
onclick="setTool('wall')"
>
🧱 牆線
</button>

<button
id="tool-window"
class="tool-btn"
onclick="setTool('window')"
>
🪟 窗戶
</button>

<button
id="tool-door"
class="tool-btn"
onclick="setTool('door')"
>
🚪 門
</button>

<button
id="tool-height"
class="tool-btn"
onclick="setTool('height')"
>
🏠 樓高
</button>

<button
id="tool-beam"
class="tool-btn"
onclick="setTool('beam')"
>
▰ 樑
</button>

</div>

</div>


<!-- 牆線 -->

<div
id="wallPanel"
class="card"
>

<div class="card-title">
牆線
</div>

<div class="row">

<label>
牆長
</label>

<input
id="wallLength"
type="number"
inputmode="numeric"
placeholder="mm"
autocomplete="off"
>

<button
class="btn-blue"
onclick="addWall()"
>
新增牆
</button>

<button
class="btn-gray"
onclick="undo()"
>
↩ 復原
</button>

<button
class="btn-red"
onclick="clearDrawing()"
>
清除
</button>

<button
class="btn-gray"
onclick="fitView()"
>
適合畫面
</button>

</div>


<div class="direction-buttons">

<div class="direction-empty"></div>

<button
id="dir-up"
class="btn-gray"
onclick="setDirection('up')"
>
↑
</button>

<div class="direction-empty"></div>

<button
id="dir-left"
class="btn-gray"
onclick="setDirection('left')"
>
←
</button>

<button
class="btn-gray"
disabled
>
●
</button>

<button
id="dir-right"
class="btn-gray"
onclick="setDirection('right')"
>
→
</button>

<div class="direction-empty"></div>

<button
id="dir-down"
class="btn-gray"
onclick="setDirection('down')"
>
↓
</button>

<div class="direction-empty"></div>

</div>


<div class="info">

電腦版可使用鍵盤
↑ ↓ ← →
切換牆線方向。<br>

在牆長輸入框按 Enter，
會直接新增牆。<br>

新增牆後會清空尺寸，
游標繼續停在牆長輸入框，
可以直接輸入下一段尺寸。

</div>

</div>


<!-- 窗戶 -->

<div
id="windowPanel"
class="card hidden"
>

<div class="card-title">
🪟 窗戶
</div>

<div class="row">

<button
class="btn-blue"
onclick="startWindowSelection()"
>
選擇牆
</button>

<span id="windowWallInfo">
尚未選擇牆
</span>

</div>


<div class="opening-fields">

<div class="field-group">

<label>
左側／右側
</label>

<select id="windowSide">

<option value="left">
左側
</option>

<option value="right">
右側
</option>

</select>

</div>


<div class="field-group">

<label>
離牆端距離
</label>

<input
id="windowOffset"
type="number"
inputmode="numeric"
placeholder="mm"
>

</div>


<div class="field-group">

<label>
窗寬
</label>

<input
id="windowWidth"
type="number"
inputmode="numeric"
placeholder="mm"
>

</div>


<div class="field-group">

<label>
窗高
</label>

<input
id="windowHeight"
type="number"
inputmode="numeric"
placeholder="mm"
>

</div>


<div class="field-group">

<label>
窗離地
</label>

<input
id="windowSillHeight"
type="number"
inputmode="numeric"
placeholder="mm"
value="900"
>

</div>


<button
class="btn-blue"
onclick="addWindow()"
>
新增窗戶
</button>

</div>


<div class="info">

左右側以「站在室內、面向這面牆」判斷。<br>

離牆端距離＝從你選擇的左側／右側牆端，
量到窗戶開始的位置。<br>

窗戶會記錄：
<strong>窗寬、窗高、窗離地</strong>。

</div>

</div>


<!-- 門 -->

<div
id="doorPanel"
class="card hidden"
>

<div class="card-title">
🚪 門
</div>

<div class="row">

<button
class="btn-blue"
onclick="startDoorSelection()"
>
選擇牆
</button>

<span id="doorWallInfo">
尚未選擇牆
</span>

</div>


<div class="opening-fields">

<div class="field-group">

<label>
左側／右側
</label>

<select id="doorSide">

<option value="left">
左側
</option>

<option value="right">
右側
</option>

</select>

</div>


<div class="field-group">

<label>
離牆端距離
</label>

<input
id="doorOffset"
type="number"
inputmode="numeric"
placeholder="mm"
>

</div>


<div class="field-group">

<label>
門寬
</label>

<input
id="doorWidth"
type="number"
inputmode="numeric"
placeholder="mm"
>

</div>


<div class="field-group">

<label>
門高
</label>

<input
id="doorHeight"
type="number"
inputmode="numeric"
placeholder="mm"
>

</div>


<div class="field-group">

<label>
門離地
</label>

<input
id="doorFloorHeight"
type="number"
inputmode="numeric"
placeholder="mm"
value="0"
>

</div>


<div class="field-group">

<label>
開門方向
</label>

<select id="doorSwing">

<option value="left">
左開
</option>

<option value="right">
右開
</option>

</select>

</div>


<button
class="btn-blue"
onclick="addDoor()"
>
新增門
</button>

</div>


<div class="info">

左右側以「站在室內、面向這面牆」判斷。<br>

<strong>左開＝鉸鍊在左側。</strong><br>

<strong>右開＝鉸鍊在右側。</strong><br>

門會記錄：
<strong>門寬、門高、門離地</strong>。

</div>

</div>


<!-- 樓高 -->

<div
id="heightPanel"
class="card hidden"
>

<div class="card-title">
🏠 樓高
</div>

<div class="row">

<label>
樓高
</label>

<input
id="floorHeight"
type="number"
inputmode="numeric"
placeholder="mm"
>

<button
class="btn-green"
onclick="setFloorHeight()"
>
設定樓高
</button>

</div>

</div>


<!-- 樑 -->

<div
id="beamPanel"
class="card hidden"
>

<div class="card-title">
▰ 樑
</div>

<div class="row">

<button
class="btn-blue"
onclick="startBeamSelection()"
>
選擇牆
</button>

<span id="beamWallInfo">
尚未選擇牆
</span>

</div>


<div class="opening-fields">

<div class="field-group">

<label>
離牆
</label>

<input
id="beamDistance"
type="number"
inputmode="numeric"
placeholder="mm"
>

</div>


<div class="field-group">

<label>
樑底高
</label>

<input
id="beamBottom"
type="number"
inputmode="numeric"
placeholder="mm"
>

</div>


<div class="field-group">

<label>
樑深
</label>

<input
id="beamDepth"
type="number"
inputmode="numeric"
placeholder="mm"
>

</div>


<button
class="btn-red"
onclick="addBeam()"
>
新增樑
</button>

</div>


<div class="info">

樑高會依照：
樓高 − 樑底高
自動計算。

</div>

</div>


<!-- 圖面 -->

<div class="card">

<div class="card-title">
平面圖
</div>

<svg
id="drawing"
viewBox="-500 -500 1500 1500"
xmlns="http://www.w3.org/2000/svg"
>

<g id="drawingGroup"></g>

</svg>


<div class="export-buttons">

<button
class="btn-green"
onclick="exportJPG()"
>
📷 匯出 JPG
</button>

<button
class="btn-blue"
onclick="exportPDF()"
>
📄 匯出 PDF
</button>

</div>

</div>


</div>


<!-- 案件視窗 -->

<div
id="caseModal"
class="modal hidden"
onclick="closeCaseList(event)"
>

<div
class="modal-box"
onclick="event.stopPropagation()"
>

<div class="modal-title">
案件
</div>

<div
id="caseList"
class="case-list"
></div>

<div class="modal-actions">

<button
class="btn-gray"
onclick="closeCaseList()"
>
關閉
</button>

</div>

</div>

</div>


<script>


/* =========================================================
   基本資料
========================================================= */

let currentTool="wall";

let currentDirection="right";

let walls=[];

let windows=[];

let doors=[];

let beams=[];

let points=[
{x:0,y:0}
];

let floorHeight=0;

let selectedWallIndex=-1;

let history=[];

let currentCaseId=null;


/* =========================================================
   案件
========================================================= */

function generateId(){

return Date.now().toString()+
Math.random().toString(16).slice(2);

}


function newCase(){

const name=
prompt("請輸入案件名稱");

if(!name){

return;

}

currentCaseId=
generateId();

walls=[];

windows=[];

doors=[];

beams=[];

points=[
{x:0,y:0}
];

floorHeight=0;

history=[];

document
.getElementById("caseName")
.value=name;

saveCase();

render();

fitView();

}


function saveCase(){

const name=
document
.getElementById("caseName")
.value
.trim();

if(!name){

return;

}

if(!currentCaseId){

currentCaseId=
generateId();

}

const cases=
JSON.parse(
localStorage.getItem("measureCases")||"[]"
);

const data={

id:currentCaseId,

name:name,

walls:walls,

windows:windows,

doors:doors,

beams:beams,

points:points,

floorHeight:floorHeight,

updatedAt:Date.now()

};

const index=
cases.findIndex(
x=>x.id===currentCaseId
);

if(index>=0){

cases[index]=data;

}else{

cases.push(data);

}

localStorage.setItem(
"measureCases",
JSON.stringify(cases)
);

}


function loadCase(data){

currentCaseId=data.id;

document
.getElementById("caseName")
.value=data.name||"";


walls=
data.walls||[];


/*
舊案件相容：
沒有 side 就預設 left
沒有 height 就 0
沒有 sillHeight 就 900
*/

windows=
(data.windows||[]).map(x=>({

wallIndex:
Number(x.wallIndex)||0,

offset:
Number(x.offset)||0,

width:
Number(x.width)||0,

height:
Number(x.height)||0,

sillHeight:
Number(
x.sillHeight ??
x.windowSillHeight ??
900
),

side:
x.side==="right"
?"right"
:"left"

}));


doors=
(data.doors||[]).map(x=>({

wallIndex:
Number(x.wallIndex)||0,

offset:
Number(x.offset)||0,

width:
Number(x.width)||0,

height:
Number(x.height)||0,

floorHeight:
Number(
x.floorHeight ??
x.doorFloorHeight ??
0
),

swing:
x.swing==="right"
?"right"
:"left",

side:
x.side==="right"
?"right"
:"left"

}));


beams=
(data.beams||[]).map(x=>({

wallIndex:
Number(x.wallIndex)||0,

distance:
Number(x.distance)||0,

bottom:
Number(x.bottom)||0,

depth:
Number(x.depth)||0

}));


points=
data.points||[
{x:0,y:0}
];

floorHeight=
Number(data.floorHeight)||0;

history=[];

selectedWallIndex=-1;

render();

setTimeout(function(){

fitView();

},50);

}


function openCaseList(){

const modal=
document.getElementById("caseModal");

const list=
document.getElementById("caseList");

const cases=
JSON.parse(
localStorage.getItem("measureCases")||"[]"
);

list.innerHTML="";

if(cases.length===0){

list.innerHTML=
"<div class='small-note'>目前沒有案件</div>";

}else{

cases
.sort(
(a,b)=>
(b.updatedAt||0)-
(a.updatedAt||0)
)
.forEach(data=>{

const item=
document.createElement("div");

item.className="case-item";


const name=
document.createElement("div");

name.className="case-name";

name.textContent=data.name;


const buttons=
document.createElement("div");

buttons.className="row";


const openBtn=
document.createElement("button");

openBtn.className="btn-blue";

openBtn.textContent="開啟";

openBtn.onclick=function(){

loadCase(data);

closeCaseList();

};


const deleteBtn=
document.createElement("button");

deleteBtn.className="btn-red";

deleteBtn.textContent="刪除";

deleteBtn.onclick=function(){

if(
confirm("確定要刪除這個案件嗎？")
){

deleteCase(data.id);

openCaseList();

}

};


buttons.appendChild(openBtn);

buttons.appendChild(deleteBtn);

item.appendChild(name);

item.appendChild(buttons);

list.appendChild(item);

});

}

modal.classList.remove("hidden");

}


function closeCaseList(event){

if(
event &&
event.target!==event.currentTarget
){

return;

}

document
.getElementById("caseModal")
.classList
.add("hidden");

}


function deleteCase(id){

let cases=
JSON.parse(
localStorage.getItem("measureCases")||"[]"
);

cases=
cases.filter(
x=>x.id!==id
);

localStorage.setItem(
"measureCases",
JSON.stringify(cases)
);

if(currentCaseId===id){

currentCaseId=null;

}

}


/* =========================================================
   工具
========================================================= */

function setTool(tool){

currentTool=tool;

document
.querySelectorAll(".tool-btn")
.forEach(btn=>{
btn.classList.remove("active");
});

const button=
document.getElementById(
"tool-"+tool
);

if(button){

button.classList.add("active");

}

document
.getElementById("wallPanel")
.classList
.toggle(
"hidden",

/* =========================================================
   幾何
========================================================= */

function wallGeometry(wall){

const dx=
wall.end.x-wall.start.x;

const dy=
wall.end.y-wall.start.y;

const len=
Math.hypot(dx,dy);

if(!len){

return{

len:0,

ux:0,

uy:0,

nx:0,

ny:0

};

}

const ux=
dx/len;

const uy=
dy/len;

const nx=
-uy;

const ny=
ux;

return{

len:len,

ux:ux,

uy:uy,

nx:nx,

ny:ny

};

}


function pointToSegment(
px,
py,
x1,
y1,
x2,
y2
){

const dx=x2-x1;

const dy=y2-y1;

if(
dx===0 &&
dy===0
){

return{

distance:
Math.hypot(
px-x1,
py-y1
),

t:0

};

}

const t=
Math.max(
0,
Math.min(
1,
(
(px-x1)*dx+
(py-y1)*dy
)/
(dx*dx+dy*dy)
)
);

const x=
x1+t*dx;

const y=
y1+t*dy;

return{

distance:
Math.hypot(
px-x,
py-y
),

t:t

};

}


/* =========================================================
   室內中心
========================================================= */

function getRoomCenter(){

const all=[];

walls.forEach(w=>{

all.push(w.start);

all.push(w.end);

});

if(all.length===0){

return{

x:0,

y:0

};

}

let minX=Infinity;

let maxX=-Infinity;

let minY=Infinity;

let maxY=-Infinity;

all.forEach(p=>{

minX=
Math.min(
minX,
p.x
);

maxX=
Math.max(
maxX,
p.x
);

minY=
Math.min(
minY,
p.y
);

maxY=
Math.max(
maxY,
p.y
);

});

return{

x:(minX+maxX)/2,

y:(minY+maxY)/2

};

}


/* =========================================================
   牆的左右
========================================================= */

function getWallReferenceInfo(wall){

if(!wall){

return{

leftAtStart:true,

rightAtStart:false,

roomNx:0,

roomNy:0

};

}

const g=
wallGeometry(wall);

if(!g.len){

return{

leftAtStart:true,

rightAtStart:false,

roomNx:g.nx,

roomNy:g.ny

};

}

const center=
getRoomCenter();

const midX=
(wall.start.x+wall.end.x)/2;

const midY=
(wall.start.y+wall.end.y)/2;

const toCenterX=
center.x-midX;

const toCenterY=
center.y-midY;

const cross=
g.ux*toCenterY-
g.uy*toCenterX;

if(
Math.abs(cross)<0.001
){

return{

leftAtStart:true,

rightAtStart:false,

roomNx:g.nx,

roomNy:g.ny

};

}

if(cross>0){

return{

leftAtStart:false,

rightAtStart:true,

roomNx:-g.nx,

roomNy:-g.ny

};

}

return{

leftAtStart:true,

rightAtStart:false,

roomNx:g.nx,

roomNy:g.ny

};

}


/* =========================================================
   左右距離轉換
========================================================= */

function referenceDistanceToOffset(
wall,
side,
distance,
width
){

const info=
getWallReferenceInfo(wall);

distance=
Number(distance)||0;

width=
Number(width)||0;

if(side==="left"){

if(info.leftAtStart){

return distance;

}else{

return wall.length-distance-width;

}

}

if(info.rightAtStart){

return distance;

}else{

return wall.length-distance-width;

}

}


function offsetToReferenceDistance(
wall,
side,
offset,
width
){

const info=
getWallReferenceInfo(wall);

offset=
Number(offset)||0;

width=
Number(width)||0;

if(side==="left"){

if(info.leftAtStart){

return offset;

}else{

return wall.length-offset-width;

}

}

if(info.rightAtStart){

return offset;

}else{

return wall.length-offset-width;

}

}

/* =========================================================

function createSvgElement(
tag,
attrs={}
){

const el=
document.createElementNS(
"http://www.w3.org/2000/svg",
tag
);

Object.entries(attrs)
.forEach(
([key,value])=>{
el.setAttribute(
key,
value
);
}
);

return el;

}


function addText(
group,
x,
y,
text,
className,
anchor="middle"
){

const el=
createSvgElement(
"text",
{

x:x,

y:y,

"class":className,

"text-anchor":anchor,

"dominant-baseline":"middle"

}
);

el.textContent=text;

group.appendChild(el);

return el;

}


/* =========================================================
   尺寸
========================================================= */

function drawDimension(
group,
x1,
y1,
x2,
y2,
offset
){

const dx=x2-x1;

const dy=y2-y1;

const len=
Math.hypot(
dx,
dy
);

if(!len){

return;

}

const ux=dx/len;

const uy=dy/len;

const nx=-uy;

const ny=ux;

const ax=
x1+nx*offset;

const ay=
y1+ny*offset;

const bx=
x2+nx*offset;

const by=
y2+ny*offset;


group.appendChild(
createSvgElement(
"line",
{

x1:ax,

y1:ay,

x2:bx,

y2:by,

"class":"dimension-line"

}
)
);


group.appendChild(
createSvgElement(
"line",
{

x1:
ax-ux*25-nx*25,

y1:
ay-uy*25-ny*25,

x2:
ax+ux*25+nx*25,

y2:
ay+uy*25+ny*25,

"class":"dimension-tick"

}
)
);


group.appendChild(
createSvgElement(
"line",
{

x1:
bx-ux*25-nx*25,

y1:
by-uy*25-ny*25,

x2:
bx+ux*25+nx*25,

y2:
by+uy*25+ny*25,

"class":"dimension-tick"

}
)
);


addText(
group,

(ax+bx)/2,

(ay+by)/2,

Math.round(len)+"",

"dimension-text"

);

}

========================================================= */

function drawDoors(group){

doors.forEach(
door=>{

const wall=
walls[door.wallIndex];

if(!wall){

return;

}

const g=
wallGeometry(wall);

const ref=
getWallReferenceInfo(wall);

const sx=
wall.start.x+
g.ux*door.offset;

const sy=
wall.start.y+
g.uy*door.offset;

const ex=
sx+
g.ux*door.width;

const ey=
sy+
g.uy*door.width;


/*
依照室內看牆的左右
判斷鉸鍊位置
*/

let hingeX;

let hingeY;

let freeX;

let freeY;


/*
左開＝鉸鍊在左側
*/

if(door.swing==="left"){

if(ref.leftAtStart){

hingeX=sx;

hingeY=sy;

freeX=ex;

freeY=ey;

}else{

hingeX=ex;

hingeY=ey;

freeX=sx;

freeY=sy;

}

}else{

/*
右開＝鉸鍊在右側
*/

if(ref.rightAtStart){

hingeX=ex;

hingeY=ey;

freeX=sx;

freeY=sy;

}else{

hingeX=sx;

hingeY=sy;

freeX=ex;

freeY=ey;

}

}


/*
門洞
*/

group.appendChild(
createSvgElement(
"line",
{

x1:sx,

y1:sy,

x2:ex,

y2:ey,

"class":"door"

}
)
);


/*
門扇
*/

const leafX=
hingeX+
ref.roomNx*door.width;

const leafY=
hingeY+
ref.roomNy*door.width;

group.appendChild(
createSvgElement(
"line",
{

x1:hingeX,

y1:hingeY,

x2:leafX,

y2:leafY,

"class":"door-leaf"

}
)
);


/*
開門弧
*/

group.appendChild(
createSvgElement(
"path",
{

d:
`M ${freeX} ${freeY}
A ${door.width} ${door.width}
0 0 1
${leafX} ${leafY}`,

"class":"door-arc"

}
)
);


const cx=
(sx+ex)/2+
ref.roomNx*80;

const cy=
(sy+ey)/2+
ref.roomNy*80;


addText(
group,
cx,
cy,
"門",
"door-text"
);


addText(
group,
cx,
cy+72,
"寬 "+Math.round(door.width)+
" × 高 "+Math.round(door.height),
"opening-info-text door-detail-text"
);


addText(
group,
cx,
cy+132,
"離地 "+Math.round(
Number(door.floorHeight)||0
),
"offset-text"
);

}
);

}

/* =========================================================
   Fit View
========================================================= */

function fitView(){

const svg=
document.getElementById(
"drawing"
);

const group=
document.getElementById(
"drawingGroup"
);

if(!group){

return;

}

const bbox=
group.getBBox();

if(
!bbox.width ||
!bbox.height
){

return;

}

const padding=350;

let x=
bbox.x-padding;

let y=
bbox.y-padding;

let width=
bbox.width+
padding*2;

let height=
bbox.height+
padding*2;

const minSize=1500;


if(width<minSize){

const extra=
(minSize-width)/2;

x-=extra;

width=minSize;

}


if(height<minSize){

const extra=
(minSize-height)/2;

y-=extra;

height=minSize;

}


svg.setAttribute(
"viewBox",
`${x} ${y} ${width} ${height}`
);

}


/* =========================================================
   SVG 點擊選牆
========================================================= */

function getSvgPoint(evt){

const svg=
document.getElementById(
"drawing"
);

const pt=
svg.createSVGPoint();

pt.x=evt.clientX;

pt.y=evt.clientY;

const matrix=
svg.getScreenCTM();

if(!matrix){

return{
x:0,
y:0
};

}

return pt.transformPoint?
pt.transformPoint(
matrix.inverse()
):
pt.matrixTransform(
matrix.inverse()
);

}


/*
部分瀏覽器沒有 transformPoint，
所以另外確保相容
*/

function convertSvgPoint(evt){

const svg=
document.getElementById(
"drawing"
);

const rect=
svg.getBoundingClientRect();

const viewBox=
svg.viewBox.baseVal;

const x=
viewBox.x+
(
(evt.clientX-rect.left)/
rect.width
)*
viewBox.width;

const y=
viewBox.y+
(
(evt.clientY-rect.top)/
rect.height
)*
viewBox.height;

return{
x:x,
y:y
};

}


document
.getElementById("drawing")
.addEventListener(
"pointerdown",
function(evt){

if(
currentTool!=="window" &&
currentTool!=="door" &&
currentTool!=="beam"
){

}

const p=
convertSvgPoint(evt);

let bestIndex=-1;

let bestDistance=Infinity;


walls.forEach(
(wall,index)=>{

const result=
pointToSegment(
p.x,
p.y,
wall.start.x,
wall.start.y,
wall.end.x,
wall.end.y
);

if(
result.distance<bestDistance
){

bestDistance=
result.distance;

bestIndex=index;

}

});


if(
bestIndex>=0 &&
bestDistance<150
){

selectedWallIndex=
bestIndex;


if(currentTool==="window"){

document
.getElementById(
"windowWallInfo"
)
.textContent=
"已選擇第 "+
(bestIndex+1)+
" 面牆";

}


if(currentTool==="door"){

document
.getElementById(
"doorWallInfo"
)
.textContent=
"已選擇第 "+
(bestIndex+1)+
" 面牆";

}


if(currentTool==="beam"){

document
.getElementById(
"beamWallInfo"
)
.textContent=

(bestIndex+1)+
" 面牆";

);

}

/* =========================================================
   SVG → Image
========================================================= */

function svgToImage(callback){

fitView();

const svg=
createExportSvg();

const serializer=
new XMLSerializer();

const source=
serializer.serializeToString(
svg
);

const blob=
new Blob(
[source],
{
type:
"image/svg+xml;charset=utf-8"
}
);

const url=
URL.createObjectURL(blob);

const img=
new Image();


img.onload=function(){

URL.revokeObjectURL(url);

callback(img);

};


img.onerror=function(){

URL.revokeObjectURL(url);

alert(
"匯出圖片失敗，請再試一次。"
);

};


img.src=url;

}

/* =========================================================
   PDF
========================================================= */

function createSimplePDF(
imageData,
width,
height
){

const binary=
atob(
imageData.split(",")[1]
);

const imgBytes=
new Uint8Array(
binary.length
);

for(
let i=0;
i<binary.length;
i++
){

imgBytes[i]=
binary.charCodeAt(i);

}

const encoder=
new TextEncoder();

const objects=[];


/* 1 */

objects.push(
encoder.encode(
"1 0 obj\n"+
"<< /Type /Catalog /Pages 2 0 R >>\n"+
"endobj\n"
)
);


/* 2 */

objects.push(
encoder.encode(
"2 0 obj\n"+
"<< /Type /Pages /Kids [3 0 R] /Count 1 >>\n"+
"endobj\n"
)
);


/* 3 */

objects.push(
encoder.encode(
"3 0 obj\n"+
"<< /Type /Page /Parent 2 0 R "+
"/MediaBox [0 0 "+
width+" "+height+"] "+
"/Resources << /XObject << /Im0 4 0 R >> >> "+
"/Contents 5 0 R >>\n"+
"endobj\n"
)
);


/* 4 */

const imageHeader=
encoder.encode(
"4 0 obj\n"+
"<< /Type /XObject "+
"/Subtype /Image "+
"/Width "+width+" "+
"/Height "+height+" "+
"/ColorSpace /DeviceRGB "+
"/BitsPerComponent 8 "+
"/Filter /DCTDecode "+
"/Length "+imgBytes.length+" >>\n"+
"stream\n"
);

const imageFooter=
encoder.encode(
"\nendstream\n"+
"endobj\n"
);

objects.push(
concatUint8(
imageHeader,
imgBytes,
imageFooter
)
);


/* 5 */

const content=
"q\n"+
width+
" 0 0 "+
height+
" 0 0 cm\n"+
"/Im0 Do\n"+
"Q\n";

const contentBytes=
encoder.encode(
content
);

objects.push(
concatUint8(

encoder.encode(
"5 0 obj\n"+
"<< /Length "+
contentBytes.length+
" >>\n"+
"stream\n"
),

contentBytes,

encoder.encode(
"endstream\n"+
"endobj\n"
)

)
);


/* PDF */

let pdfParts=[];

const header=
encoder.encode(
"%PDF-1.4\n%\xFF\xFF\xFF\xFF\n"
);

pdfParts.push(header);

let offset=
header.length;

const offsets=[0];

objects.forEach(
obj=>{

offsets.push(offset);

pdfParts.push(obj);

offset+=obj.length;

});


let xref=
"xref\n0 "+
(objects.length+1)+
"\n";

xref+=
"0000000000 65535 f \n";


for(
let i=1;
i<offsets.length;
i++
){

xref+=
String(offsets[i])
.padStart(10,"0")+
" 00000 n \n";

}


const trailer=
"trailer\n"+
"<< /Size "+
(objects.length+1)+
" /Root 1 0 R >>\n"+
"startxref\n"+
offset+
"\n%%EOF";


pdfParts.push(
encoder.encode(
xref+
trailer
)
);


return new Blob(
pdfParts,
{
type:"application/pdf"
}
);

}


/* =========================================================
   Uint8Array
========================================================= */

function concatUint8(
...arrays
){

let total=0;

arrays.forEach(
a=>total+=a.length
);

const result=
new Uint8Array(total);

let offset=0;

arrays.forEach(
a=>{

result.set(
a,
offset
);

offset+=a.length;

});

return result;

}

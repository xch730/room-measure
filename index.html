<header>

  <h1>房屋丈量畫圖工具</h1>

  <div class="header-buttons">

    <button
      class="btn-dark"
      onclick="newCase()"
    >
      ＋案件

      class="btn-dark"
      onclick="openCaseList()"
    >
      📁
    </button>

</header>


<div class="container">


<!-- 案件 -->

<div class="card">

  <div class="card-title">
    目前案件
  </div>

  <div class="row">

    <input
      id="caseName"
      type="text"
      placeholder="案件名稱"
      style="flex:1;min-width:180px;"
      onchange="saveCase()"
    >

    <button
      class="btn-blue"
      onclick="saveCase()"
    >
      儲存
    </button>

  </div>

</div>


<!-- 工具 -->

  <div class="card-title">
    工具
  </div>

  <div class="tool-buttons">

    <button
      id="tool-wall"
      class="tool-btn active"
      onclick="setTool('wall')"
    >
      🧱 牆線
    </button>

    <button
      id="tool-window"
      class="tool-btn"
      onclick="setTool('window')"
    >
      🪟 窗戶
    </button>

    <button
      id="tool-door"
      class="tool-btn"
      onclick="setTool('door')"
    >
      🚪 門
    </button>

    <button
      id="tool-height"
      class="tool-btn"
      onclick="setTool('height')"
    >
      🏠 樓高
    </button>

    <button
      id="tool-beam"
      class="tool-btn"
      onclick="setTool('beam')"
    >
      ▰ 樑
    </button>

  </div>

</div>


<!-- 牆 -->

<div
  id="wallPanel"
  class="card"
>

  <div class="card-title">
    牆線
  </div>

  <div class="row">

    <label>
      牆長
    </label>

    <input
      id="wallLength"
      type="number"
      inputmode="numeric"
      placeholder="mm"
      autocomplete="off"
    >

    <button
      class="btn-blue"
      onclick="addWall()"
    >
      ＋新增牆
    </button>

    <button
      id="globalUndoButton"
      class="btn-gray"
      onclick="undo()"
      disabled
    >
      ↩ 撤回
    </button>

    <button
      class="btn-red"
      onclick="clearDrawing()"
    >
      清除
    </button>

    <button
      class="btn-gray"
      onclick="fitView()"
    >
      適合畫面
    </button>

  </div>


  <div class="direction-buttons">

    <div class="direction-empty"></div>

    <button
      id="dir-up"
      class="btn-gray"
      onclick="setDirection('up')"
    >
      ↑
    </button>

    <div class="direction-empty"></div>

    <button
      id="dir-left"
      class="btn-gray"
      onclick="setDirection('left')"
    >
      ←
    </button>

    <button
      class="btn-gray"
      disabled
    >
      ●
    </button>

    <button
      id="dir-right"
      class="btn-gray"
      onclick="setDirection('right')"
    >
      →
    </button>

    <div class="direction-empty"></div>

    <button
      id="dir-down"
      class="btn-gray"
      onclick="setDirection('down')"
    >
      ↓
    </button>

    <div class="direction-empty"></div>

  </div>


  <div class="info">

    電腦版可以使用鍵盤
    ↑ ↓ ← →
    切換方向。<br>

    在牆長輸入框按 Enter：
    新增牆 → 清除輸入 → 游標繼續留在輸入框。

  </div>

</div>


<!-- 窗戶 -->

<div
  id="windowPanel"
  class="card hidden"
>

  <div class="card-title">
    🪟 窗戶
  </div>

  <div class="row">

    <span id="windowWallInfo">

  </div>

    <div class="field-group">

        左側／右側
      </label>

      <select id="windowSide">

        <option value="left">
          左側
        </option>

        <option value="right">
          右側
        </option>

      </select>

    </div>


    <div class="field-group">

      <label>
        距離
      </label>

<script>

/* =========================================================
   全域
========================================================= */

let currentTool="wall";

let currentDirection="right";

let walls=[];

let windows=[];

let doors=[];

let beams=[];

let points=[
  {
    x:0,
    y:0
  }
];

let floorHeight=0;

let selectedWallIndex=-1;

let history=[];

const MAX_HISTORY=50;

let currentCaseId=null;


/* =========================================================
   ID
========================================================= */

function generateId(){

  return Date.now().toString()+
    Math.random().toString(16).slice(2);

}


/* =========================================================
   撤回按鈕
========================================================= */

function updateUndoButton(){

  const button=
    document.getElementById(
      "globalUndoButton"
    );

  if(!button){
    return;
  }

  button.disabled=
    history.length===0;

}


/* =========================================================
   案件
========================================================= */

function newCase(){

  const name=prompt(
    "請輸入案件名稱"
  );

  if(!name){
    return;
  }

  currentCaseId=generateId();

  walls=[];

  windows=[];

  doors=[];

  beams=[];

  points=[
    {
      x:0,
      y:0
    }
  ];

  floorHeight=0;

  history=[];

  selectedWallIndex=-1;

  document.getElementById(
    "caseName"
  ).value=name;

  saveCase();

  render();

  updateUndoButton();

  setTimeout(
    fitView,
    50
  );

}

  const cases=JSON.parse(
    localStorage.getItem(
      "measureCases"
    )||"[]"
  );

  const data={

    id:currentCaseId,

    name:name,

    walls:walls,

    windows:windows,

    doors:doors,

    beams:beams,

    points:points,

    floorHeight:floorHeight,

    updatedAt:Date.now()

  };

  const index=cases.findIndex(
    x=>x.id===currentCaseId
  );

  if(index>=0){

    cases[index]=data;

  }else{

    cases.push(data);

  localStorage.setItem(
    "measureCases",
    JSON.stringify(cases)
  );

function openCaseList(){

  const modal=document.getElementById(
    "caseModal"
  );

  const list=document.getElementById(
    "caseList"
  );

  const cases=JSON.parse(
    localStorage.getItem(
      "measureCases"
    )||"[]"
  );

  list.innerHTML="";

  if(cases.length===0){

    list.innerHTML=
      "<div class='small-note'>目前沒有案件</div>";

  }else{

    cases
      .sort(
        (a,b)=>
          (b.updatedAt||0)-
          (a.updatedAt||0)
      )
      .forEach(
        data=>{

          const item=
            document.createElement("div");

          item.className="case-item";


          const name=
            document.createElement("div");

          name.className="case-name";

          name.textContent=data.name;


          const buttons=
            document.createElement("div");

          buttons.className="row";


          const openBtn=
            document.createElement("button");

          openBtn.className="btn-blue";

          openBtn.textContent="開啟";

          openBtn.onclick=function(){

            loadCase(data);

            closeCaseList();

          };


          const deleteBtn=
            document.createElement("button");

          deleteBtn.className="btn-red";

          deleteBtn.textContent="刪除";

          deleteBtn.onclick=function(){

            if(
              confirm(
                "確定要刪除這個案件嗎？"
              )
            ){

              deleteCase(data.id);

              openCaseList();

            }

          };


          buttons.appendChild(
            openBtn
          );

          buttons.appendChild(
            deleteBtn
          );


          item.appendChild(
            name
          );

          item.appendChild(
            buttons
          );


          list.appendChild(
            item
          );

        }
      );

  }

  modal.classList.remove(
    "hidden"
  );

function closeCaseList(event){

  if(
    event &&
    event.target!==event.currentTarget
  ){
    return;
  }

  document.getElementById(
    "caseModal"
  ).classList.add(
    "hidden"
  );

}


function deleteCase(id){

  let cases=JSON.parse(
    localStorage.getItem(
      "measureCases"
    )||"[]"
  );

  cases=cases.filter(
    x=>x.id!==id
  );

  localStorage.setItem(
    "measureCases",
    JSON.stringify(cases)
  );

  if(
    currentCaseId===id

    currentCaseId=null;

  }

/* =========================================================
   幾何
========================================================= */

function wallGeometry(wall){

  const dx=
    wall.end.x-
    wall.start.x;

  const dy=
    wall.end.y-
    wall.start.y;

  const len=
    Math.hypot(
      dx,
      dy
    );


  if(!len){

    return{

      len:0,

      ux:0,

      uy:0,

      nx:0,

      ny:0

    };

  }


  const ux=
    dx/len;

  const uy=
    dy/len;


  const nx=
    -uy;

  const ny=
    ux;


  return{

    len:len,

    ux:ux,

    uy:uy,

    nx:nx,

    ny:ny

  };

}


function pointToSegment(
  px,
  py,
  x1,
  y1,
  x2,
  y2
){

  const dx=x2-x1;

  const dy=y2-y1;


  if(
    dx===0 &&
    dy===0
  ){

    return{

      distance:
        Math.hypot(
          px-x1,
          py-y1
        ),

      t:0

    };

  }


  const t=Math.max(
    0,
    Math.min(
      1,
      (
        (px-x1)*dx+
        (py-y1)*dy
      )/
      (
        dx*dx+
        dy*dy
      )
    )
  );


  const x=
    x1+t*dx;

  const y=
    y1+t*dy;


  return{

    distance:
      Math.hypot(
        px-x,
        py-y
      ),

    t:t

  };

}


/* =========================================================
   房間中心
========================================================= */

function getRoomCenter(){

  if(
    walls.length===0
  ){

    return{
      x:0,
      y:0
    };

  }


  let minX=Infinity;

  let maxX=-Infinity;

  let minY=Infinity;

  let maxY=-Infinity;


  walls.forEach(
    wall=>{

      minX=
        Math.min(
          minX,
          wall.start.x,
          wall.end.x
        );

      maxX=
        Math.max(
          maxX,
          wall.start.x,
          wall.end.x
        );

      minY=
        Math.min(
          minY,
          wall.start.y,
          wall.end.y
        );

      maxY=
        Math.max(
          maxY,
          wall.start.y,
          wall.end.y
        );

    }
  );


  return{

    x:(minX+maxX)/2,

    y:(minY+maxY)/2

  };

}


/* =========================================================
   判斷牆的室內側
========================================================= */

function getWallReferenceInfo(wall){

  const g=
    wallGeometry(
      wall
    );


  if(
    !g.len
  ){

    return{

      leftAtStart:true,

      rightAtStart:false,

      roomNx:0,

      roomNy:0

    };

  }


  const center=
    getRoomCenter();


  const midX=
    (
      wall.start.x+
      wall.end.x
    )/2;


  const midY=
    (
      wall.start.y+
      wall.end.y
    )/2;


  const toCenterX=
    center.x-midX;


  const toCenterY=
    center.y-midY;


  const cross=
    g.ux*toCenterY-
    g.uy*toCenterX;


  if(
    cross>0
  ){

    return{

      leftAtStart:false,

      rightAtStart:true,

      roomNx:-g.nx,

      roomNy:-g.ny

    };

  }


  return{

    leftAtStart:true,

    rightAtStart:false,

    roomNx:g.nx,

    roomNy:g.ny

  };

}


/* =========================================================
   距離轉換
========================================================= */

function referenceDistanceToOffset(
  wall,
  side,
  distance,
  width
){

  const info=
    getWallReferenceInfo(
      wall
    );

  const length=
    Number(wall.length)||
    wallGeometry(wall).len;

  distance=
    Number(distance)||0;

  width=
    Number(width)||0;


  if(
    side==="left"
  ){

    if(
      info.leftAtStart
    ){

      return distance;

    }

    return length-distance-width;

  }


  if(
    info.rightAtStart
  ){

    return distance;

  }

  return length-distance-width;

}


function offsetToReferenceDistance(
  wall,
  side,
  offset,
  width
){

  const info=
    getWallReferenceInfo(
      wall
    );

  const length=
    Number(wall.length)||
    wallGeometry(wall).len;

  offset=
    Number(offset)||0;

  width=
    Number(width)||0;


  if(
    side==="left"
  ){

    if(
      info.leftAtStart
    ){

      return offset;

    }

    return length-offset-width;

  }


  if(
    info.rightAtStart
  ){

    return offset;

  }

  return length-offset-width;

}


/* =========================================================
   選牆
========================================================= */

function getWallScreenPoints(wall){

  const svg=
    document.getElementById(
      "drawing"
    );

  if(
    !svg ||
    !wall
  ){

    return null;

  }


  const matrix=
    svg.getScreenCTM();

  if(!matrix){

    return null;

  }


  const p1=
    svg.createSVGPoint();

  p1.x=
    wall.start.x;

  p1.y=
    wall.start.y;


  const p2=
    svg.createSVGPoint();

  p2.x=
    wall.end.x;

  p2.y=
    wall.end.y;


  const s1=
    p1.matrixTransform(
      matrix
    );

  const s2=
    p2.matrixTransform(
      matrix
    );


  return{

    start:{
      x:s1.x,
      y:s1.y
    },

    end:{
      x:s2.x,
      y:s2.y
    }

  };

}


function findNearestWallOnScreen(
  event
){

  let bestIndex=-1;

  let bestDistance=Infinity;


  walls.forEach(
    (wall,index)=>{

      const screen=
        getWallScreenPoints(
          wall
        );

      if(!screen){
        return;
      }


      const result=
        pointToSegment(

          event.clientX,

          event.clientY,

          screen.start.x,

          screen.start.y,

          screen.end.x,

          screen.end.y

        );


      if(
        result.distance<
        bestDistance
      ){

        bestDistance=
          result.distance;

        bestIndex=index;

      }

    }
  );


  return{

    index:bestIndex,

    distance:bestDistance

  };

}

function startWindowSelection(){

  selectedWallIndex=-1;

    "windowWallInfo"

function addWindow(){

  if(
    selectedWallIndex<0 ||
    !walls[selectedWallIndex]
  ){

    alert(
      "請先選擇牆"
    );

    return;

  }


  const wall=
    walls[selectedWallIndex];


  const side=
    document.getElementById(
      "windowSide"
    ).value;


  const distance=
    Number(
      document.getElementById(
        "windowOffset"
      ).value
    )||0;


  const width=
    Number(
      document.getElementById(
        "windowWidth"
      ).value
    );


  const height=
    Number(
      document.getElementById(
        "windowHeight"
      ).value
    );


  const sillHeight=
    Number(
      document.getElementById(
        "windowSillHeight"
      ).value
    )||0;


  if(
    !width ||
    width<=0
  ){

    alert(
      "請輸入窗寬"
    );

    return;

  }


  if(
    !height ||
    height<=0
  ){

    alert(
      "請輸入窗高"
    );

    return;

  }


  const offset=
    referenceDistanceToOffset(
      wall,
      side,
      distance,
      width
    );


  if(
    offset<0 ||
    offset+width>
    Number(wall.length)
  ){

    alert(
      "窗戶超出牆面"
    );

    return;

  }


  const openings=[

    ...windows,

    ...doors

  ];


  const overlap=
    openings
      .filter(
        item=>
          item.wallIndex===
          selectedWallIndex
      )
      .some(
        item=>
          offset<
          Number(item.offset)+
          Number(item.width)
          &&
          offset+width>
          Number(item.offset)
      );


  if(overlap){

    alert(
      "這個位置和現有門窗重疊"
    );

    return;

  }


  saveHistory();


  windows.push({

    wallIndex:
      selectedWallIndex,

    offset:
      offset,

    width:
      width,

    height:
      height,

    sillHeight:
      sillHeight,

    side:
      side

  });


  saveCase();

  render();

  updateUndoButton();

}

      ).value
    )||0;


  if(
    depth<=0
  ){

    alert(
      "請輸入樑深"
    );

    return;

  }


  saveHistory();


  beams.push({

    wallIndex:
      selectedWallIndex,

    distance:
      distance,

    bottom:
      bottom,

    depth:
      depth

  });


  saveCase();

  render();

  updateUndoButton();

}


/* =========================================================
   SVG 工具
========================================================= */

function createSvgElement(
  tag,
  attributes={}
){

  const element=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      tag
    );


  Object.entries(
    attributes
  ).forEach(
    ([key,value])=>{

      element.setAttribute(
        key,
        value
      );

    }
  );


  return element;

}


function addText(
  group,
  x,
  y,
  text,
  className,
  anchor="middle"
){

  const element=
    createSvgElement(
      "text",
      {

        x:x,

        y:y,

        "class":
          className,

        "text-anchor":
          anchor,

        "dominant-baseline":
          "middle"

      }
    );


  element.textContent=text;

  group.appendChild(
    element
  );

  return element;

}


/* =========================================================
   尺寸線
========================================================= */

function drawDimension(
  group,
  x1,
  y1,
  x2,
  y2,
  offset
){

  const dx=x2-x1;

  const dy=y2-y1;

  const len=
    Math.hypot(
      dx,
      dy
    );


  if(!len){
    return;
  }


  const ux=dx/len;

  const uy=dy/len;

  const nx=-uy;

  const ny=ux;


  const ax=
    x1+nx*offset;

  const ay=
    y1+ny*offset;


  const bx=
    x2+nx*offset;

  const by=
    y2+ny*offset;


  group.appendChild(
    createSvgElement(
      "line",
      {

        x1:ax,

        y1:ay,

        x2:bx,

        y2:by,

        class:
          "dimension-line"

      }
    )
  );


  group.appendChild(
    createSvgElement(
      "line",
      {

        x1:
          ax-ux*25-nx*25,

        y1:
          ay-uy*25-ny*25,

        x2:
          ax+ux*25+nx*25,

        y2:
          ay+uy*25+ny*25,

        class:
          "dimension-tick"

      }
    )
  );


  group.appendChild(
    createSvgElement(
      "line",
      {

        x1:
          bx-ux*25-nx*25,

        y1:
          by-uy*25-ny*25,

        x2:
          bx+ux*25+nx*25,

        y2:
          by+uy*25+ny*25,

        class:
          "dimension-tick"

      }
    )
  );


  addText(

    group,

    (ax+bx)/2,

    (ay+by)/2,

    Math.round(len),

    "dimension-text"

  );

}

        wallGeometry(

        );


      const startY=
        wall.start.y+

function drawDoors(group){

  doors.forEach(
    (door,index)=>{

      const wall=
        walls[
          door.wallIndex
        ];


      if(!wall){
        return;
      }


      const g=
        wallGeometry(
          wall
        );


      const ref=
        getWallReferenceInfo(
          wall
        );


      const startX=
        wall.start.x+
        g.ux*
        Number(
          door.offset
        );


      const startY=
        wall.start.y+
        g.uy*
        Number(
          door.offset
        );


      const endX=
        startX+
        g.ux*
        Number(
          door.width
        );


      const endY=
        startY+
        g.uy*
        Number(
          door.width
        );


      group.appendChild(
        createSvgElement(
          "line",
          {

            x1:startX,

            y1:startY,

            x2:endX,

            y2:endY,

            stroke:"white",

            "stroke-width":"34",

            "stroke-linecap":"round"

          }
        )
      );


      group.appendChild(
        createSvgElement(
          "line",
          {

            x1:startX,

            y1:startY,

            x2:endX,

            y2:endY,

            class:
              "door-line"

          }
        )
      );


      let hingeX;

      let hingeY;


      if(
        door.swing==="left"
      ){

        if(
          ref.leftAtStart
        ){

          hingeX=startX;

          hingeY=startY;

        }else{

          hingeX=endX;

          hingeY=endY;

        }

      }else{

        if(
          ref.rightAtStart
        ){

          hingeX=endX;

          hingeY=endY;

        }else{

          hingeX=startX;

          hingeY=startY;

        }

      }


      const leafEndX=
        hingeX+
        ref.roomNx*
        Number(
          door.width
        );


      const leafEndY=
        hingeY+
        ref.roomNy*
        Number(
          door.width
        );


      group.appendChild(
        createSvgElement(
          "line",
          {

            x1:
              hingeX,

            y1:
              hingeY,

            x2:
              leafEndX,

            y2:
              leafEndY,

            class:
              "door-leaf"

          }
        )
      );


      group.appendChild(
        createSvgElement(
          "path",
          {

            d:
              "M "+
              startX+
              " "+
              startY+
              " A "+
              Number(door.width)+
              " "+
              Number(door.width)+
              " 0 0 1 "+
              leafEndX+
              " "+
              leafEndY,

            class:
              "door-arc"

          }
        )
      );


      const centerX=
        (
          startX+
          endX
        )/2;


      const centerY=
        (
          startY+
          endY
        )/2;


      const textDistance=240;


      let textBaseX=
        centerX+
        ref.roomNx*
        textDistance;


      let textBaseY=
        centerY+
        ref.roomNy*
        textDistance;


      if(index%2===1){

          ref.roomNx*70;

        textBaseY+=
          ref.roomNy*70;

        textBaseX,

        textBaseY,

        "門",

        "door-title"

      );


      addText(

        textBaseX,

        textBaseY+100,

      );

    }
  );

}

/* =========================================================
   Fit View
========================================================= */

function fitView(){

  const svg=
    document.getElementById(
      "drawing"
    );


  const group=
    document.getElementById(
      "drawingGroup"
    );


  if(!group){
    return;
  }


  let bbox;


  try{

    bbox=
      group.getBBox();

  }catch(error){

    return;

  }


  if(
    !bbox.width &&
    !bbox.height
  ){

    svg.setAttribute(
      "viewBox",
      "-500 -500 1500 1500"
    );

    return;

  }


  const padding=450;


  let x=
    bbox.x-
    padding;


  let y=
    bbox.y-
    padding;


  let width=
    bbox.width+
    padding*2;


  let height=
    bbox.height+
    padding*2;


  const minSize=1700;


  if(
    width<minSize
  ){

    const extra=
      (
        minSize-
        width
      )/2;

    x-=extra;

    width=minSize;

  }


  if(
    height<minSize
  ){

    const extra=
      (
        minSize-
        height
      )/2;

    y-=extra;

    height=minSize;

  }


  svg.setAttribute(
    "viewBox",
    `${x} ${y} ${width} ${height}`
  );

}


/* =========================================================
   鍵盤
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    const active=
      document.activeElement;


    if(
      (
        event.ctrlKey ||
        event.metaKey
      ) &&
      event.key.toLowerCase()==="z"
    ){

      event.preventDefault();

      undo();

      return;

    }


    if(
      event.key==="Enter"
    ){

      if(
        currentTool==="wall" &&
        active &&
        active.id==="wallLength"
      ){

        event.preventDefault();

        addWall();

      }

      return;

    }


    if(
      currentTool!=="wall"
    ){

      return;

    }


    const directionMap={

      ArrowUp:"up",

      ArrowDown:"down",

      ArrowLeft:"left",

      ArrowRight:"right"

    };


    const direction=
      directionMap[
        event.key
      ];


    if(!direction){
      return;
    }


    if(
      active &&
      active.id==="wallLength"
    ){

      event.preventDefault();

      setDirection(
        direction
      );

      return;

    }


    if(
      active &&
      (
        active.tagName==="INPUT" ||
        active.tagName==="TEXTAREA" ||
        active.tagName==="SELECT"
      )
    ){

      return;

    }


    event.preventDefault();

    setDirection(
      direction
    );

  }
);

/* =========================================================
   SVG → Blob
========================================================= */

function svgToBlob(svg){

  const serializer=
    new XMLSerializer();


  const source=
    serializer.serializeToString(
      svg
    );


  return new Blob(
    [source],
    {
      type:
        "image/svg+xml;charset=utf-8"
    }
  );

}


/* =========================================================
   SVG → Canvas
========================================================= */

function svgToCanvas(){

  return new Promise(
    function(resolve,reject){

      let svg;

      try{

        svg=
          createExportSvg();

      }catch(error){

        reject(error);

        return;

      }


      const blob=
        svgToBlob(
          svg
        );


      const url=
        URL.createObjectURL(
          blob
        );


      const img=
        new Image();


      img.onload=function(){

        URL.revokeObjectURL(
          url
        );


        const canvas=
          document.createElement(
            "canvas"
          );


        canvas.width=2400;

        canvas.height=1600;


        const ctx=
          canvas.getContext(
            "2d"
          );


        if(!ctx){

          reject(
            new Error(
              "無法建立 Canvas"
            )
          );

          return;

        }


        /*
          白底
        */

        ctx.fillStyle="#ffffff";

        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        /*
          把 SVG 畫進 Canvas
        */

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );


        resolve(
          canvas
        );

      };


      img.onerror=function(){

        URL.revokeObjectURL(
          url
        );


        reject(
          new Error(
            "SVG 圖片轉換失敗"
          )
        );

      };


      img.src=url;

    }
  );

}


/* =========================================================
   JPG
========================================================= */

async function exportJPG(){

  try{

    const canvas=
      await svgToCanvas();


    canvas.toBlob(
      function(blob){

        if(!blob){

          alert(
            "JPG 匯出失敗"
          );

          return;

        }


        const url=
          URL.createObjectURL(
            blob
          );


        const a=
          document.createElement(
            "a"
          );


        const caseName=
          document.getElementById(
            "caseName"
          ).value.trim();


        a.href=url;


        a.download=
          (
            caseName||
            "房屋丈量"
          )+
          ".jpg";


        document.body.appendChild(
          a
        );


        a.click();


        a.remove();


        setTimeout(
          function(){

            URL.revokeObjectURL(
              url
            );

          },
          1000
        );

      },
      "image/jpeg",
      0.95
    );

  }catch(error){

    console.error(
      "JPG Export Error:",
      error
    );


    alert(
      "JPG 匯出失敗，請重新整理頁面後再試一次。"
    );

  }

}


/* =========================================================
   PDF
========================================================= */

async function exportPDF(){

  try{

    /*
      確認 jsPDF 有載入
    */

    if(
      !window.jspdf ||
      !window.jspdf.jsPDF
    ){

      alert(
        "PDF 工具尚未載入，請確認網路連線後重新整理頁面。"
      );

      return;

    }


    /*
      先把 SVG 轉成圖片
    */

    const canvas=
      await svgToCanvas();


    const imgData=
      canvas.toDataURL(
        "image/jpeg",
        0.95
      );


    const {jsPDF}=
      window.jspdf;


    /*
      A4 橫式
    */

    const pdf=
      new jsPDF({

        orientation:
          "landscape",

        unit:
          "mm",

        format:
          "a4"

      });


    const pageWidth=
      pdf.internal.pageSize.getWidth();


    const pageHeight=
      pdf.internal.pageSize.getHeight();


    const margin=8;


    const maxWidth=
      pageWidth-
      margin*2;


    const maxHeight=
      pageHeight-
      margin*2;


    const imageRatio=
      canvas.width/
      canvas.height;


    let imageWidth=
      maxWidth;


    let imageHeight=
      imageWidth/
      imageRatio;


    /*
      如果高度超過 A4，
      改用高度限制
    */

    if(
      imageHeight>
      maxHeight
    ){

      imageHeight=
        maxHeight;


      imageWidth=
        imageHeight*
        imageRatio;

    }


    /*
      置中
    */

    const x=
      (
        pageWidth-
        imageWidth
      )/2;


    const y=
      (
        pageHeight-
        imageHeight
      )/2;


    pdf.addImage(

      imgData,

      "JPEG",

      x,

      y,

      imageWidth,

      imageHeight

    );


    const caseName=
      document.getElementById(
        "caseName"
      ).value.trim();


    pdf.save(

      (
        caseName||
        "房屋丈量"
      )+
      ".pdf"

    );

  }catch(error){

    console.error(
      "PDF Export Error:",
      error
    );


    alert(
      "PDF 匯出失敗，請重新整理頁面後再試一次。"
    );

  }

}

<style>

<body>

<header>

<div class="header-row">

<div>

<div class="header-title">

</button>

<div class="panel-title">

</div>

<div class="tool-row">

<button id="toolWall"
class="tool-active"
onclick="selectTool('wall')">
🧱 牆線
</button>

<button id="toolWindow"
onclick="selectTool('window')">
🪟 窗戶

<button id="toolDoor"
onclick="selectTool('door')">

</button>

onclick="selectTool('height')">

onclick="selectTool('beam')">

</div>


<div class="panel" id="wallPanel">

<div class="panel-title">
畫牆面
</div>

<input
id="wallLength"
type="number"
inputmode="numeric"
placeholder="輸入牆長，例如 3000"
autocomplete="off">

<div class="direction-grid">

<button class="direction-empty">　</button>

<button id="upBtn"
onclick="setDirection('up')">
↑

<button class="direction-empty">　</button>

onclick="setDirection('left')">

</button>

<button id="downBtn"
onclick="setDirection('down')">
↓
</button>

class="direction-active"
onclick="setDirection('right')">
→
</button>

<button
class="primary"
style="width:100%;margin-top:10px;"
onclick="addWall()">
＋新增牆面

輸入尺寸 → 選方向 → 新增牆面。

樓高 H（mm）

id="floorHeightInput"

style="width:100%;margin-top:10px;"
onclick="addFloorHeight()">
＋設定樓高

<div class="info" style="margin-top:10px;">

目前樓高：

<strong id="currentFloorHeight">
尚未設定

<div class="help">
設定後會顯示在房間圖面中央。
</div>

</div>

<div class="panel-title">
▰ 樑
</div>

<div
class="info"
id="selectedBeamWallInfo">

請先在圖面上點擊樑所依附的牆面。

</div>

<div id="beamForm" style="display:none;">

<label>
離牆距離（mm）
</label>

<input
id="beamDistance"
type="number"
inputmode="numeric"
placeholder="靠牆填 0，例如 300">

<div class="help">
靠牆填 0；如果樑離牆 300mm，就填 300。
</div>

<br>

<label>
樑下高度（mm）
</label>

<input
id="beamBottomHeight"

樑深度 D（mm）
</label>

id="beamDepth"

<div class="info">

樑高計算：

樓高 − 樑下高度 = 樑高

<div id="drawingWrap">

id="drawing"

d="M 0 0 L 10 5 L 0 10 z"

門

樑

<script>

let points=[{x:0,y:0}];

let walls=[];

let windows=[];

let doors=[];

let beams=[];

let floorHeight=null;

let currentDirection="right";

let currentTool="wall";

let selectedWallIndex=null;

let selectedTapDistance=0;

let selectedBeamWallIndex=null;

let currentCaseId=null;

let currentCaseName="";

let history=[];


/* =========================================================
工具
========================================================= */

function selectTool(tool){

currentTool=tool;

document.querySelectorAll(".tool-row button")
.forEach(function(btn){
btn.classList.remove("tool-active");
});

const id=
tool==="wall"?"toolWall":
tool==="window"?"toolWindow":
tool==="door"?"toolDoor":
tool==="height"?"toolHeight":
"toolBeam";

document.getElementById(id)
.classList.add("tool-active");

document.getElementById("wallPanel").style.display="none";
document.getElementById("heightPanel").style.display="none";
document.getElementById("beamPanel").style.display="none";
document.getElementById("openingPanel").style.display="none";

if(tool==="wall"){
document.getElementById("wallPanel").style.display="block";
}

if(tool==="height"){

document.getElementById("heightPanel").style.display="block";

document.getElementById("currentFloorHeight").textContent=
floorHeight?floorHeight+" mm":"尚未設定";

}

if(tool==="beam"){

document.getElementById("beamPanel").style.display="block";

document.getElementById("beamCurrentFloorHeight").textContent=
floorHeight?floorHeight+" mm":"尚未設定";

cancelBeamSelection();

}

if(tool==="window" || tool==="door"){

document.getElementById("openingPanel").style.display="block";

if(tool==="window"){

document.getElementById("placementTitle").textContent="🪟 放置窗戶";

document.getElementById("addOpeningBtn").textContent="＋新增窗戶";

document.getElementById("addOpeningBtn").className="window-btn";

document.getElementById("doorSwingBox").style.display="none";

}else{

document.getElementById("placementTitle").textContent="🚪 放置門";

document.getElementById("addOpeningBtn").textContent="＋新增門";

document.getElementById("addOpeningBtn").className="door-btn";

document.getElementById("doorSwingBox").style.display="block";

}

cancelWallSelection();

}

}


/* =========================================================
方向
========================================================= */

function setDirection(direction){

currentDirection=direction;

document.querySelectorAll(".direction-grid button")
.forEach(function(btn){
btn.classList.remove("direction-active");
});

const map={
up:"upBtn",
down:"downBtn",
left:"leftBtn",
right:"rightBtn"
};

document.getElementById(map[direction])
.classList.add("direction-active");

}


/* =========================================================
新增牆
========================================================= */

function addWall(){

const input=document.getElementById("wallLength");

const length=Number(input.value);

if(!length || length<=0){
input.focus();
return;
}

const last=points[points.length-1];

let dx=0;
let dy=0;

if(currentDirection==="right")dx=length;
if(currentDirection==="left")dx=-length;
if(currentDirection==="down")dy=length;
if(currentDirection==="up")dy=-length;

const end={
x:last.x+dx,
y:last.y+dy
};

saveHistory();

walls.push({
start:{...last},
end:{...end},
length:length
});

points.push(end);

saveCase();
render();

}


/* =========================================================
樓高
========================================================= */

function addFloorHeight(){

const value=
Number(document.getElementById("floorHeightInput").value);

if(!value || value<=0){

alert("請輸入正確的樓高。");
return;

}

saveHistory();

floorHeight=value;

document.getElementById("currentFloorHeight").textContent=value+" mm";

document.getElementById("beamCurrentFloorHeight").textContent=value+" mm";

saveCase();
render();

}


/* =========================================================
樑
========================================================= */

function selectBeamWall(evt){

if(currentTool!=="beam")return;

if(walls.length===0){

alert("請先畫牆面。");
return;

}

const p=screenToSvg(evt);

let bestIndex=null;
let bestDistance=Infinity;

walls.forEach(function(wall,index){

const result=pointToSegment(
p.x,p.y,
wall.start.x,wall.start.y,
wall.end.x,wall.end.y
);

if(result.distance<bestDistance){

bestDistance=result.distance;
bestIndex=index;

}

});

if(bestIndex===null || bestDistance>180)return;

selectedBeamWallIndex=bestIndex;

const wall=walls[bestIndex];

document.getElementById("beamForm").style.display="block";

document.getElementById("beamDistance").value="0";

document.getElementById("selectedBeamWallInfo").className="info selected-info";

document.getElementById("selectedBeamWallInfo").textContent=
`已選第 ${bestIndex+1} 面牆｜牆長 ${wall.length} mm`;

render();

}


function addBeam(){

if(selectedBeamWallIndex===null){

alert("請先在圖面上點擊樑所依附的牆面。");
return;

}

if(!floorHeight){

alert("請先設定樓高。");
return;

}

const distance=
Number(document.getElementById("beamDistance").value);

const bottomHeight=
Number(document.getElementById("beamBottomHeight").value);

const depth=
Number(document.getElementById("beamDepth").value);

if(isNaN(distance)||distance<0){

alert("離牆距離不能小於 0。");
return;

}

if(!bottomHeight||bottomHeight<=0){

alert("請輸入樑下高度。");
return;

}

if(!depth||depth<=0){

alert("請輸入樑深度。");
return;

}

const beamHeight=floorHeight-bottomHeight;

if(beamHeight<=0){

alert("樑下高度不能大於或等於樓高。");
return;

}

saveHistory();

beams.push({

wallIndex:selectedBeamWallIndex,
distance:distance,
bottomHeight:bottomHeight,
depth:depth,
height:beamHeight

});

saveCase();

selectedBeamWallIndex=null;

document.getElementById("beamForm").style.display="none";

document.getElementById("selectedBeamWallInfo").className="info";

document.getElementById("selectedBeamWallInfo").textContent=
"請先在圖面上點擊樑所依附的牆面。";

render();

}


function cancelBeamSelection(){

selectedBeamWallIndex=null;

const form=document.getElementById("beamForm");

if(form)form.style.display="none";

const info=document.getElementById("selectedBeamWallInfo");

if(info){

info.className="info";

info.textContent="請先在圖面上點擊樑所依附的牆面。";

}

render();

}


/* =========================================================
案件
========================================================= */

function newCase(){

const name=prompt("請輸入案件名稱");

if(!name)return;

currentCaseId=Date.now().toString();

currentCaseName=name;

points=[{x:0,y:0}];

walls=[];

windows=[];

doors=[];

beams=[];

floorHeight=null;

history=[];

selectedWallIndex=null;

selectedBeamWallIndex=null;

selectedTapDistance=0;

updateCaseName();
saveCase();
render();

}


function updateCaseName(){

document.getElementById("currentCaseName").textContent=
currentCaseName||"尚未建立案件";

}


function saveCase(){

if(!currentCaseId)return;

const data=
JSON.parse(localStorage.getItem("measureCases")||"[]");

const item={

id:currentCaseId,
name:currentCaseName,
points:points,
walls:walls,
windows:windows,
doors:doors,
beams:beams,
floorHeight:floorHeight,
updatedAt:Date.now()

};

const index=data.findIndex(x=>x.id===currentCaseId);

if(index>=0)
data[index]=item;
else
data.push(item);

localStorage.setItem("measureCases",JSON.stringify(data));

}

function closeCases(){

}


function loadCase(id){

const data=
JSON.parse(localStorage.getItem("measureCases")||"[]");

const item=data.find(x=>x.id===id);

if(!item)return;

currentCaseId=item.id;
currentCaseName=item.name;

points=item.points||[{x:0,y:0}];
walls=item.walls||[];
windows=item.windows||[];
doors=item.doors||[];
beams=item.beams||[];
floorHeight=item.floorHeight||null;

history=[];

selectedWallIndex=null;
selectedBeamWallIndex=null;
selectedTapDistance=0;

updateCaseName();
closeCases();

}


function deleteCase(id){

if(!confirm("確定要刪除這個案件嗎？"))

let data=
JSON.parse(localStorage.getItem("measureCases")||"[]");

data=data.filter(x=>x.id!==id);

localStorage.setItem("measureCases",JSON.stringify(data));

function escapeHtml(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

/* =========================================================
SVG
========================================================= */

function screenToSvg(evt){

const svg=document.getElementById("drawing");

const point=svg.createSVGPoint();

point.x=evt.clientX;
point.y=evt.clientY;

const matrix=svg.getScreenCTM();

return point.matrixTransform(matrix.inverse());

}


function pointToSegment(px,py,x1,y1,x2,y2){

const dx=x2-x1;
const dy=y2-y1;

if(dx===0&&dy===0){

return{
distance:Math.hypot(px-x1,py-y1),
t:0
};

}

const t=Math.max(
0,
Math.min(
1,
(
(px-x1)*dx+
(py-y1)*dy
)/
(
dx*dx+
dy*dy
)
)
);

const x=x1+t*dx;
const y=y1+t*dy;

return{
distance:Math.hypot(px-x,py-y),
t:t
};

}


/* =========================================================
門窗選牆
========================================================= */

function selectWallByTap(evt){

if(currentTool!=="window"&&currentTool!=="door")
return;

if(walls.length===0){

alert("請先畫牆面。");
return;

}

const p=screenToSvg(evt);

let bestIndex=null;
let bestDistance=Infinity;
let bestT=0;

walls.forEach(function(wall,index){

const result=pointToSegment(
p.x,p.y,
wall.start.x,wall.start.y,
wall.end.x,wall.end.y
);

if(result.distance<bestDistance){

bestDistance=result.distance;
bestIndex=index;
bestT=result.t;

}

});

if(bestIndex===null||bestDistance>180)
return;

selectedWallIndex=bestIndex;

selectedTapDistance=
Math.round(walls[bestIndex].length*bestT);

document.getElementById("openingForm").style.display="block";

document.getElementById("openingOffset").value=
selectedTapDistance;

document.getElementById("selectedWallInfo").className=
"info selected-info";

document.getElementById("selectedWallInfo").textContent=
`已選第 ${bestIndex+1} 面牆｜牆長 ${walls[bestIndex].length} mm｜點擊位置約 ${selectedTapDistance} mm`;

render();

}


function cancelWallSelection(){

selectedWallIndex=null;
selectedTapDistance=0;

document.getElementById("openingForm").style.display="none";

document.getElementById("selectedWallInfo").className="info";

document.getElementById("selectedWallInfo").textContent=
"請先在圖面上點擊要放置門窗的牆面。";

render();

}


/* =========================================================
門窗
========================================================= */

function addOpening(){

if(selectedWallIndex===null){

alert("請先點擊要放置門窗的牆面。");
return;

}

const width=
Number(document.getElementById("openingWidth").value);

const height=
Number(document.getElementById("openingHeight").value);

const sill=
Number(document.getElementById("openingSill").value);

const offset=
Number(document.getElementById("openingOffset").value);

if(!width||width<=0){

alert("請輸入門窗寬度。");
return;

}

if(!height||height<=0){

alert("請輸入門窗高度。");
return;

}

if(offset<0){

alert("距離牆端不能小於 0。");
return;

}

const wall=walls[selectedWallIndex];

if(offset+width>wall.length){

alert(
`門窗超出牆面。\n\n牆長：${wall.length} mm\n位置：${offset} mm\n寬度：${width} mm`
);

return;

}

const existing=[

...windows.map(x=>({
wallIndex:x.wallIndex,
offset:x.offset,
width:x.width
})),

...doors.map(x=>({
wallIndex:x.wallIndex,
offset:x.offset,
width:x.width
}))

];

const overlap=
existing
.filter(x=>x.wallIndex===selectedWallIndex)
.some(
x=>
offset<x.offset+x.width&&
offset+width>x.offset
);

if(overlap){

alert("這個位置和原本的門窗重疊了。");
return;

}

saveHistory();

if(currentTool==="window"){

windows.push({

wallIndex:selectedWallIndex,
offset:offset,
width:width,
height:height,
sill:sill

});

}else{

doors.push({

wallIndex:selectedWallIndex,
offset:offset,
width:width,
height:height,
sill:sill,
swing:document.getElementById("doorSwing").value

});

}

saveCase();

cancelWallSelection();

render();

}


/* =========================================================
牆幾何
========================================================= */

function wallGeometry(wall){

const dx=wall.end.x-wall.start.x;
const dy=wall.end.y-wall.start.y;
const len=Math.hypot(dx,dy);

if(!len){

return{
ux:0,
uy:0,
nx:0,
ny:0,
len:0
};

}

return{

ux:dx/len,
uy:dy/len,
nx:-dy/len,
ny:dx/len,
len:len

};

}


function pointAlongWall(wall,distance){

const g=wallGeometry(wall);

return{

x:wall.start.x+g.ux*distance,
y:wall.start.y+g.uy*distance

};

}


/* =========================================================
牆
========================================================= */

function drawWalls(group){

walls.forEach(function(wall,index){

const openings=[

...windows
.filter(x=>x.wallIndex===index)
.map(x=>({...x,type:"window"})),

...doors
.filter(x=>x.wallIndex===index)
.map(x=>({...x,type:"door"}))

];

openings.sort((a,b)=>a.offset-b.offset);

let current=0;

openings.forEach(function(opening){

if(opening.offset>current){

drawWallSegment(
group,
wall,
current,
opening.offset
);

}

current=opening.offset+opening.width;

});

if(current<wall.length){

drawWallSegment(
group,
wall,
current,
wall.length
);

}

const hit=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

hit.setAttribute("x1",wall.start.x);
hit.setAttribute("y1",wall.start.y);
hit.setAttribute("x2",wall.end.x);
hit.setAttribute("y2",wall.end.y);
hit.setAttribute("class","wall-hit");

group.appendChild(hit);

drawDimension(
group,
wall.start,
wall.end,
wall.length,
140
);

});

}


function drawWallSegment(group,wall,startDistance,endDistance){

const start=pointAlongWall(wall,startDistance);
const end=pointAlongWall(wall,endDistance);

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1",start.x);
line.setAttribute("y1",start.y);
line.setAttribute("x2",end.x);
line.setAttribute("y2",end.y);
line.setAttribute("class","wall");

group.appendChild(line);

}


/* =========================================================
尺寸
========================================================= */

function drawDimension(group,start,end,value,offset){

const dx=end.x-start.x;
const dy=end.y-start.y;
const len=Math.hypot(dx,dy);

if(!len)return;

const ux=dx/len;
const uy=dy/len;

const nx=-uy;
const ny=ux;

const s={
x:start.x+nx*offset,
y:start.y+ny*offset
};

const e={
x:end.x+nx*offset,
y:end.y+ny*offset
};

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1",s.x);
line.setAttribute("y1",s.y);
line.setAttribute("x2",e.x);
line.setAttribute("y2",e.y);
line.setAttribute("class","dimension");
line.setAttribute("marker-start","url(#arrow)");
line.setAttribute("marker-end","url(#arrow)");

group.appendChild(line);

[start,end].forEach(function(p){

const q={
x:p.x+nx*offset,
y:p.y+ny*offset
};

const ext=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

ext.setAttribute("x1",p.x);
ext.setAttribute("y1",p.y);
ext.setAttribute("x2",q.x);
ext.setAttribute("y2",q.y);
ext.setAttribute("class","dimension");

group.appendChild(ext);

});

const text=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

text.setAttribute("x",(s.x+e.x)/2);
text.setAttribute("y",(s.y+e.y)/2);
text.setAttribute("class","dimension-text");
text.textContent=`${value} mm`;

group.appendChild(text);

}


/* =========================================================
窗
========================================================= */

function drawWindow(group,w){

const wall=walls[w.wallIndex];

if(!wall)return;

const g=wallGeometry(wall);

const start=pointAlongWall(wall,w.offset);
const end=pointAlongWall(wall,w.offset+w.width);

const distance=25;

[-distance,distance].forEach(function(off){

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1",start.x+g.nx*off);
line.setAttribute("y1",start.y+g.ny*off);
line.setAttribute("x2",end.x+g.nx*off);
line.setAttribute("y2",end.y+g.ny*off);
line.setAttribute("class","window-line");

group.appendChild(line);

});

drawColoredDimension(
group,
start,
end,
`${w.width} × ${w.height}`,
190,
"window-text"
);

drawOffsetDimension(group,wall,w.offset);

drawHeightText(
group,
start,
end,
`窗台離地 ${w.sill} mm`
);

}


/* =========================================================
門
========================================================= */

function drawDoor(group,d){

const wall=walls[d.wallIndex];

if(!wall)return;

const g=wallGeometry(wall);

const start=pointAlongWall(wall,d.offset);
const end=pointAlongWall(wall,d.offset+d.width);

let hinge;

if(d.swing==="left")
hinge=start;
else
hinge=end;

const leafEnd={
x:hinge.x+g.nx*d.width,
y:hinge.y+g.ny*d.width
};

const leaf=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

leaf.setAttribute("x1",hinge.x);
leaf.setAttribute("y1",hinge.y);
leaf.setAttribute("x2",leafEnd.x);
leaf.setAttribute("y2",leafEnd.y);
leaf.setAttribute("class","door-leaf");

group.appendChild(leaf);

const arc=
document.createElementNS(
"http://www.w3.org/2000/svg",
"path"
);

const sweep=d.swing==="left"?1:0;

const free=d.swing==="left"?end:start;

const r=d.width;

arc.setAttribute(
"d",
`M ${free.x} ${free.y}
 A ${r} ${r} 0 0 ${sweep}
 ${leafEnd.x} ${leafEnd.y}`
);

arc.setAttribute("class","door-arc");

group.appendChild(arc);

drawColoredDimension(
group,
start,
end,
`${d.width} × ${d.height}`,
190,
"door-text"
);

drawOffsetDimension(
group,
wall,
d.offset
);

}


/* =========================================================
彩色尺寸
========================================================= */

function drawColoredDimension(
group,
start,
end,
value,
offset,
className
){

const dx=end.x-start.x;
const dy=end.y-start.y;
const len=Math.hypot(dx,dy);

if(!len)return;

const nx=-dy/len;
const ny=dx/len;

const s={
x:start.x+nx*offset,
y:start.y+ny*offset
};

const e={
x:end.x+nx*offset,
y:end.y+ny*offset
};

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1",s.x);
line.setAttribute("y1",s.y);
line.setAttribute("x2",e.x);
line.setAttribute("y2",e.y);
line.setAttribute("class","dimension");

group.appendChild(line);

const text=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

text.setAttribute("x",(s.x+e.x)/2);
text.setAttribute("y",(s.y+e.y)/2);
text.setAttribute("class",className);
text.textContent=value;

group.appendChild(text);

}


/* =========================================================
距離
========================================================= */

function drawOffsetDimension(group,wall,offset){

if(offset<=0)return;

const g=wallGeometry(wall);

const start=pointAlongWall(wall,0);
const end=pointAlongWall(wall,offset);

const distanceOffset=-180;

const s={
x:start.x+g.nx*distanceOffset,
y:start.y+g.ny*distanceOffset
};

const e={
x:end.x+g.nx*distanceOffset,
y:end.y+g.ny*distanceOffset
};

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1",s.x);
line.setAttribute("y1",s.y);
line.setAttribute("x2",e.x);
line.setAttribute("y2",e.y);
line.setAttribute("class","dimension");

group.appendChild(line);

const text=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

text.setAttribute("x",(s.x+e.x)/2);
text.setAttribute("y",(s.y+e.y)/2-35);
text.setAttribute("class","offset-text");
text.textContent=`${offset} mm`;

group.appendChild(text);

}


/* =========================================================
高度
========================================================= */

function drawHeightText(group,start,end,value){

const text=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

text.setAttribute("x",(start.x+end.x)/2);
text.setAttribute("y",(start.y+end.y)/2-65);
text.setAttribute("class","offset-text");
text.textContent=value;

group.appendChild(text);

}


/* =========================================================
樓高
========================================================= */

function getRoomCenter(){

if(points.length===0){

return{x:0,y:0};

}

let minX=Infinity;
let maxX=-Infinity;
let minY=Infinity;
let maxY=-Infinity;

points.forEach(function(p){

minX=Math.min(minX,p.x);
maxX=Math.max(maxX,p.x);
minY=Math.min(minY,p.y);
maxY=Math.max(maxY,p.y);

});

return{
x:(minX+maxX)/2,
y:(minY+maxY)/2
};

}


function drawFloorHeight(group){

if(!floorHeight)return;

const center=getRoomCenter();

const text=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

text.setAttribute("x",center.x);
text.setAttribute("y",center.y);
text.setAttribute("class","height-text");
text.textContent=`樓H ${floorHeight}`;

group.appendChild(text);

}


/* =========================================================
樑
========================================================= */

function drawBeams(group){

if(beams.length===0)return;

beams.forEach(function(beam){

const wall=walls[beam.wallIndex];

if(!wall)return;

const g=wallGeometry(wall);

const distance=Number(beam.distance)||0;

const startBase=pointAlongWall(wall,0);
const endBase=pointAlongWall(wall,wall.length);

const start={
x:startBase.x+g.nx*distance,
y:startBase.y+g.ny*distance
};

const end={
x:endBase.x+g.nx*distance,
y:endBase.y+g.ny*distance
};

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1",start.x);
line.setAttribute("y1",start.y);
line.setAttribute("x2",end.x);
line.setAttribute("y2",end.y);
line.setAttribute("class","beam-line");

group.appendChild(line);

const center={
x:(start.x+end.x)/2,
y:(start.y+end.y)/2
};

const text=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

text.setAttribute("x",center.x);
text.setAttribute("y",center.y-45);
text.setAttribute("class","beam-text");
text.textContent=`樑 H${beam.height} × D${beam.depth}`;

group.appendChild(text);

if(distance>0){

const dim=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

dim.setAttribute("x1",startBase.x);
dim.setAttribute("y1",startBase.y);
dim.setAttribute("x2",start.x);
dim.setAttribute("y2",start.y);
dim.setAttribute("class","dimension");

group.appendChild(dim);

const distanceText=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

distanceText.setAttribute(
"x",
(startBase.x+start.x)/2
);

distanceText.setAttribute(
"y",
(startBase.y+start.y)/2
);

distanceText.setAttribute(
"class",
"beam-distance-text"
);

distanceText.textContent=`離牆 ${distance}`;

group.appendChild(distanceText);

}

});

}


/* =========================================================
Render
========================================================= */

function render(){

const group=document.getElementById("drawingGroup");

group.innerHTML="";

drawWalls(group);

windows.forEach(function(w){
drawWindow(group,w);
});

doors.forEach(function(d){
drawDoor(group,d);
});

drawBeams(group);

drawFloorHeight(group);

points.forEach(function(p){

const circle=
document.createElementNS(
"http://www.w3.org/2000/svg",
"circle"
);

circle.setAttribute("cx",p.x);
circle.setAttribute("cy",p.y);
circle.setAttribute("r",12);
circle.setAttribute("class","point");

group.appendChild(circle);

});

if(selectedWallIndex!==null){

const wall=walls[selectedWallIndex];

if(wall){

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",

);

line.setAttribute("y1",wall.start.y);
line.setAttribute("x2",wall.end.x);
line.setAttribute("y2",wall.end.y);
line.setAttribute("class","selected-wall");

}

}

if(selectedBeamWallIndex!==null){

const wall=walls[selectedBeamWallIndex];

if(wall){

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1",wall.start.x);
line.setAttribute("y1",wall.start.y);
line.setAttribute("x2",wall.end.x);
line.setAttribute("y2",wall.end.y);
line.setAttribute("class","selected-wall");

group.insertBefore(line,group.firstChild);

}

}

}


/* =========================================================
自動縮放
========================================================= */

function fitView(){

const svg=document.getElementById("drawing");

const group=document.getElementById("drawingGroup");

if(!group)return;

let bbox;

try{
bbox=group.getBBox();
}catch(e){
return;
}

if(!bbox.width&&!bbox.height)
return;

const padding=350;

let x=bbox.x-padding;
let y=bbox.y-padding;
let width=bbox.width+padding*2;
let height=bbox.height+padding*2;

const minSize=1500;

if(width<minSize){

const extra=(minSize-width)/2;

x-=extra;
width=minSize;

}

if(height<minSize){

const extra=(minSize-height)/2;

y-=extra;
height=minSize;

}

svg.setAttribute(
"viewBox",
`${x} ${y} ${width} ${height}`
);

}

圖面點擊

document.getElementById("drawing")
.addEventListener(

function(evt){

if(currentTool==="window"||currentTool==="door"){
selectWallByTap(evt);

/* =========================================================
匯出用 SVG
========================================================= */

function getViewBox(){

const svg=document.getElementById("drawing");

const value=
svg.getAttribute("viewBox");

const parts=value
.trim()
.split(/[\s,]+/)
.map(Number);

return{
x:parts[0],
y:parts[1],
width:parts[2],
height:parts[3]
};

}


function createExportSvg(){

const svg=document.getElementById("drawing");

const clone=svg.cloneNode(true);

clone.setAttribute(
"xmlns",
"http://www.w3.org/2000/svg"
);

clone.setAttribute(
"xmlns:xlink",
"http://www.w3.org/1999/xlink"
);

const vb=getViewBox();

clone.setAttribute("width",vb.width);
clone.setAttribute("height",vb.height);


/*
  把 CSS 一起塞進 SVG
  這樣 JPG / PDF 才不會遺失顏色與文字樣式
*/

const style=
document.createElementNS(
"http://www.w3.org/2000/svg",

/* =========================================================
建立匯出 Canvas
========================================================= */

function createExportCanvas(){

return new Promise(function(resolve,reject){

const svg=document.getElementById("drawing");

const oldViewBox=
svg.getAttribute("viewBox");

const oldSelectedWallIndex=
selectedWallIndex;

const oldSelectedBeamWallIndex=
selectedBeamWallIndex;


/*
  匯出前取消選取紫色線
*/

selectedWallIndex=null;
selectedBeamWallIndex=null;

render();

fitView();


const clone=createExportSvg();

const serializer=new XMLSerializer();

const svgString=
serializer.serializeToString(clone);

const blob=
new Blob(
[svgString],
{
type:"image/svg+xml;charset=utf-8"
}
);

const url=URL.createObjectURL(blob);

const img=new Image();

img.onload=function(){

try{

const vb=getViewBox();


/*
  最大輸出尺寸
  避免 iPhone 記憶體不足
*/

const maxWidth=3200;
const maxHeight=2400;

let scale=
Math.min(
maxWidth/vb.width,
maxHeight/vb.height
);

if(!isFinite(scale)||scale<=0)
scale=1;

const width=
Math.max(
1,
Math.round(vb.width*scale)
);

const height=
Math.max(
1,
Math.round(vb.height*scale)
);


const canvas=
document.createElement("canvas");

canvas.width=width;
canvas.height=height;


const ctx=
canvas.getContext("2d");

ctx.fillStyle="#ffffff";

ctx.fillRect(
0,
0,
width,
height
);

ctx.drawImage(
img,
0,
0,
width,
height
);

URL.revokeObjectURL(url);


/*
  還原畫面
*/

svg.setAttribute(
"viewBox",
oldViewBox
);

selectedWallIndex=
oldSelectedWallIndex;

selectedBeamWallIndex=
oldSelectedBeamWallIndex;

render();


resolve(canvas);

}catch(error){

URL.revokeObjectURL(url);

svg.setAttribute(
"viewBox",
oldViewBox
);

selectedWallIndex=
oldSelectedWallIndex;

selectedBeamWallIndex=
oldSelectedBeamWallIndex;

render();

reject(error);

}

};


img.onerror=function(){

URL.revokeObjectURL(url);

svg.setAttribute(
"viewBox",
oldViewBox
);

selectedWallIndex=
oldSelectedWallIndex;

selectedBeamWallIndex=
oldSelectedBeamWallIndex;

render();

reject(
new Error("SVG 轉圖片失敗")
);

};


img.src=url;

});

}

/* =========================================================

========================================================= */

async function exportJPG(){

if(walls.length===0){

alert("目前沒有圖面可以匯出。");

return;

}

try{

const canvas=
await createExportCanvas();


canvas.toBlob(
function(blob){

if(!blob){

alert("JPG 產生失敗。");

return;

}

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
`${getSafeFileName()}_丈量圖.jpg`;

document.body.appendChild(a);

a.click();

a.remove();


setTimeout(
function(){
URL.revokeObjectURL(url);
},
1500
);

},
"image/jpeg",
0.95
);

}catch(error){

console.error(error);

alert(
"JPG 圖面產生失敗，請重新嘗試。"
);

}

}


/* =========================================================
PDF
========================================================= */

async function exportPDF(){

if(typeof window.jspdf==="undefined"){

alert(
"PDF 工具尚未載入，請確認目前有網路後再試一次。"
);

return;

}

if(walls.length===0){

alert("目前沒有圖面可以匯出。");

return;

}

try{

const canvas=
await createExportCanvas();


const {
jsPDF
}=window.jspdf;


const pdf=
new jsPDF({

orientation:"landscape",
unit:"mm",
format:"a4"

});


const pageW=
pdf.internal.pageSize.getWidth();

const pageH=
pdf.internal.pageSize.getHeight();


/*
  標題
*/

pdf.setFontSize(18);

pdf.setTextColor(30,30,30);

pdf.text(
currentCaseName||"房屋丈量圖",
15,
15
);


/*
  日期
*/

pdf.setFontSize(9);

pdf.setTextColor(100,100,100);

pdf.text(
`丈量日期：${new Date().toLocaleDateString()}`,
15,
22
);


/*
  樓高
*/

if(floorHeight){

pdf.setFontSize(11);

pdf.setTextColor(30,30,30);

pdf.text(
`樓高 H ${floorHeight} mm`,
pageW-15,
15,
{
align:"right"
}
);

}


/*
  圖面區域
*/

const marginLeft=12;
const marginTop=28;
const marginBottom=10;

const availableW=
pageW-marginLeft*2;

const availableH=
pageH-marginTop-marginBottom;

const ratio=
canvas.width/canvas.height;

let drawW=availableW;

let drawH=drawW/ratio;

if(drawH>availableH){

drawH=availableH;

drawW=drawH*ratio;

}

const drawX=
(pageW-drawW)/2;

const drawY=
marginTop+
(availableH-drawH)/2;


/*
  使用跟 JPG 完全相同的 Canvas
*/

pdf.addImage(
canvas.toDataURL("image/jpeg",0.95),
"JPEG",
drawX,
drawY,
drawW,
drawH
);


/*
  底部
*/

pdf.setFontSize(8);

pdf.setTextColor(100,100,100);

pdf.text(
"房屋丈量圖｜尺寸單位：mm",
15,
pageH-5
);

if(beams.length>0){

pdf.text(
`樑：${beams.length} 支`,
pageW-15,
pageH-5,
{
align:"right"
}
);

}


pdf.save(
`${getSafeFileName()}_丈量圖.pdf`
);


}catch(error){

console.error(error);

alert(
"PDF 圖面產生失敗，請重新嘗試。"
);

}

}

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>房屋丈量畫圖工具</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f4f6;
  color:#222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    Arial,
    sans-serif;
}

header{
  background:#111827;
  color:white;
  padding:12px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}

header h1{
  margin:0;
  font-size:18px;
}

.header-buttons{
  display:flex;
  gap:7px;
}

button{
  border:0;
  border-radius:8px;
  padding:9px 12px;
  font-size:15px;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

button:disabled{
  opacity:.6;
}

.btn-dark{
  background:#374151;
  color:white;
}

.btn-blue{
  background:#2563eb;
  color:white;
}

.btn-green{
  background:#16a34a;
  color:white;
}

.btn-red{
  background:#dc2626;
  color:white;
}

.btn-gray{
  background:#e5e7eb;
  color:#111;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:10px;
}

.card{
  background:white;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
}

.card-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:10px;
}

.row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

input,
select{
  border:1px solid #d1d5db;
  border-radius:8px;
  background:white;
  padding:9px 10px;
  font-size:16px;
}

input[type="number"]{
  width:125px;
}

.tool-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.tool-btn{
  background:#f3f4f6;
  border:2px solid transparent;
}

.tool-btn.active{
  background:#dbeafe;
  border-color:#2563eb;
  color:#1d4ed8;
  font-weight:bold;
}

.direction-buttons{
  display:grid;
  grid-template-columns:50px 50px 50px;
  gap:5px;
  justify-content:center;
  margin:10px 0;
}

.direction-buttons button{
  width:50px;
  height:45px;
  padding:0;
  font-size:22px;
}

.direction-empty{
  visibility:hidden;
}

.info{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:8px;
  padding:9px;
  color:#1e40af;
  font-size:13px;
  line-height:1.6;
}

.small-note{
  color:#6b7280;
  font-size:12px;
  line-height:1.5;
}

.hidden{
  display:none !important;
}

.opening-fields{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:flex-end;
}

.field-group{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.field-group label{
  font-size:13px;
  color:#4b5563;
  font-weight:bold;
}

#drawing{
  width:100%;
  height:65vh;
  min-height:430px;
  display:block;
  background:white;
  border:1px solid #d1d5db;
  border-radius:10px;
  touch-action:none;
}

.wall{
  stroke:#111;
  stroke-width:24;
  stroke-linecap:round;
}

.selected-wall{
  stroke:#9333ea;
  stroke-width:34;
  stroke-dasharray:20 14;
  stroke-linecap:round;
}

.window-line-main{
  stroke:#2563eb;
  stroke-width:18;
}

.window-line-inner{
  stroke:#2563eb;
  stroke-width:7;
}

.door-line{
  stroke:#f97316;
  stroke-width:18;
}

.door-leaf{
  stroke:#f97316;
  stroke-width:13;
}

.door-arc{
  fill:none;
  stroke:#f97316;
  stroke-width:7;
  stroke-dasharray:16 10;
}

.beam-line{
  stroke:#dc2626;
  stroke-width:28;
  stroke-dasharray:35 18;
}

.dimension-line{
  stroke:#6b7280;
  stroke-width:5;
}

.dimension-tick{
  stroke:#6b7280;
  stroke-width:5;
}

.dimension-text{
  font-size:70px;
  font-weight:bold;
  fill:#374151;
}

.window-title{
  font-size:55px;
  font-weight:bold;
  fill:#2563eb;
}

.window-detail{
  font-size:48px;
  font-weight:bold;
  fill:#2563eb;
}

.window-height{
  font-size:45px;
  font-weight:bold;
  fill:#2563eb;
}

.door-title{
  font-size:55px;
  font-weight:bold;
  fill:#ea580c;
}

.door-detail{
  font-size:48px;
  font-weight:bold;
  fill:#ea580c;
}

.door-height{
  font-size:45px;
  font-weight:bold;
  fill:#ea580c;
}

.offset-text{
  font-size:48px;
  font-weight:bold;
  fill:#4b5563;
}

.height-text{
  font-size:78px;
  font-weight:bold;
  fill:#059669;
}

.beam-text{
  font-size:58px;
  font-weight:bold;
  fill:#dc2626;
}

.beam-distance-text{
  font-size:48px;
  font-weight:bold;
  fill:#dc2626;
}

.center-label{
  font-size:34px;
  font-weight:bold;
  fill:#6b7280;
}

.export-buttons{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}

.export-buttons button{
  flex:1;
  min-width:140px;
}

.case-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.case-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  border:1px solid #e5e7eb;
  background:#fafafa;
  padding:10px;
  border-radius:8px;
}

.case-name{
  font-weight:bold;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:200;
}

.modal-box{
  background:white;
  width:100%;
  max-width:430px;
  border-radius:14px;
  padding:18px;
}

.modal-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:15px;
}

@media(max-width:600px){

  header h1{
    font-size:16px;
  }

  .container{
    padding:7px;
  }

  .card{
    padding:10px;
  }

  #drawing{
    height:58vh;
    min-height:400px;
  }

  .opening-fields{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .opening-fields .field-group{
    width:100%;
  }

  .opening-fields input,
  .opening-fields select{
    width:100%;
  }

  .opening-fields button{
    grid-column:1 / -1;
  }

}

</style>
</head>

<body>

<header>

  <h1>房屋丈量畫圖工具</h1>

  <div class="header-buttons">

    <button
      class="btn-dark"
      onclick="newCase()"
    >
      ＋案件
    </button>

    <button
      class="btn-dark"
      onclick="openCaseList()"
    >
      📁
    </button>

  </div>

</header>


<div class="container">


<!-- 案件 -->

<div class="card">

  <div class="card-title">
    目前案件
  </div>

  <div class="row">

    <input
      id="caseName"
      type="text"
      placeholder="案件名稱"
      style="flex:1;min-width:180px;"
      onchange="saveCase()"
    >

    <button
      class="btn-blue"
      onclick="saveCase()"
    >
      儲存
    </button>

  </div>

</div>


<!-- 工具 -->

<div class="card">

  <div class="card-title">
    工具
  </div>

  <div class="tool-buttons">

    <button
      id="tool-wall"
      class="tool-btn active"
      onclick="setTool('wall')"
    >
      🧱 牆線
    </button>

    <button
      id="tool-window"
      class="tool-btn"
      onclick="setTool('window')"
    >
      🪟 窗戶
    </button>

    <button
      id="tool-door"
      class="tool-btn"
      onclick="setTool('door')"
    >
      🚪 門
    </button>

    <button
      id="tool-height"
      class="tool-btn"
      onclick="setTool('height')"
    >
      🏠 樓高
    </button>

    <button
      id="tool-beam"
      class="tool-btn"
      onclick="setTool('beam')"
    >
      ▰ 樑
    </button>

  </div>

</div>


<!-- 牆 -->

<div
  id="wallPanel"
  class="card"
>

  <div class="card-title">
    牆線
  </div>

  <div class="row">

    <label>
      牆長
    </label>

    <input
      id="wallLength"
      type="number"
      inputmode="numeric"
      placeholder="mm"
      autocomplete="off"
    >

    <button
      class="btn-blue"
      onclick="addWall()"
    >
      新增牆
    </button>

    <button
      class="btn-gray"
      onclick="undo()"
    >
      ↩ 復原
    </button>

    <button
      class="btn-red"
      onclick="clearDrawing()"
    >
      清除
    </button>

    <button
      class="btn-gray"
      onclick="fitView()"
    >
      適合畫面
    </button>

  </div>


  <div class="direction-buttons">

    <div class="direction-empty"></div>

    <button
      id="dir-up"
      class="btn-gray"
      onclick="setDirection('up')"
    >
      ↑
    </button>

    <div class="direction-empty"></div>

    <button
      id="dir-left"
      class="btn-gray"
      onclick="setDirection('left')"
    >
      ←
    </button>

    <button
      class="btn-gray"
      disabled
    >
      ●
    </button>

    <button
      id="dir-right"
      class="btn-gray"
      onclick="setDirection('right')"
    >
      →
    </button>

    <div class="direction-empty"></div>

    <button
      id="dir-down"
      class="btn-gray"
      onclick="setDirection('down')"
    >
      ↓
    </button>

    <div class="direction-empty"></div>

  </div>


  <div class="info">

    電腦版可以使用鍵盤
    ↑ ↓ ← →
    切換方向。<br>

    在牆長輸入框按 Enter：
    新增牆 → 清除輸入 → 游標繼續留在輸入框。

  </div>

</div>


<!-- 窗戶 -->

<div
  id="windowPanel"
  class="card hidden"
>

  <div class="card-title">
    🪟 窗戶
  </div>

  <div class="row">

    <button
      class="btn-blue"
      onclick="startWindowSelection()"
    >
      選擇牆
    </button>

    <span id="windowWallInfo">
      尚未選擇牆
    </span>

  </div>


  <div class="opening-fields">

    <div class="field-group">

      <label>
        左側／右側
      </label>

      <select id="windowSide">

        <option value="left">
          左側
        </option>

        <option value="right">
          右側
        </option>

      </select>

    </div>


    <div class="field-group">

      <label>
        距離
      </label>

      <input
        id="windowOffset"
        type="number"
        inputmode="numeric"
        placeholder="mm"
      >

    </div>


    <div class="field-group">

      <label>
        窗寬
      </label>

      <input
        id="windowWidth"
        type="number"
        inputmode="numeric"
        placeholder="mm"
      >

    </div>


    <div class="field-group">

      <label>
        窗高
      </label>

      <input
        id="windowHeight"
        type="number"
        inputmode="numeric"
        placeholder="mm"
      >

    </div>


    <div class="field-group">

      <label>
        窗離地
      </label>

      <input
        id="windowSillHeight"
        type="number"
        inputmode="numeric"
        placeholder="mm"
        value="900"
      >

    </div>


    <button
      class="btn-blue"
      onclick="addWindow()"
    >
      新增窗戶
    </button>

  </div>


  <div class="info">

    先按「選擇牆」，再直接點圖上的牆。<br>

    距離＝從你指定的左側／右側牆端開始量。<br>

    窗戶會顯示：
    <strong>窗寬 × 窗高 × 窗離地</strong>。

  </div>

</div>


<!-- 門 -->

<div
  id="doorPanel"
  class="card hidden"
>

  <div class="card-title">
    🚪 門
  </div>

  <div class="row">

    <button
      class="btn-blue"
      onclick="startDoorSelection()"
    >
      選擇牆
    </button>

    <span id="doorWallInfo">
      尚未選擇牆
    </span>

  </div>


  <div class="opening-fields">

    <div class="field-group">

      <label>
        左側／右側
      </label>

      <select id="doorSide">

        <option value="left">
          左側
        </option>

        <option value="right">
          右側
        </option>

      </select>

    </div>


    <div class="field-group">

      <label>
        距離
      </label>

      <input
        id="doorOffset"
        type="number"
        inputmode="numeric"
        placeholder="mm"
      >

    </div>


    <div class="field-group">

      <label>
        門寬
      </label>

      <input
        id="doorWidth"
        type="number"
        inputmode="numeric"
        placeholder="mm"
      >

    </div>


    <div class="field-group">

      <label>
        門高
      </label>

      <input
        id="doorHeight"
        type="number"
        inputmode="numeric"
        placeholder="mm"
      >

    </div>


    <div class="field-group">

      <label>
        門離地
      </label>

      <input
        id="doorFloorHeight"
        type="number"
        inputmode="numeric"
        placeholder="mm"
        value="0"
      >

    </div>


    <div class="field-group">

      <label>
        開門方向
      </label>

      <select id="doorSwing">

        <option value="left">
          左開
        </option>

        <option value="right">
          右開
        </option>

      </select>

    </div>


    <button
      class="btn-blue"
      onclick="addDoor()"
    >
      新增門
    </button>

  </div>


  <div class="info">

    先按「選擇牆」，再直接點圖上的牆。<br>

    門會顯示：
    <strong>門寬 × 門高 × 門離地</strong>。

  </div>

</div>


<!-- 樓高 -->

<div
  id="heightPanel"
  class="card hidden"
>

  <div class="card-title">
    🏠 樓高
  </div>

  <div class="row">

    <label>
      樓高
    </label>

    <input
      id="floorHeight"
      type="number"
      inputmode="numeric"
      placeholder="mm"
    >

    <button
      class="btn-green"
      onclick="setFloorHeight()"
    >
      設定樓高
    </button>

  </div>

</div>


<!-- 樑 -->

<div
  id="beamPanel"
  class="card hidden"
>

  <div class="card-title">
    ▰ 樑
  </div>

  <div class="row">

    <button
      class="btn-blue"
      onclick="startBeamSelection()"
    >
      選擇牆
    </button>

    <span id="beamWallInfo">
      尚未選擇牆
    </span>

  </div>


  <div class="opening-fields">

    <div class="field-group">

      <label>
        離牆
      </label>

      <input
        id="beamDistance"
        type="number"
        inputmode="numeric"
        placeholder="mm"
      >

    </div>


    <div class="field-group">

      <label>
        樑底高
      </label>

      <input
        id="beamBottom"
        type="number"
        inputmode="numeric"
        placeholder="mm"
      >

    </div>


    <div class="field-group">

      <label>
        樑深
      </label>

      <input
        id="beamDepth"
        type="number"
        inputmode="numeric"
        placeholder="mm"
      >

    </div>


    <button
      class="btn-red"
      onclick="addBeam()"
    >
      新增樑
    </button>

  </div>


  <div class="info">
    樑高會依照「樓高－樑底高」自動計算。
  </div>

</div>


<!-- 圖面 -->

<div class="card">

  <div class="card-title">
    平面圖
  </div>

  <svg
    id="drawing"
    viewBox="-500 -500 1500 1500"
    xmlns="http://www.w3.org/2000/svg"
  >

    <g id="drawingGroup"></g>

  </svg>


  <div class="export-buttons">

    <button
      class="btn-green"
      onclick="exportJPG()"
    >
      📷 匯出 JPG
    </button>

    <button
      class="btn-blue"
      onclick="exportPDF()"
    >
      📄 匯出 PDF
    </button>

  </div>

</div>

</div>


<!-- 案件視窗 -->

<div
  id="caseModal"
  class="modal hidden"
  onclick="closeCaseList(event)"
>

  <div
    class="modal-box"
    onclick="event.stopPropagation()"
  >

    <div class="modal-title">
      案件
    </div>

    <div
      id="caseList"
      class="case-list"
    ></div>

    <div class="modal-actions">

      <button
        class="btn-gray"
        onclick="closeCaseList()"
      >
        關閉
      </button>

    </div>

  </div>

</div>


<script>


/* =========================================================
   全域
========================================================= */

let currentTool="wall";

let currentDirection="right";

let walls=[];

let windows=[];

let doors=[];

let beams=[];

let points=[
  {
    x:0,
    y:0
  }
];

let floorHeight=0;

let selectedWallIndex=-1;

let history=[];

let currentCaseId=null;


/* =========================================================
   ID
========================================================= */

function generateId(){

  return Date.now().toString()+
    Math.random().toString(16).slice(2);

}


/* =========================================================
   案件
========================================================= */

function newCase(){

  const name=prompt(
    "請輸入案件名稱"
  );

  if(!name){
    return;
  }

  currentCaseId=generateId();

  walls=[];

  windows=[];

  doors=[];

  beams=[];

  points=[
    {
      x:0,
      y:0
    }
  ];

  floorHeight=0;

  history=[];

  selectedWallIndex=-1;

  document.getElementById(
    "caseName"
  ).value=name;

  saveCase();

  render();

  setTimeout(
    fitView,
    50
  );

}


function saveCase(){

  const name=document
    .getElementById("caseName")
    .value
    .trim();

  if(!name){
    return;
  }

  if(!currentCaseId){

    currentCaseId=generateId();

  }

  const cases=JSON.parse(
    localStorage.getItem(
      "measureCases"
    )||"[]"
  );

  const data={

    id:currentCaseId,

    name:name,

    walls:walls,

    windows:windows,

    doors:doors,

    beams:beams,

    points:points,

    floorHeight:floorHeight,

    updatedAt:Date.now()

  };

  const index=cases.findIndex(
    x=>x.id===currentCaseId
  );

  if(index>=0){

    cases[index]=data;

  }else{

    cases.push(data);

  }

  localStorage.setItem(
    "measureCases",
    JSON.stringify(cases)
  );

}


function loadCase(data){

  currentCaseId=data.id;

  document.getElementById(
    "caseName"
  ).value=data.name||"";

  walls=data.walls||[];

  windows=(data.windows||[]).map(
    item=>({

      wallIndex:Number(
        item.wallIndex
      )||0,

      offset:Number(
        item.offset
      )||0,

      width:Number(
        item.width
      )||0,

      height:Number(
        item.height
      )||0,

      sillHeight:Number(
        item.sillHeight ??
        item.windowSillHeight ??
        900
      ),

      side:
        item.side==="right"
          ?"right"
          :"left"

    })
  );

  doors=(data.doors||[]).map(
    item=>({

      wallIndex:Number(
        item.wallIndex
      )||0,

      offset:Number(
        item.offset
      )||0,

      width:Number(
        item.width
      )||0,

      height:Number(
        item.height
      )||0,

      floorHeight:Number(
        item.floorHeight ??
        item.doorFloorHeight ??
        0
      ),

      side:
        item.side==="right"
          ?"right"
          :"left",

      swing:
        item.swing==="right"
          ?"right"
          :"left"

    })
  );

  beams=(data.beams||[]).map(
    item=>({

      wallIndex:Number(
        item.wallIndex
      )||0,

      distance:Number(
        item.distance
      )||0,

      bottom:Number(
        item.bottom
      )||0,

      depth:Number(
        item.depth
      )||0

    })
  );

  points=data.points||[
    {
      x:0,
      y:0
    }
  ];

  floorHeight=
    Number(data.floorHeight)||0;

  history=[];

  selectedWallIndex=-1;

  render();

  setTimeout(
    fitView,
    50
  );

}


function openCaseList(){

  const modal=document.getElementById(
    "caseModal"
  );

  const list=document.getElementById(
    "caseList"
  );

  const cases=JSON.parse(
    localStorage.getItem(
      "measureCases"
    )||"[]"
  );

  list.innerHTML="";

  if(cases.length===0){

    list.innerHTML=
      "<div class='small-note'>目前沒有案件</div>";

  }else{

    cases
      .sort(
        (a,b)=>
          (b.updatedAt||0)-
          (a.updatedAt||0)
      )
      .forEach(
        data=>{

          const item=
            document.createElement("div");

          item.className="case-item";


          const name=
            document.createElement("div");

          name.className="case-name";

          name.textContent=data.name;


          const buttons=
            document.createElement("div");

          buttons.className="row";


          const openBtn=
            document.createElement("button");

          openBtn.className="btn-blue";

          openBtn.textContent="開啟";

          openBtn.onclick=function(){

            loadCase(data);

            closeCaseList();

          };


          const deleteBtn=
            document.createElement("button");

          deleteBtn.className="btn-red";

          deleteBtn.textContent="刪除";

          deleteBtn.onclick=function(){

            if(
              confirm(
                "確定要刪除這個案件嗎？"
              )
            ){

              deleteCase(data.id);

              openCaseList();

            }

          };


          buttons.appendChild(
            openBtn
          );

          buttons.appendChild(
            deleteBtn
          );


          item.appendChild(
            name
          );

          item.appendChild(
            buttons
          );


          list.appendChild(
            item
          );

        }
      );

  }

  modal.classList.remove(
    "hidden"
  );

}


function closeCaseList(event){

  if(
    event &&
    event.target!==event.currentTarget
  ){
    return;
  }

  document.getElementById(
    "caseModal"
  ).classList.add(
    "hidden"
  );

}


function deleteCase(id){

  let cases=JSON.parse(
    localStorage.getItem(
      "measureCases"
    )||"[]"
  );

  cases=cases.filter(
    x=>x.id!==id
  );

  localStorage.setItem(
    "measureCases",
    JSON.stringify(cases)
  );

  if(
    currentCaseId===id
  ){

    currentCaseId=null;

  }

}

/* =========================================================
   幾何
========================================================= */

function wallGeometry(wall){

  const dx=
    wall.end.x-
    wall.start.x;

  const dy=
    wall.end.y-
    wall.start.y;

  const len=
    Math.hypot(
      dx,
      dy
    );


  if(!len){

    return{

      len:0,

      ux:0,

      uy:0,

      nx:0,

      ny:0

    };

  }


  const ux=
    dx/len;

  const uy=
    dy/len;


  const nx=
    -uy;

  const ny=
    ux;


  return{

    len:len,

    ux:ux,

    uy:uy,

    nx:nx,

    ny:ny

  };

}


function pointToSegment(
  px,
  py,
  x1,
  y1,
  x2,
  y2
){

  const dx=x2-x1;

  const dy=y2-y1;


  if(
    dx===0 &&
    dy===0
  ){

    return{

      distance:
        Math.hypot(
          px-x1,
          py-y1
        ),

      t:0

    };

  }


  const t=Math.max(
    0,
    Math.min(
      1,
      (
        (px-x1)*dx+
        (py-y1)*dy
      )/
      (
        dx*dx+
        dy*dy
      )
    )
  );


  const x=
    x1+t*dx;

  const y=
    y1+t*dy;


  return{

    distance:
      Math.hypot(
        px-x,
        py-y
      ),

    t:t

  };

}


/* =========================================================
   房間中心
========================================================= */

function getRoomCenter(){

  if(
    walls.length===0
  ){

    return{
      x:0,
      y:0
    };

  }


  let minX=Infinity;

  let maxX=-Infinity;

  let minY=Infinity;

  let maxY=-Infinity;


  walls.forEach(
    wall=>{

      minX=
        Math.min(
          minX,
          wall.start.x,
          wall.end.x
        );

      maxX=
        Math.max(
          maxX,
          wall.start.x,
          wall.end.x
        );

      minY=
        Math.min(
          minY,
          wall.start.y,
          wall.end.y
        );

      maxY=
        Math.max(
          maxY,
          wall.start.y,
          wall.end.y
        );

    }
  );


  return{

    x:(minX+maxX)/2,

    y:(minY+maxY)/2

  };

}


/* =========================================================
   判斷牆的室內側
========================================================= */

function getWallReferenceInfo(wall){

  const g=
    wallGeometry(wall);

  if(
    !g.len
  ){

    return{

      leftAtStart:true,

      rightAtStart:false,

      roomNx:0,

      roomNy:0

    };

  }


  const center=
    getRoomCenter();


  const midX=
    (
      wall.start.x+
      wall.end.x
    )/2;


  const midY=
    (
      wall.start.y+
      wall.end.y
    )/2;


  const toCenterX=
    center.x-midX;


  const toCenterY=
    center.y-midY;


  const cross=
    g.ux*toCenterY-
    g.uy*toCenterX;


  if(
    cross>0
  ){

    return{

      leftAtStart:false,

      rightAtStart:true,

      roomNx:-g.nx,

      roomNy:-g.ny

    };

  }


  return{

    leftAtStart:true,

    rightAtStart:false,

    roomNx:g.nx,

    roomNy:g.ny

  };

}


/* =========================================================
   距離轉換
========================================================= */

function referenceDistanceToOffset(
  wall,
  side,
  distance,
  width
){

  const info=
    getWallReferenceInfo(
      wall
    );

  const length=
    Number(wall.length)||
    wallGeometry(wall).len;

  distance=
    Number(distance)||0;

  width=
    Number(width)||0;


  if(
    side==="left"
  ){

    if(
      info.leftAtStart
    ){

      return distance;

    }

    return length-distance-width;

  }


  if(
    info.rightAtStart
  ){

    return distance;

  }

  return length-distance-width;

}


function offsetToReferenceDistance(
  wall,
  side,
  offset,
  width
){

  const info=
    getWallReferenceInfo(
      wall
    );

  const length=
    Number(wall.length)||
    wallGeometry(wall).len;

  offset=
    Number(offset)||0;

  width=
    Number(width)||0;


  if(
    side==="left"
  ){

    if(
      info.leftAtStart
    ){

      return offset;

    }

    return length-offset-width;

  }


  if(
    info.rightAtStart
  ){

    return offset;

  }

  return length-offset-width;

}


/* =========================================================
   選牆
========================================================= */

function getWallScreenPoints(wall){

  const svg=
    document.getElementById(
      "drawing"
    );

  if(
    !svg ||
    !wall
  ){

    return null;

  }


  const matrix=
    svg.getScreenCTM();

  if(!matrix){

    return null;

  }


  const p1=
    svg.createSVGPoint();

  p1.x=
    wall.start.x;

  p1.y=
    wall.start.y;


  const p2=
    svg.createSVGPoint();

  p2.x=
    wall.end.x;

  p2.y=
    wall.end.y;


  const s1=
    p1.matrixTransform(
      matrix
    );

  const s2=
    p2.matrixTransform(
      matrix
    );


  return{

    start:{
      x:s1.x,
      y:s1.y
    },

    end:{
      x:s2.x,
      y:s2.y
    }

  };

}


function findNearestWallOnScreen(
  event
){

  let bestIndex=-1;

  let bestDistance=Infinity;


  walls.forEach(
    (wall,index)=>{

      const screen=
        getWallScreenPoints(
          wall
        );

      if(!screen){
        return;
      }


      const result=
        pointToSegment(

          event.clientX,

          event.clientY,

          screen.start.x,

          screen.start.y,

          screen.end.x,

          screen.end.y

        );


      if(
        result.distance<
        bestDistance
      ){

        bestDistance=
          result.distance;

        bestIndex=index;

      }

    }
  );


  return{

    index:bestIndex,

    distance:bestDistance

  };

}


function updateSelectedWallInfo(){

  if(
    selectedWallIndex<0 ||
    !walls[selectedWallIndex]
  ){
    return;
  }


  const wall=
    walls[selectedWallIndex];


  const length=Math.round(
    Number(wall.length)||
    wallGeometry(wall).len||
    0
  );


  if(
    currentTool==="window"
  ){

    document.getElementById(
      "windowWallInfo"
    ).textContent=
      "已選擇第 "+
      (
        selectedWallIndex+1
      )+
      " 面牆｜長 "+
      length+
      " mm";

  }


  if(
    currentTool==="door"
  ){

    document.getElementById(
      "doorWallInfo"
    ).textContent=
      "已選擇第 "+
      (
        selectedWallIndex+1
      )+
      " 面牆｜長 "+
      length+
      " mm";

  }


  if(
    currentTool==="beam"
  ){

    document.getElementById(
      "beamWallInfo"
    ).textContent=

        selectedWallIndex+1
      )+

document
  .getElementById("drawing")
  .addEventListener(
    "pointerdown",
    function(event){

      if(
        currentTool!=="window" &&
        currentTool!=="door" &&
        currentTool!=="beam"
      ){

        return;

      }


      event.preventDefault();

      event.stopPropagation();


      const result=
        findNearestWallOnScreen(
          event
        );


      if(
        result.index<0
      ){
        return;
      }


      /*
        手指／滑鼠距離牆
        45px 內都算選到
      */

      if(
        result.distance>45
      ){

        return;

      }


      selectedWallIndex=
        result.index;


      updateSelectedWallInfo();

      render();

    },
    {
      passive:false
    }
  );


/* =========================================================
   窗戶
========================================================= */

function startWindowSelection(){

  setTool("window");

  selectedWallIndex=-1;

  document.getElementById(
    "windowWallInfo"
  ).textContent=
    "請直接點擊圖上的牆";

}


function addWindow(){

  if(
    selectedWallIndex<0 ||
    !walls[selectedWallIndex]
  ){

    alert(
      "請先選擇牆"
    );

    return;

  }


  const wall=
    walls[selectedWallIndex];


  const side=
    document.getElementById(
      "windowSide"
    ).value;


  const distance=
    Number(
      document.getElementById(
        "windowOffset"
      ).value
    )||0;


  const width=
    Number(
      document.getElementById(
        "windowWidth"
      ).value
    );


  const height=
    Number(
      document.getElementById(
        "windowHeight"
      ).value
    );


  const sillHeight=
    Number(
      document.getElementById(
        "windowSillHeight"
      ).value
    )||0;


  if(
    !width ||
    width<=0
  ){

    alert(
      "請輸入窗寬"
    );

    return;

  }


  if(
    !height ||
    height<=0
  ){

    alert(
      "請輸入窗高"
    );

    return;

  }


  const offset=
    referenceDistanceToOffset(
      wall,
      side,
      distance,
      width
    );


  if(
    offset<0 ||
    offset+width>
    Number(wall.length)
  ){

    alert(
      "窗戶超出牆面"
    );

    return;

  }


  /*
    檢查和其他門窗重疊
  */

  const openings=[

    ...windows,

    ...doors

  ];


  const overlap=
    openings
      .filter(
        item=>
          item.wallIndex===
          selectedWallIndex
      )
      .some(
        item=>
          offset<
          Number(item.offset)+
          Number(item.width)
          &&
          offset+width>
          Number(item.offset)
      );


  if(overlap){

    alert(
      "這個位置和現有門窗重疊"
    );

    return;

  }


  saveHistory();


  windows.push({

    wallIndex:
      selectedWallIndex,

    offset:
      offset,

    width:
      width,

    height:
      height,

    sillHeight:
      sillHeight,

    side:
      side

  });


  saveCase();

  render();

}

/* =========================================================
   SVG 工具
========================================================= */

function createSvgElement(
  tag,
  attributes={}
){

  const element=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      tag
    );


  Object.entries(
    attributes
  ).forEach(
    ([key,value])=>{

      element.setAttribute(
        key,
        value
      );

    }
  );


  return element;

}


function addText(
  group,
  x,
  y,
  text,
  className,
  anchor="middle"
){

  const element=
    createSvgElement(
      "text",
      {

        x:x,

        y:y,

        "class":
          className,

        "text-anchor":
          anchor,

        "dominant-baseline":
          "middle"

      }
    );


  element.textContent=text;

  group.appendChild(
    element
  );

  return element;

}


/* =========================================================
   尺寸線
========================================================= */

function drawDimension(
  group,
  x1,
  y1,
  x2,
  y2,
  offset
){

  const dx=x2-x1;

  const dy=y2-y1;

  const len=
    Math.hypot(
      dx,
      dy
    );


  if(!len){
    return;
  }


  const ux=dx/len;

  const uy=dy/len;

  const nx=-uy;

  const ny=ux;


  const ax=
    x1+nx*offset;

  const ay=
    y1+ny*offset;


  const bx=
    x2+nx*offset;

  const by=
    y2+ny*offset;


  group.appendChild(
    createSvgElement(
      "line",
      {

        x1:ax,

        y1:ay,

        x2:bx,

        y2:by,

        class:
          "dimension-line"

      }
    )
  );


  group.appendChild(
    createSvgElement(
      "line",
      {

        x1:
          ax-ux*25-nx*25,

        y1:
          ay-uy*25-ny*25,

        x2:
          ax+ux*25+nx*25,

        y2:
          ay+uy*25+ny*25,

        class:
          "dimension-tick"

      }
    )
  );


  group.appendChild(
    createSvgElement(
      "line",
      {

        x1:
          bx-ux*25-nx*25,

        y1:
          by-uy*25-ny*25,

        x2:
          bx+ux*25+nx*25,

        y2:
          by+uy*25+ny*25,

        class:
          "dimension-tick"

      }
    )
  );


  addText(

    group,

    (ax+bx)/2,

    (ay+by)/2,

    Math.round(len),

    "dimension-text"

  );

}


/* =========================================================
   牆
========================================================= */

function drawWalls(group){

  walls.forEach(
    (wall,index)=>{

      const className=
        index===selectedWallIndex
          ?"selected-wall"
          :"wall";


      group.appendChild(
        createSvgElement(
          "line",
          {

            x1:
              wall.start.x,

            y1:
              wall.start.y,

            x2:
              wall.end.x,

            y2:
              wall.end.y,

            class:
              className

          }
        )
      );


      drawDimension(

        group,

        wall.start.x,

        wall.start.y,

        wall.end.x,

        wall.end.y,

        100

      );

    }
  );

}


/* =========================================================
   ★ 窗戶
   這裡重新處理座標
========================================================= */

function drawWindows(group){

  windows.forEach(
    (windowItem,index)=>{

      const wall=
        walls[
          windowItem.wallIndex
        ];


      if(!wall){
        return;
      }


      const g=
        wallGeometry(
          wall
        );


      const ref=
        getWallReferenceInfo(
          wall
        );


      /*
        窗戶起點
      */

      const startX=
        wall.start.x+
        g.ux*
        Number(
          windowItem.offset
        );


      const startY=
        wall.start.y+
        g.uy*
        Number(
          windowItem.offset
        );


      const endX=
        startX+
        g.ux*
        Number(
          windowItem.width
        );


      const endY=
        startY+
        g.uy*
        Number(
          windowItem.width
        );


      /*
        第一條窗線
      */

      group.appendChild(
        createSvgElement(
          "line",
          {

            x1:startX,

            y1:startY,

            x2:endX,

            y2:endY,

            class:
              "window-line-main"

          }
        )
      );


      /*
        第二條窗線
      */

      const gap=28;


      group.appendChild(
        createSvgElement(
          "line",
          {

            x1:
              startX+
              ref.roomNx*gap,

            y1:
              startY+
              ref.roomNy*gap,

            x2:
              endX+
              ref.roomNx*gap,

            y2:
              endY+
              ref.roomNy*gap,

            class:
              "window-line-inner"

          }
        )
      );


      /*
        ★ 文字位置
        不再用固定右上角
        而是跟著窗戶中心走
      */

      const centerX=
        (
          startX+
          endX
        )/2;


      const centerY=
        (
          startY+
          endY
        )/2;


      /*
        文字放在室內側
      */

      const textBaseX=
        centerX+
        ref.roomNx*
        110;


      const textBaseY=
        centerY+
        ref.roomNy*
        110;


      /*
        窗
      */

      addText(

        group,

        textBaseX,

        textBaseY,

        "窗",

        "window-title"

      );


      /*
        寬 × 高
      */

      addText(

        group,

        textBaseX,

        textBaseY+70,

        "寬 "+
        Math.round(
          Number(
            windowItem.width
          )
        )+
        " × 高 "+
        Math.round(
          Number(
            windowItem.height
          )
        ),

        "window-detail"

      );


      /*
        離地
      */

      addText(

        group,

        textBaseX,

        textBaseY+130,

        "離地 "+
        Math.round(
          Number(
            windowItem.sillHeight
          )||0
        ),

        "window-height"

      );

    }
  );

}


/* =========================================================
   ★ 門
========================================================= */

function drawDoors(group){

  doors.forEach(
    (door,index)=>{

      const wall=
        walls[
          door.wallIndex
        ];


      if(!wall){
        return;
      }


      const g=
        wallGeometry(
          wall
        );


      const ref=
        getWallReferenceInfo(
          wall
        );


      const startX=
        wall.start.x+
        g.ux*
        Number(
          door.offset
        );


      const startY=
        wall.start.y+
        g.uy*
        Number(
          door.offset
        );


      const endX=
        startX+
        g.ux*
        Number(
          door.width
        );


      const endY=
        startY+
        g.uy*
        Number(
          door.width
        );


      /*
        門洞
      */

      group.appendChild(
        createSvgElement(
          "line",
          {

            x1:startX,

            y1:startY,

            x2:endX,

            y2:endY,

            class:
              "door-line"

          }
        )
      );


      /*
        鉸鍊位置
      */

      let hingeX;

      let hingeY;


      if(
        door.swing==="left"
      ){

        if(
          ref.leftAtStart
        ){

          hingeX=startX;

          hingeY=startY;

        }else{

          hingeX=endX;

          hingeY=endY;

        }

      }else{

        if(
          ref.rightAtStart
        ){

          hingeX=endX;

          hingeY=endY;

        }else{

          hingeX=startX;

          hingeY=startY;

        }

      }


      /*
        門扇
      */

      const leafEndX=
        hingeX+
        ref.roomNx*
        Number(
          door.width
        );


      const leafEndY=
        hingeY+
        ref.roomNy*
        Number(
          door.width
        );


      group.appendChild(
        createSvgElement(
          "line",
          {

            x1:
              hingeX,

            y1:
              hingeY,

            x2:
              leafEndX,

            y2:
              leafEndY,

            class:
              "door-leaf"

          }
        )
      );


      /*
        開門弧線
      */

      group.appendChild(
        createSvgElement(
          "path",
          {

            d:
              "M "+
              startX+
              " "+
              startY+
              " A "+
              Number(door.width)+
              " "+
              Number(door.width)+
              " 0 0 1 "+
              leafEndX+
              " "+
              leafEndY,

            class:
              "door-arc"

          }
        )
      );


      /*
        文字位置
      */

      const centerX=
        (
          startX+
          endX
        )/2;


      const centerY=
        (
          startY+
          endY
        )/2;


      const textBaseX=
        centerX+
        ref.roomNx*
        110;


      const textBaseY=
        centerY+
        ref.roomNy*
        110;


      addText(

        group,

        textBaseX,

        textBaseY,

        "門",

        "door-title"

      );


      addText(

        group,

        textBaseX,

        textBaseY+70,

        "寬 "+
        Math.round(
          Number(
            door.width
          )
        )+
        " × 高 "+
        Math.round(
          Number(
            door.height
          )
        ),

        "door-detail"

      );


      addText(

        group,

        textBaseX,

        textBaseY+130,

        "離地 "+
        Math.round(
          Number(
            door.floorHeight
          )||0
        ),

        "door-height"

      );

    }
  );

}


/* =========================================================
   門窗距離文字
========================================================= */

function drawOpeningDistances(group){

  windows.forEach(
    windowItem=>{

      const wall=
        walls[
          windowItem.wallIndex
        ];


      if(!wall){
        return;
      }


      const distance=
        offsetToReferenceDistance(

          wall,

          windowItem.side||"left",

          Number(
            windowItem.offset
          ),

          Number(
            windowItem.width
          )

        );


      const g=
        wallGeometry(
          wall
        );


      const ref=
        getWallReferenceInfo(
          wall
        );


      let x;

      let y;


      if(
        (
          windowItem.side==="left" &&
          ref.leftAtStart
        )
        ||
        (
          windowItem.side==="right" &&
          ref.rightAtStart
        )
      ){

        x=
          wall.start.x+
          g.ux*
          Number(
            windowItem.offset
          );

        y=
          wall.start.y+
          g.uy*
          Number(
            windowItem.offset
          );

      }else{

        x=
          wall.end.x-
          g.ux*
          Number(
            windowItem.offset
          );

        y=
          wall.end.y-
          g.uy*
          Number(
            windowItem.offset
          );

      }


      addText(

        group,

        x+
        ref.roomNx*
        70,

        y+
        ref.roomNy*
        70,

        Math.round(
          distance
        ),

        "offset-text"

      );

    }
  );


  doors.forEach(
    door=>{

      const wall=
        walls[
          door.wallIndex
        ];


      if(!wall){
        return;
      }


      const distance=
        offsetToReferenceDistance(

          wall,

          door.side||"left",

          Number(
            door.offset
          ),

          Number(
            door.width
          )

        );


      const g=
        wallGeometry(
          wall
        );


      const ref=
        getWallReferenceInfo(
          wall
        );


      let x;

      let y;


      if(
        (
          door.side==="left" &&
          ref.leftAtStart
        )
        ||
        (
          door.side==="right" &&
          ref.rightAtStart
        )
      ){

        x=
          wall.start.x+
          g.ux*
          Number(
            door.offset
          );

        y=
          wall.start.y+
          g.uy*
          Number(
            door.offset
          );

      }else{

        x=
          wall.end.x-
          g.ux*
          Number(
            door.offset
          );

        y=
          wall.end.y-
          g.uy*
          Number(
            door.offset
          );

      }


      addText(

        group,

        x+
        ref.roomNx*
        80,

        y+
        ref.roomNy*
        80,

        Math.round(
          distance
        ),

        "offset-text"

      );

    }
  );

}


/* =========================================================
   樓高
========================================================= */

function drawFloorHeight(group){

  if(
    !floorHeight
  ){
    return;
  }


  const center=
    getRoomCenter();


  addText(

    group,

    center.x,

    center.y,

    "樓高 "+
    Math.round(
      floorHeight
    )+
    " mm",

    "height-text"

  );

}


/* =========================================================
   樑
========================================================= */

function drawBeams(group){

  beams.forEach(
    beam=>{

      const wall=
        walls[
          beam.wallIndex
        ];


      if(!wall){
        return;
      }


      const ref=
        getWallReferenceInfo(
          wall
        );


      const distance=
        Number(
          beam.distance
        )||0;


      const startX=
        wall.start.x+
        ref.roomNx*
        distance;


      const startY=
        wall.start.y+
        ref.roomNy*
        distance;


      const endX=
        wall.end.x+
        ref.roomNx*
        distance;


      const endY=
        wall.end.y+
        ref.roomNy*
        distance;


      group.appendChild(
        createSvgElement(
          "line",
          {

            x1:startX,

            y1:startY,

            x2:endX,

            y2:endY,

            class:
              "beam-line"

          }
        )
      );


      const beamHeight=
        Number(floorHeight)-
        Number(beam.bottom||0);


      const centerX=
        (
          startX+
          endX
        )/2;


      const centerY=
        (
          startY+
          endY
        )/2;


      addText(

        group,

        centerX+
        ref.roomNx*
        80,

        centerY+
        ref.roomNy*
        80,

        "樑 "+
        Math.round(
          beamHeight
        )+
        "mm",

        "beam-text"

      );


      if(
        distance>0
      ){

        addText(

          group,

          (
            startX+
            wall.start.x
          )/2+
          ref.roomNx*
          35,

          (
            startY+
            wall.start.y
          )/2+
          ref.roomNy*
          35,

          "離牆 "+
          Math.round(
            distance
          ),

          "beam-distance-text"

        );

      }

    }
  );

}


/* =========================================================
   Render
========================================================= */

function render(){

  const group=
    document.getElementById(
      "drawingGroup"
    );


  group.innerHTML="";


  drawWalls(
    group
  );

  drawWindows(
    group
  );

  drawDoors(
    group
  );

  drawOpeningDistances(
    group
  );

  drawBeams(
    group
  );

  drawFloorHeight(
    group
  );


  if(
    walls.length===0
  ){

    addText(

      group,

      0,

      0,

      "請輸入牆長開始丈量",

      "center-label"

    );

  }

}


/* =========================================================
   Fit View
========================================================= */

function fitView(){

  const svg=
    document.getElementById(
      "drawing"
    );


  const group=
    document.getElementById(
      "drawingGroup"
    );


  if(!group){
    return;
  }


  let bbox;


  try{

    bbox=
      group.getBBox();

  }catch(error){

    return;

  }


  if(
    !bbox.width &&
    !bbox.height
  ){

    svg.setAttribute(
      "viewBox",
      "-500 -500 1500 1500"
    );

    return;

  }


  const padding=350;


  let x=
    bbox.x-
    padding;


  let y=
    bbox.y-
    padding;


  let width=
    bbox.width+
    padding*2;


  let height=
    bbox.height+
    padding*2;


  const minSize=1500;


  if(
    width<minSize
  ){

    const extra=
      (
        minSize-
        width
      )/2;

    x-=extra;

    width=minSize;

  }


  if(
    height<minSize
  ){

    const extra=
      (
        minSize-
        height
      )/2;

    y-=extra;

    height=minSize;

  }


  svg.setAttribute(
    "viewBox",
    `${x} ${y} ${width} ${height}`
  );

}


/* =========================================================
   鍵盤
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    const active=
      document.activeElement;


    if(
      event.key==="Enter"
    ){

      if(
        currentTool==="wall" &&
        active &&
        active.id==="wallLength"
      ){

        event.preventDefault();

        addWall();

      }

      return;

    }


    if(
      currentTool!=="wall"
    ){

      return;

    }


    const directionMap={

      ArrowUp:"up",

      ArrowDown:"down",

      ArrowLeft:"left",

      ArrowRight:"right"

    };


    const direction=
      directionMap[
        event.key
      ];


    if(!direction){
      return;
    }


    if(
      active &&
      active.id==="wallLength"
    ){

      event.preventDefault();

      setDirection(
        direction
      );

      return;

    }


    if(
      active &&
      (
        active.tagName==="INPUT" ||
        active.tagName==="TEXTAREA" ||
        active.tagName==="SELECT"
      )
    ){

      return;

    }


    event.preventDefault();

    setDirection(
      direction
    );

  }
);


/* =========================================================
   Export SVG
========================================================= */

function createExportSvg(){

  const original=
    document.getElementById(
      "drawing"
    );


  const clone=
    original.cloneNode(
      true
    );


  clone.setAttribute(
    "xmlns",
    "http://www.w3.org/2000/svg"
  );


  clone.setAttribute(
    "width",
    "2400"
  );


  clone.setAttribute(
    "height",
    "1600"
  );


  return clone;

}


/* =========================================================
   Export JPG
========================================================= */

function exportJPG(){

  fitView();


  const svg=
    createExportSvg();


  const serializer=
    new XMLSerializer();


  const source=
    serializer.serializeToString(
      svg
    );


  const blob=
    new Blob(
      [source],
      {
        type:
          "image/svg+xml;charset=utf-8"
      }
    );


  const url=
    URL.createObjectURL(
      blob
    );


  const img=
    new Image();


  img.onload=function(){

    URL.revokeObjectURL(
      url
    );


    const canvas=
      document.createElement(
        "canvas"
      );


    canvas.width=2400;

    canvas.height=1600;


    const ctx=
      canvas.getContext(
        "2d"
      );


    ctx.fillStyle=
      "#ffffff";


    ctx.fillRect(
      0,
      0,
      2400,
      1600
    );


    ctx.drawImage(
      img,
      0,
      0,
      2400,
      1600
    );


    canvas.toBlob(
      function(result){

        if(!result){

          alert(
            "JPG 匯出失敗"
          );

          return;

        }


        const a=
          document.createElement(
            "a"
          );


        a.href=
          URL.createObjectURL(
            result
          );


        a.download=
          (
            document.getElementById(
              "caseName"
            ).value||
            "房屋丈量"
          )+
          ".jpg";


        a.click();

      },
      "image/jpeg",
      .95
    );

  };


  img.onerror=function(){

    URL.revokeObjectURL(
      url
    );

    alert(
      "圖片匯出失敗"
    );

  };


  img.src=url;

}

/* =========================================================
   初始化
========================================================= */

function init(){

  const cases=
    JSON.parse(
      localStorage.getItem(
        "measureCases"
      )||"[]"
    );


  if(
    cases.length>0
  ){

    const latest=
      [...cases].sort(
        (a,b)=>
          (
            b.updatedAt||0
          )-
          (
            a.updatedAt||0
          )
      )[0];


    loadCase(
      latest
    );

  }else{

    walls=[];

    windows=[];

    doors=[];

    beams=[];

    points=[
      {
        x:0,
        y:0
      }
    ];

    floorHeight=0;

    render();

  }


  setDirection(
    "right"
  );

}


init();

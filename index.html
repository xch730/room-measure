<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>房屋丈量畫圖工具</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f5f5f5;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,
  "PingFang TC","Noto Sans TC",Arial,sans-serif;
}

header{
  background:#222;
  color:white;
  padding:14px 12px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-title{
  font-size:18px;
  font-weight:700;
}

.case-name{
  font-size:13px;
  opacity:.8;
  margin-top:4px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.panel{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.panel-title{
  font-weight:700;
  margin-bottom:10px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-size:15px;
  background:white;
  color:#222;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
  touch-action:manipulation;
}

button:active{
  transform:scale(.97);
}

input,select{
  width:100%;
  height:46px;
  border:1px solid #ccc;
  border-radius:10px;
  padding:0 12px;
  font-size:18px;
  background:white;
}

.tool-row{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.tool-row button{
  padding:10px 4px;
  font-size:14px;
}

.tool-active{
  background:#222;
  color:white;
}

.input-row{
  display:flex;
  gap:8px;
}

.direction-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.direction-grid button{
  height:46px;
  font-size:20px;
}

.direction-empty{
  visibility:hidden;
}

.direction-active{
  background:#222;
  color:white;
}

.primary{
  background:#222;
  color:white;
}

.window-btn{
  background:#1976d2;
  color:white;
}

.door-btn{
  background:#e67e22;
  color:white;
}

.beam-btn{
  background:#795548;
  color:white;
}

.danger{
  background:#d32f2f;
  color:white;
}

.secondary{
  background:#e9e9e9;
}

.placement-panel{
  display:none;
}

.info{
  background:#f1f1f1;
  border-radius:10px;
  padding:10px;
  font-size:14px;
  line-height:1.6;
  margin-bottom:10px;
}

.selected-info{
  background:#eee7ff;
  color:#5d35a8;
}

.action-row{
  display:flex;
  gap:8px;
}

.action-row button{
  flex:1;
}

#drawingWrap{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

svg{
  width:100%;
  height:65vh;
  min-height:420px;
  display:block;
  background:#fafafa;
  touch-action:none;
}

.wall{
  stroke:#111;
  stroke-width:8;
  stroke-linecap:round;
}

.wall-hit{
  stroke:transparent;
  stroke-width:40;
  pointer-events:stroke;
}

.window-line{
  stroke:#1976d2;
  stroke-width:5;
}

.door-line{
  stroke:#e67e22;
  stroke-width:5;
}

.door-leaf{
  stroke:#e67e22;
  stroke-width:4;
}

.door-arc{
  stroke:#e67e22;
  stroke-width:3;
  stroke-dasharray:8 6;
  fill:none;
}

.beam-line{
  stroke:#795548;
  stroke-width:22;
  stroke-linecap:round;
  opacity:.8;
}

.dimension{
  stroke:#555;
  stroke-width:2;
}

.dimension-text{
  fill:#222;
  font-size:42px;
  font-weight:700;
  text-anchor:middle;
  dominant-baseline:middle;
  paint-order:stroke;
  stroke:white;
  stroke-width:8;
}

.window-text{
  fill:#1976d2;
  font-size:34px;
  font-weight:700;
  text-anchor:middle;
  dominant-baseline:middle;
  paint-order:stroke;
  stroke:white;
  stroke-width:8;
}

.door-text{
  fill:#e67e22;
  font-size:34px;
  font-weight:700;
  text-anchor:middle;
  dominant-baseline:middle;
  paint-order:stroke;
  stroke:white;
  stroke-width:8;
}

.offset-text{
  fill:#6a35a8;
  font-size:30px;
  font-weight:700;
  text-anchor:middle;
  dominant-baseline:middle;
  paint-order:stroke;
  stroke:white;
  stroke-width:8;
}

.height-text{
  fill:#333;
  font-size:55px;
  font-weight:700;
  text-anchor:middle;
  dominant-baseline:middle;
  paint-order:stroke;
  stroke:white;
  stroke-width:12;
}

.beam-text{
  fill:#795548;
  font-size:42px;
  font-weight:700;
  text-anchor:middle;
  dominant-baseline:middle;
  paint-order:stroke;
  stroke:white;
  stroke-width:10;
}

.point{
  fill:#111;
}

.legend{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  font-size:13px;
  padding:10px 4px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
}

.legend-line{
  width:25px;
  height:4px;
}

.black{background:#111}
.blue{background:#1976d2}
.orange{background:#e67e22}
.brown{background:#795548}
.purple{background:#6a35a8}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:50;
  display:none;
  align-items:flex-end;
}

.sheet{
  background:white;
  width:100%;
  max-height:80vh;
  overflow:auto;
  border-radius:20px 20px 0 0;
  padding:18px;
}

.sheet-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:12px;
}

.case-item{
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  margin-bottom:8px;
}

.case-item-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.case-item-name{
  font-weight:700;
}

.case-item-time{
  color:#777;
  font-size:12px;
  margin-top:4px;
}

.small-btn{
  padding:8px 10px;
  font-size:13px;
}

.close-btn{
  width:100%;
  margin-top:8px;
}
</style>
</head>

<body>

<header>
<div class="header-row">

<div>
<div class="header-title">
房屋丈量畫圖工具
</div>

<div class="case-name" id="currentCaseName">
尚未建立案件
</div>
</div>

<div style="display:flex;gap:6px;">
<button onclick="newCase()">＋案件</button>
<button onclick="openCases()">📁</button>
</div>

</div>
</header>


<div class="container">

<!-- 工具 -->
<div class="panel">

<div class="panel-title">目前工具</div>

<div class="tool-row">

<button id="toolWall"
class="tool-active"
onclick="selectTool('wall')">
🧱牆線
</button>

<button id="toolWindow"
onclick="selectTool('window')">
🪟窗戶
</button>

<button id="toolDoor"
onclick="selectTool('door')">
🚪門
</button>

<button id="toolHeight"
onclick="selectTool('height')">
🏠樓高
</button>

<button id="toolBeam"
onclick="selectTool('beam')">
▰樑
</button>

</div>
</div>


<!-- 畫牆 -->
<div class="panel" id="wallPanel">

<div class="panel-title">畫牆面</div>

<input
id="wallLength"
type="number"
inputmode="numeric"
placeholder="輸入牆長，例如 3000"
autocomplete="off">

<div class="direction-grid">

<button class="direction-empty">　</button>

<button id="upBtn"
onclick="setDirection('up')">
↑
</button>

<button class="direction-empty">　</button>

<button id="leftBtn"
onclick="setDirection('left')">
←
</button>

<button id="downBtn"
onclick="setDirection('down')">
↓
</button>

<button id="rightBtn"
class="direction-active"
onclick="setDirection('right')">
→
</button>

</div>

<button
class="primary"
style="width:100%;margin-top:10px;"
onclick="addWall()">
＋新增牆面
</button>

<div class="tip">
輸入尺寸 → 選方向 → 新增牆面。
<br>
可以連續輸入，不需要一直重新點輸入框。
</div>

</div>


<!-- 樓高 / 樑 -->
<div class="panel placement-panel" id="heightPanel">

<div class="panel-title" id="heightPanelTitle">
🏠 樓高
</div>

<div id="heightForm">

<label>樓高 H（mm）</label>

<input
id="floorHeight"
type="number"
inputmode="numeric"
placeholder="例如 3000">

<button
class="primary"
style="width:100%;margin-top:10px;"
onclick="addFloorHeight()">
＋設定樓高
</button>

</div>


<div id="beamForm" style="display:none;">

<div class="info">
樑高會自動計算：<br>
<strong>樓高 − 樑下高度 = 樑高</strong>
</div>

<label>樑下高度（mm）</label>

<input
id="beamBottomHeight"
type="number"
inputmode="numeric"
placeholder="例如 2400">

<br><br>

<label>樑深度 D（mm）</label>

<input
id="beamDepth"
type="number"
inputmode="numeric"
placeholder="例如 600">

<button
class="beam-btn"
style="width:100%;margin-top:10px;"
onclick="addBeam()">
＋新增樑
</button>

<div
class="info"
style="margin-top:10px;">
目前樓高：
<strong id="currentFloorHeight">
尚未設定
</strong>
</div>

</div>

</div>


<!-- 門窗 -->
<div
class="panel placement-panel"
id="openingPanel">

<div
class="panel-title"
id="placementTitle">
放置門窗
</div>

<div
class="info"
id="selectedWallInfo">
請先在下方圖面上點擊要放置門窗的牆面。
</div>

<div id="openingForm" style="display:none;">

<label>寬度 mm</label>

<input
id="openingWidth"
type="number"
inputmode="numeric"
placeholder="例如 900">

<br><br>

<label>高度 mm</label>

<input
id="openingHeight"
type="number"
inputmode="numeric"
placeholder="例如 2100">

<br><br>

<label>離地高度 / 窗台高度 mm</label>

<input
id="openingSill"
type="number"
inputmode="numeric"
value="0">

<br><br>

<label>距離牆端 mm</label>

<input
id="openingOffset"
type="number"
inputmode="numeric"
placeholder="例如 500">

<br><br>

<div id="doorSwingBox" style="display:none;">

<label>開門方向</label>

<select id="doorSwing">

<option value="left">左開</option>
<option value="right">右開</option>

</select>

<br><br>

</div>

<button
id="addOpeningBtn"
class="primary"
style="width:100%;"
onclick="addOpening()">
新增
</button>

<br><br>

<button
class="secondary"
style="width:100%;"
onclick="cancelWallSelection()">
取消選擇
</button>

</div>

</div>


<!-- 操作 -->
<div class="panel">

<div class="action-row">

<button onclick="undo()">↩ 復原</button>

<button onclick="fitView()">🔍 自動縮放</button>

<button
class="danger"
onclick="clearAll()">
🗑 清除
</button>

</div>

</div>


<!-- 圖面 -->
<div id="drawingWrap">

<svg
id="drawing"
viewBox="-1000 -1000 2000 2000">

<defs>

<marker
id="arrow"
markerWidth="10"
markerHeight="10"
refX="5"
refY="5"
orient="auto"
markerUnits="strokeWidth">

<path
d="M 0 0 L 10 5 L 0 10 z"
fill="#555">
</path>

</marker>

</defs>

<g id="drawingGroup"></g>

</svg>

</div>


<div class="legend">

<div class="legend-item">
<div class="legend-line black"></div>
牆面
</div>

<div class="legend-item">
<div class="legend-line blue"></div>
窗戶
</div>

<div class="legend-item">
<div class="legend-line orange"></div>
門
</div>

<div class="legend-item">
<div class="legend-line brown"></div>
樑
</div>

<div class="legend-item">
<div class="legend-line purple"></div>
定位
</div>

</div>

</div>


<!-- 案件 -->
<div class="overlay" id="caseOverlay">

<div class="sheet">

<div class="sheet-title">
已儲存案件
</div>

<div id="caseList"></div>

<button
class="secondary close-btn"
onclick="closeCases()">
關閉
</button>

</div>
</div>


<script>

/* =========================
資料
========================= */

let points = [{x:0,y:0}];

let walls = [];

let windows = [];

let doors = [];

let beams = [];

let floorHeight = null;

let currentDirection = "right";

let currentTool = "wall";

let selectedWallIndex = null;

let selectedTapDistance = 0;

let currentCaseId = null;

let currentCaseName = "";

let history = [];


/* =========================
工具切換
========================= */

function selectTool(tool){

currentTool = tool;

const ids = [
"toolWall",
"toolWindow",
"toolDoor",
"toolHeight",
"toolBeam"
];

ids.forEach(function(id){
document.getElementById(id)
.classList.remove("tool-active");
});


if(tool === "wall"){

document.getElementById("toolWall")
.classList.add("tool-active");

document.getElementById("wallPanel")
.style.display = "block";

document.getElementById("openingPanel")
.style.display = "none";

document.getElementById("heightPanel")
.style.display = "none";

}


if(tool === "window" || tool === "door"){

document.getElementById(
tool === "window"
? "toolWindow"
: "toolDoor"
).classList.add("tool-active");

document.getElementById("wallPanel")
.style.display = "none";

document.getElementById("heightPanel")
.style.display = "none";

document.getElementById("openingPanel")
.style.display = "block";


if(tool === "window"){

document.getElementById("placementTitle")
.textContent = "🪟 放置窗戶";

document.getElementById("addOpeningBtn")
.textContent = "＋新增窗戶";

document.getElementById("addOpeningBtn")
.className = "window-btn";

document.getElementById("doorSwingBox")
.style.display = "none";

}else{

document.getElementById("placementTitle")
.textContent = "🚪 放置門";

document.getElementById("addOpeningBtn")
.textContent = "＋新增門";

document.getElementById("addOpeningBtn")
.className = "door-btn";

document.getElementById("doorSwingBox")
.style.display = "block";

}

cancelWallSelection();

}


if(tool === "height"){

document.getElementById("toolHeight")
.classList.add("tool-active");

document.getElementById("wallPanel")
.style.display = "none";

document.getElementById("openingPanel")
.style.display = "none";

document.getElementById("heightPanel")
.style.display = "block";

document.getElementById("heightPanelTitle")
.textContent = "🏠 樓高";

document.getElementById("heightForm")
.style.display = "block";

document.getElementById("beamForm")
.style.display = "none";

}


if(tool === "beam"){

document.getElementById("toolBeam")
.classList.add("tool-active");

document.getElementById("wallPanel")
.style.display = "none";

document.getElementById("openingPanel")
.style.display = "none";

document.getElementById("heightPanel")
.style.display = "block";

document.getElementById("heightPanelTitle")
.textContent = "▰ 樑";

document.getElementById("heightForm")
.style.display = "none";

document.getElementById("beamForm")
.style.display = "block";

document.getElementById("currentFloorHeight")
textContent =
floorHeight
? floorHeight + " mm"
: "尚未設定";

}

}


/* =========================
方向
========================= */

function setDirection(direction){

currentDirection = direction;

document
.querySelectorAll(".direction-grid button")
.forEach(function(btn){
btn.classList.remove("direction-active");
});

const map = {
up:"upBtn",
down:"downBtn",
left:"leftBtn",
right:"rightBtn"
};

document.getElementById(map[direction])
.classList.add("direction-active");

}


/* =========================
新增牆
========================= */

function addWall(){

const input =
document.getElementById("wallLength");

const length =
Number(input.value);

if(!length || length <= 0){
input.focus();
return;
}

const last =
points[points.length-1];

let dx=0;
let dy=0;

if(currentDirection==="right") dx=length;
if(currentDirection==="left") dx=-length;
if(currentDirection==="down") dy=length;
if(currentDirection==="up") dy=-length;

const end={
x:last.x+dx,
y:last.y+dy
};

saveHistory();

walls.push({
start:{...last},
end:{...end},
length:length
});

points.push(end);

saveCase();

render();

}


/* =========================
樓高
========================= */

function addFloorHeight(){

const input =
document.getElementById("floorHeight");

const value =
Number(input.value);

if(!value || value<=0){

alert("請輸入正確樓高。");

input.focus();

return;

}

saveHistory();

floorHeight=value;

document.getElementById(
"currentFloorHeight"
).textContent =
value+" mm";

saveCase();

render();

}


/* =========================
新增樑
========================= */

function addBeam(){

if(!floorHeight){

alert(
"請先設定樓高。"
);

return;

}

const bottom =
Number(
document.getElementById(
"beamBottomHeight"
).value
);

const depth =
Number(
document.getElementById(
"beamDepth"
).value
);

if(!bottom || bottom<=0){

alert(
"請輸入樑下高度。"
);

return;

}

if(!depth || depth<=0){

alert(
"請輸入樑深度。"
);

return;

}

const height =
floorHeight-bottom;

if(height<=0){

alert(
"樑下高度不能大於或等於樓高。"
);

return;

}

saveHistory();

beams.push({

bottomHeight:bottom,

height:height,

depth:depth

});

saveCase();

render();

}


/* =========================
案件
========================= */

function newCase(){

const name =
prompt("請輸入案件名稱");

if(!name)return;

currentCaseId =
Date.now().toString();

currentCaseName=name;

points=[{x:0,y:0}];

walls=[];

windows=[];

doors=[];

beams=[];

floorHeight=null;

history=[];

selectedWallIndex=null;

selectedTapDistance=0;

updateCaseName();

saveCase();

render();

}


function updateCaseName(){

document.getElementById(
"currentCaseName"
).textContent =
currentCaseName ||
"尚未建立案件";

}


function saveCase(){

if(!currentCaseId)return;

const data =
JSON.parse(
localStorage.getItem(
"measureCases"
)||"[]"
);

const item={

id:currentCaseId,

name:currentCaseName,

points:points,

walls:walls,

windows:windows,

doors:doors,

beams:beams,

floorHeight:floorHeight,

updatedAt:Date.now()

};

const index =
data.findIndex(
x=>x.id===currentCaseId
);

if(index>=0)
data[index]=item;
else
data.push(item);

localStorage.setItem(
"measureCases",
JSON.stringify(data)
);

}


function openCases(){

const overlay =
document.getElementById(
"caseOverlay"
);

const list =
document.getElementById(
"caseList"
);

const data =
JSON.parse(
localStorage.getItem(
"measureCases"
)||"[]"
);

list.innerHTML="";

if(data.length===0){

list.innerHTML=
`<div class="info">
目前沒有儲存的案件
</div>`;

}else{

data
.sort((a,b)=>b.updatedAt-a.updatedAt)
.forEach(function(item){

const div =
document.createElement("div");

div.className="case-item";

const date =
new Date(
item.updatedAt
).toLocaleString();

div.innerHTML=`

<div class="case-item-row">

<div>

<div class="case-item-name">
${escapeHtml(item.name)}
</div>

<div class="case-item-time">
${date}
</div>

</div>

<div style="display:flex;gap:6px;">

<button
class="small-btn"
onclick="loadCase('${item.id}')">
開啟
</button>

<button
class="small-btn danger"
onclick="deleteCase('${item.id}')">
刪除
</button>

</div>

</div>
`;

list.appendChild(div);

});

}

overlay.style.display="flex";

}


function closeCases(){

document.getElementById(
"caseOverlay"
).style.display="none";

}


function loadCase(id){

const data =
JSON.parse(
localStorage.getItem(
"measureCases"
)||"[]"
);

const item =
data.find(x=>x.id===id);

if(!item)return;

currentCaseId=item.id;

currentCaseName=item.name;

points=item.points||[{x:0,y:0}];

walls=item.walls||[];

windows=item.windows||[];

doors=item.doors||[];

beams=item.beams||[];

floorHeight=item.floorHeight||null;

history=[];

selectedWallIndex=null;

selectedTapDistance=0;

updateCaseName();

closeCases();

render();

}


function deleteCase(id){

if(!confirm(
"確定要刪除這個案件嗎？"
))return;

let data =
JSON.parse(
localStorage.getItem(
"measureCases"
)||"[]"
);

data=data.filter(x=>x.id!==id);

localStorage.setItem(
"measureCases",
JSON.stringify(data)
);

openCases();

}


function escapeHtml(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================
歷史
========================= */

function saveHistory(){

history.push({

points:JSON.parse(
JSON.stringify(points)
),

walls:JSON.parse(
JSON.stringify(walls)
),

windows:JSON.parse(
JSON.stringify(windows)
),

doors:JSON.parse(
JSON.stringify(doors)
),

beams:JSON.parse(
JSON.stringify(beams)
),

floorHeight:floorHeight

});

}


function undo(){

if(history.length===0)return;

const state=history.pop();

points=state.points;

walls=state.walls;

windows=state.windows;

doors=state.doors;

beams=state.beams;

floorHeight=state.floorHeight;

selectedWallIndex=null;

saveCase();

render();

}


/* =========================
清除
========================= */

function clearAll(){

if(!confirm(
"確定要清除目前圖面嗎？"
))return;

saveHistory();

points=[{x:0,y:0}];

walls=[];

windows=[];

doors=[];

beams=[];

floorHeight=null;

selectedWallIndex=null;

selectedTapDistance=0;

saveCase();

render();

}


/* =========================
SVG
========================= */

function screenToSvg(evt){

const svg =
document.getElementById("drawing");

const point =
svg.createSVGPoint();

point.x=evt.clientX;

point.y=evt.clientY;

const matrix =
svg.getScreenCTM();

return point.matrixTransform(
matrix.inverse()
);

}


/* =========================
選牆
========================= */

function pointToSegment(
px,py,x1,y1,x2,y2
){

const dx=x2-x1;

const dy=y2-y1;

if(dx===0&&dy===0){

return{
distance:Math.hypot(
px-x1,py-y1
),
t:0
};

}

const t=Math.max(
0,
Math.min(
1,
(
(px-x1)*dx+
(py-y1)*dy
)/
(dx*dx+dy*dy)
)
);

const x=x1+t*dx;

const y=y1+t*dy;

return{
distance:Math.hypot(
px-x,py-y
),
t:t
};

}


function selectWallByTap(evt){

if(
currentTool!=="window" &&
currentTool!=="door"
)return;

if(walls.length===0){

alert("請先畫牆面。");

return;

}

const p=screenToSvg(evt);

let bestIndex=null;

let bestDistance=Infinity;

let bestT=0;

walls.forEach(function(wall,index){

const result=
pointToSegment(
p.x,p.y,
wall.start.x,
wall.start.y,
wall.end.x,
wall.end.y
);

if(result.distance<bestDistance){

bestDistance=result.distance;

bestIndex=index;

bestT=result.t;

}

});

if(bestDistance>150)return;

selectedWallIndex=bestIndex;

selectedTapDistance=Math.round(
walls[bestIndex].length*bestT
);

document.getElementById(
"openingForm"
).style.display="block";

document.getElementById(
"openingOffset"
).value=
selectedTapDistance;

document.getElementById(
"selectedWallInfo"
).className=
"info selected-info";

document.getElementById(
"selectedWallInfo"
).textContent=
`已選擇第 ${bestIndex+1} 面牆｜牆長 ${walls[bestIndex].length} mm｜點擊位置約 ${selectedTapDistance} mm`;

render();

}


function cancelWallSelection(){

selectedWallIndex=null;

selectedTapDistance=0;

document.getElementById(
"openingForm"
).style.display="none";

const info=
document.getElementById(
"selectedWallInfo"
);

info.className="info";

info.textContent=
"請先在下方圖面上點擊要放置門窗的牆面。";

render();

}


/* =========================
門窗
========================= */

function addOpening(){

if(selectedWallIndex===null){

alert(
"請先點擊要放置門窗的牆面。"
);

return;

}

const width=
Number(
document.getElementById(
"openingWidth"
).value
);

const height=
Number(
document.getElementById(
"openingHeight"
).value
);

const sill=
Number(
document.getElementById(
"openingSill"
).value
);

const offset=
Number(
document.getElementById(
"openingOffset"
).value
);

if(!width||width<=0){

alert("請輸入門窗寬度。");

return;

}

if(!height||height<=0){

alert("請輸入門窗高度。");

return;

}

if(offset<0){

alert("距離牆端不能小於 0。");

return;

}

const wall=walls[selectedWallIndex];

if(offset+width>wall.length){

alert(
`門窗超出牆面。\n\n`+
`牆長：${wall.length} mm\n`+
`位置：${offset} mm\n`+
`寬度：${width} mm`
);

return;

}

const existing=[

...windows,

...doors

];

const overlap=
existing
.filter(
x=>x.wallIndex===selectedWallIndex
)
.some(
x=>
offset<x.offset+x.width &&
offset+width>x.offset
);

if(overlap){

alert(
"這個位置和原本的門窗重疊了。"
);

return;

}

saveHistory();

if(currentTool==="window"){

windows.push({

wallIndex:selectedWallIndex,

offset:offset,

width:width,

height:height,

sill:sill

});

}else{

doors.push({

wallIndex:selectedWallIndex,

offset:offset,

width:width,

height:height,

sill:sill,

swing:
document.getElementById(
"doorSwing"
).value

});

}

saveCase();

cancelWallSelection();

render();

}


/* =========================
幾何
========================= */

function wallGeometry(wall){

const dx=
wall.end.x-wall.start.x;

const dy=
wall.end.y-wall.start.y;

const len=
Math.hypot(dx,dy);

return{

ux:dx/len,

uy:dy/len,

nx:-dy/len,

ny:dx/len,

len:len

};

}


function pointAlongWall(
wall,
distance
){

const g=wallGeometry(wall);

return{

x:
wall.start.x+
g.ux*distance,

y:
wall.start.y+
g.uy*distance

};

}


/* =========================
牆
========================= */

function drawWalls(group){

walls.forEach(function(wall,index){

const openings=[

...windows
.filter(x=>x.wallIndex===index)
.map(x=>({...x,type:"window"})),

...doors
.filter(x=>x.wallIndex===index)
.map(x=>({...x,type:"door"}))

];

openings.sort(
(a,b)=>a.offset-b.offset
);

let current=0;

openings.forEach(function(opening){

if(opening.offset>current){

drawWallSegment(
group,
wall,
current,
opening.offset
);

}

current=
opening.offset+
opening.width;

});

if(current<wall.length){

drawWallSegment(
group,
wall,
current,
wall.length
);

}

const hit=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

hit.setAttribute("x1",wall.start.x);
hit.setAttribute("y1",wall.start.y);
hit.setAttribute("x2",wall.end.x);
hit.setAttribute("y2",wall.end.y);
hit.setAttribute("class","wall-hit");

group.appendChild(hit);

drawDimension(
group,
wall.start,
wall.end,
wall.length,
140
);

});

}


function drawWallSegment(
group,
wall,
startDistance,
endDistance
){

const start=
pointAlongWall(
wall,
startDistance
);

const end=
pointAlongWall(
wall,
endDistance
);

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute(
"x1",start.x
);

line.setAttribute(
"y1",start.y
);

line.setAttribute(
"x2",end.x
);

line.setAttribute(
"y2",end.y
);

line.setAttribute(
"class","wall"
);

group.appendChild(line);

}


/* =========================
尺寸
========================= */

function drawDimension(
group,
start,
end,
value,
offset
){

const dx=end.x-start.x;

const dy=end.y-start.y;

const len=Math.hypot(dx,dy);

if(!len)return;

const ux=dx/len;

const uy=dy/len;

const nx=-uy;

const ny=ux;

const s={
x:start.x+nx*offset,
y:start.y+ny*offset
};

const e={
x:end.x+nx*offset,
y:end.y+ny*offset
};

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1",s.x);
line.setAttribute("y1",s.y);
line.setAttribute("x2",e.x);
line.setAttribute("y2",e.y);
line.setAttribute("class","dimension");
line.setAttribute(
"marker-start",
"url(#arrow)"
);
line.setAttribute(
"marker-end",
"url(#arrow)"
);

group.appendChild(line);

[start,end].forEach(function(p){

const q={
x:p.x+nx*offset,
y:p.y+ny*offset
};

const ext=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

ext.setAttribute("x1",p.x);
ext.setAttribute("y1",p.y);
ext.setAttribute("x2",q.x);
ext.setAttribute("y2",q.y);
ext.setAttribute("class","dimension");

group.appendChild(ext);

});

const text=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

text.setAttribute(
"x",(s.x+e.x)/2
);

text.setAttribute(
"y",(s.y+e.y)/2
);

text.setAttribute(
"class","dimension-text"
);

text.textContent=
`${value} mm`;

group.appendChild(text);

}


/* =========================
窗
========================= */

function drawWindow(group,w){

const wall=walls[w.wallIndex];

if(!wall)return;

const g=wallGeometry(wall);

const start=
pointAlongWall(
wall,w.offset
);

const end=
pointAlongWall(
wall,w.offset+w.width
);

const distance=25;

[-distance,distance]
.forEach(function(off){

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute(
"x1",
start.x+g.nx*off
);

line.setAttribute(
"y1",
start.y+g.ny*off
);

line.setAttribute(
"x2",
end.x+g.nx*off
);

line.setAttribute(
"y2",
end.y+g.ny*off
);

line.setAttribute(
"class","window-line"
);

group.appendChild(line);

});

drawColoredDimension(
group,
start,
end,
`${w.width} × ${w.height}`,
190,
"window-text"
);

drawOffsetDimension(
group,
wall,
w.offset
);

drawHeightText(
group,
start,
end,
`窗台離地 ${w.sill} mm`
);

}


/* =========================
門
========================= */

function drawDoor(group,d){

const wall=walls[d.wallIndex];

if(!wall)return;

const g=wallGeometry(wall);

const start=
pointAlongWall(
wall,d.offset
);

const end=
pointAlongWall(
wall,d.offset+d.width
);

let hinge;

if(d.swing==="left")
hinge=start;
else
hinge=end;

const leafEnd={
x:hinge.x+g.nx*d.width,
y:hinge.y+g.ny*d.width
};

const leaf=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

leaf.setAttribute("x1",hinge.x);
leaf.setAttribute("y1",hinge.y);
leaf.setAttribute("x2",leafEnd.x);
leaf.setAttribute("y2",leafEnd.y);
leaf.setAttribute("class","door-leaf");

group.appendChild(leaf);

const arc=
document.createElementNS(
"http://www.w3.org/2000/svg",
"path"
);

const sweep=
d.swing==="left"?1:0;

const r=d.width;

const free=
d.swing==="left"
?end
:start;

arc.setAttribute(
"d",
`M ${free.x} ${free.y}
A ${r} ${r} 0 0 ${sweep}
${leafEnd.x} ${leafEnd.y}`
);

arc.setAttribute(
"class","door-arc"
);

group.appendChild(arc);

drawColoredDimension(
group,
start,
end,
`${d.width} × ${d.height}`,
190,
"door-text"
);

drawOffsetDimension(
group,
wall,
d.offset
);

if(d.sill>0){

drawHeightText(
group,
start,
end,
`門檻離地 ${d.sill} mm`
);

}

}


/* =========================
彩色尺寸
========================= */

function drawColoredDimension(
group,
start,
end,
value,
offset,
className
){

const dx=end.x-start.x;

const dy=end.y-start.y;

const len=Math.hypot(dx,dy);

if(!len)return;

const nx=-dy/len;

const ny=dx/len;

const s={
x:start.x+nx*offset,
y:start.y+ny*offset
};

const e={
x:end.x+nx*offset,
y:end.y+ny*offset
};

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1",s.x);
line.setAttribute("y1",s.y);
line.setAttribute("x2",e.x);
line.setAttribute("y2",e.y);
line.setAttribute("class","dimension");

group.appendChild(line);

const text=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

text.setAttribute(
"x",(s.x+e.x)/2
);

text.setAttribute(
"y",(s.y+e.y)/2
);

text.setAttribute(
"class",className
);

text.textContent=value;

group.appendChild(text);

}


/* =========================
定位尺寸
========================= */

function drawOffsetDimension(
group,
wall,
offset
){

if(offset<=0)return;

const g=wallGeometry(wall);

const start=
pointAlongWall(wall,0);

const end=
pointAlongWall(wall,offset);

const distanceOffset=-180;

const s={
x:start.x+g.nx*distanceOffset,
y:start.y+g.ny*distanceOffset
};

const e={
x:end.x+g.nx*distanceOffset,
y:end.y+g.ny*distanceOffset
};

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1",s.x);
line.setAttribute("y1",s.y);
line.setAttribute("x2",e.x);
line.setAttribute("y2",e.y);
line.setAttribute("class","dimension");

group.appendChild(line);

const text=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

text.setAttribute(
"x",(s.x+e.x)/2
);

text.setAttribute(
"y",(s.y+e.y)/2-35
);

text.setAttribute(
"class","offset-text"
);

text.textContent=
`${offset} mm`;

group.appendChild(text);

}


/* =========================
高度文字
========================= */

function drawHeightText(
group,
start,
end,
value
){

const text=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

text.setAttribute(
"x",(start.x+end.x)/2
);

text.setAttribute(
"y",(start.y+end.y)/2-65
);

text.setAttribute(
"class","offset-text"
);

text.textContent=value;

group.appendChild(text);

}


/* =========================
樓高顯示
========================= */

function drawFloorHeight(group){

if(!floorHeight)
return;

let cx=0;
let cy=0;

if(points.length>1){

points.forEach(function(p){

cx+=p.x;
cy+=p.y;

});

cx/=points.length;
cy/=points.length;

}

const text=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

text.setAttribute(
"x",cx
);

text.setAttribute(
"y",cy
);

text.setAttribute(
"class","height-text"
);

text.textContent=
`樓H ${floorHeight} mm`;

group.appendChild(text);

}


/* =========================
樑
========================= */

function drawBeams(group){

if(!beams.length)
return;

beams.forEach(function(beam,index){

/*
  樑目前以圖面中央
  做示意標示。

  因為樑的「位置」還沒設定，
  下一階段可以再增加：
  點牆 → 樑位置 → 樑長度。
*/

let cx=0;
let cy=0;

if(points.length>1){

points.forEach(function(p){

cx+=p.x;
cy+=p.y;

});

cx/=points.length;
cy/=points.length;

}

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute(
"x1",cx-300
);

line.setAttribute(
"y1",cy
);

line.setAttribute(
"x2",cx+300
);

line.setAttribute(
"y2",cy
);

line.setAttribute(
"class","beam-line"
);

group.appendChild(line);

const text=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

text.setAttribute(
"x",cx
);

text.setAttribute(
"y",cy-50-index*60
);

text.setAttribute(
"class","beam-text"
);

text.textContent=
`樑 H${beam.height} × D${beam.depth} mm`;

group.appendChild(text);

});

}


/* =========================
Render
========================= */

function render(){

const group=
document.getElementById(
"drawingGroup"
);

group.innerHTML="";

drawWalls(group);

windows.forEach(function(w){
drawWindow(group,w);
});

doors.forEach(function(d){
drawDoor(group,d);
});

drawBeams(group);

drawFloorHeight(group);


/* 端點 */

points.forEach(function(p){

const circle=
document.createElementNS(
"http://www.w3.org/2000/svg",
"circle"
);

circle.setAttribute(
"cx",p.x
);

circle.setAttribute(
"cy",p.y
);

circle.setAttribute(
"r",12
);

circle.setAttribute(
"class","point"
);

group.appendChild(circle);

});


/* 選中牆 */

if(selectedWallIndex!==null){

const wall=
walls[selectedWallIndex];

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute(
"x1",wall.start.x
);

line.setAttribute(
"y1",wall.start.y
);

line.setAttribute(
"x2",wall.end.x
);

line.setAttribute(
"y2",wall.end.y
);

line.setAttribute(
"stroke","#8e44ad"
);

line.setAttribute(
"stroke-width",18
);

line.setAttribute(
"opacity",".3"
);

group.insertBefore(
line,
group.firstChild
);

}

}


/* =========================
自動縮放
========================= */

function fitView(){

if(
walls.length===0 &&
points.length<=1 &&
!floorHeight &&
beams.length===0
)
return;

let minX=Infinity;
let maxX=-Infinity;
let minY=Infinity;
let maxY=-Infinity;

function include(x,y){

minX=Math.min(minX,x);
maxX=Math.max(maxX,x);
minY=Math.min(minY,y);
maxY=Math.max(maxY,y);

}

points.forEach(function(p){
include(p.x,p.y);
});

walls.forEach(function(w){

include(
w.start.x-400,
w.start.y-400
);

include(
w.end.x+400,
w.end.y+400
);

});

if(!isFinite(minX))
return;

const padding=350;

minX-=padding;
maxX+=padding;
minY-=padding;
maxY+=padding;

let width=maxX-minX;
let height=maxY-minY;

const minSize=1500;

if(width<minSize){

const extra=(minSize-width)/2;

minX-=extra;
maxX+=extra;

width=minSize;

}

if(height<minSize){

const extra=(minSize-height)/2;

minY-=extra;
maxY+=extra;

height=minSize;

}

document
.getElementById("drawing")
.setAttribute(
"viewBox",
`${minX} ${minY} ${width} ${height}`
);

}


/* =========================
圖面點擊
========================= */

document
.getElementById("drawing")
.addEventListener(
"pointerdown",
function(evt){

if(
currentTool==="window" ||
currentTool==="door"
){

selectWallByTap(evt);

}

}
);


/* =========================
初始化
========================= */

updateCaseName();

render();

</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>房屋丈量畫圖工具</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#222;
  color:#fff;
  padding:14px 16px;
  font-size:20px;
  font-weight:700;
  text-align:center;
}

.topbar{
  background:#fff;
  padding:10px;
  border-bottom:1px solid #ddd;
  display:flex;
  gap:8px;
  align-items:center;
}

button{
  border:0;
  border-radius:9px;
  background:#222;
  color:white;
  padding:10px 13px;
  font-size:15px;
  font-weight:600;
}

button:active{
  transform:scale(.97);
}

.case-name{
  flex:1;
  min-width:0;
  font-size:14px;
  font-weight:600;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.control{
  background:#fff;
  margin:10px;
  padding:12px;
  border-radius:12px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:10px;
}

.row:last-child{
  margin-bottom:0;
}

input{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:18px;
}

.direction{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  max-width:260px;
  margin:auto;
}

.direction button{
  height:45px;
  font-size:20px;
}

.direction .active{
  background:#666;
}

.tool-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.tool-buttons button{
  background:#555;
}

.tool-buttons .active{
  background:#111;
}

#drawing{
  width:calc(100% - 20px);
  height:55vh;
  margin:10px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 1px 5px rgba(0,0,0,.1);
  touch-action:none;
}

.legend{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  font-size:13px;
  padding:4px 2px 0;
}

.legend span{
  display:flex;
  align-items:center;
  gap:5px;
}

.wall-icon{
  width:28px;
  height:5px;
  background:#111;
  display:inline-block;
}

.window-icon{
  width:28px;
  height:8px;
  border-top:2px solid #1976d2;
  border-bottom:2px solid #1976d2;
  display:inline-block;
}

.dim-icon{
  width:28px;
  border-top:1px solid #777;
  display:inline-block;
}

.panel-title{
  font-weight:700;
  margin-bottom:9px;
}

.case-list{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:20;
  display:none;
}

.case-box{
  position:absolute;
  left:10px;
  right:10px;
  top:80px;
  background:white;
  border-radius:14px;
  padding:15px;
  max-height:70vh;
  overflow:auto;
}

.case-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.case-item-name{
  flex:1;
  font-weight:600;
}

.case-item button{
  padding:8px 10px;
  font-size:13px;
}

.empty{
  text-align:center;
  color:#888;
  padding:25px 0;
}
</style>
</head>

<body>

<header>房屋丈量畫圖工具</header>

<div class="topbar">
  <button onclick="newCase()">📁 新增案件</button>
  <button onclick="openCases()">📂 案件</button>
  <div class="case-name" id="caseName">尚未建立案件</div>
</div>

<div class="control">

  <div class="panel-title">繪圖項目</div>

  <div class="tool-buttons">
    <button id="wallTool" class="active" onclick="setTool('wall')">🧱 牆線</button>
    <button id="windowTool" onclick="setTool('window')">🪟 窗戶</button>
    <button id="dimensionTool" onclick="setTool('dimension')">📏 尺寸</button>
  </div>

</div>

<div class="control">

  <div class="panel-title">牆線操作</div>

  <div class="row">
    <input
      id="length"
      type="number"
      inputmode="numeric"
      placeholder="輸入長度 mm"
    >
    <button onclick="addWall()">＋新增線段</button>
  </div>

  <div class="direction">
    <div></div>
    <button id="up" onclick="setDirection('up')">↑</button>
    <div></div>

    <button id="left" onclick="setDirection('left')">←</button>
    <button onclick="setDirection('down')">↓</button>
    <button id="right" onclick="setDirection('right')">→</button>
  </div>

</div>

<div class="control">

  <div class="panel-title">窗戶</div>

  <div class="row">
    <input
      id="windowLength"
      type="number"
      inputmode="numeric"
      placeholder="窗戶寬度 mm"
    >
    <button onclick="addWindow()">＋新增窗戶</button>
  </div>

  <div style="font-size:13px;color:#777;">
    窗戶會以獨立線段顯示，不會跟牆線混在一起。
  </div>

</div>

<div class="control">

  <div class="panel-title">操作</div>

  <div class="row">
    <button onclick="undo()">↩ 復原</button>
    <button onclick="clearDrawing()">🗑 清除圖面</button>
    <button onclick="fitView()">⛶ 自動縮放</button>
  </div>

  <div class="legend">
    <span><i class="wall-icon"></i>牆線</span>
    <span><i class="window-icon"></i>窗戶</span>
    <span><i class="dim-icon"></i>尺寸</span>
  </div>

</div>

<svg id="drawing"></svg>

<div class="case-list" id="caseList">
  <div class="case-box">
    <div class="row">
      <strong style="font-size:18px;flex:1;">案件列表</strong>
      <button onclick="closeCases()">關閉</button>
    </div>

    <div id="cases"></div>
  </div>
</div>

<script>

let points = [{x:0,y:0}];
let walls = [];
let windows = [];

let currentDirection = "right";
let currentTool = "wall";

let currentCaseId = null;
let currentCaseName = "";

const STORAGE_KEY = "measureCases";

const svg = document.getElementById("drawing");


// =========================
// 案件
// =========================

function newCase(){

  const name = prompt("請輸入案件名稱");

  if(!name) return;

  currentCaseId = Date.now().toString();
  currentCaseName = name;

  points = [{x:0,y:0}];
  walls = [];
  windows = [];

  document.getElementById("caseName").textContent = name;

  saveCase();
  render();
}


function saveCase(){

  if(!currentCaseId) return;

  const cases = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  cases[currentCaseId] = {
    id:currentCaseId,
    name:currentCaseName,
    points:points,
    walls:walls,
    windows:windows,
    updatedAt:Date.now()
  };

  localStorage.setItem(STORAGE_KEY,JSON.stringify(cases));
}


function openCases(){

  const cases = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  const box = document.getElementById("cases");

  box.innerHTML = "";

  const list = Object.values(cases)
    .sort((a,b)=>b.updatedAt-a.updatedAt);

  if(list.length===0){

    box.innerHTML = `<div class="empty">目前沒有儲存案件</div>`;

  }else{

    list.forEach(item=>{

      const div = document.createElement("div");

      div.className = "case-item";

      div.innerHTML = `
        <div class="case-item-name">${escapeHtml(item.name)}</div>
        <button onclick="loadCase('${item.id}')">開啟</button>
        <button onclick="deleteCase('${item.id}')">刪除</button>
      `;

      box.appendChild(div);

    });

  }

  document.getElementById("caseList").style.display = "block";
}


function closeCases(){
  document.getElementById("caseList").style.display = "none";
}


function loadCase(id){

  const cases = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  const item = cases[id];

  if(!item) return;

  currentCaseId = item.id;
  currentCaseName = item.name;

  points = item.points || [{x:0,y:0}];
  walls = item.walls || [];
  windows = item.windows || [];

  document.getElementById("caseName").textContent = currentCaseName;

  closeCases();

  render();
  fitView();
}


function deleteCase(id){

  if(!confirm("確定要刪除這個案件嗎？")) return;

  const cases = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  delete cases[id];

  localStorage.setItem(STORAGE_KEY,JSON.stringify(cases));

  if(id===currentCaseId){

    currentCaseId = null;
    currentCaseName = "";

    points = [{x:0,y:0}];
    walls = [];
    windows = [];

    document.getElementById("caseName").textContent = "尚未建立案件";

    render();
  }

  openCases();
}


function escapeHtml(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


// =========================
// 工具
// =========================

function setTool(tool){

  currentTool = tool;

  document.getElementById("wallTool").classList.remove("active");
  document.getElementById("windowTool").classList.remove("active");
  document.getElementById("dimensionTool").classList.remove("active");

  if(tool==="wall"){
    document.getElementById("wallTool").classList.add("active");
  }

  if(tool==="window"){
    document.getElementById("windowTool").classList.add("active");
  }

  if(tool==="dimension"){
    document.getElementById("dimensionTool").classList.add("active");
  }
}


function setDirection(dir){

  currentDirection = dir;

  document.querySelectorAll(".direction button")
    .forEach(btn=>btn.classList.remove("active"));

  const btn = document.getElementById(dir);

  if(btn) btn.classList.add("active");
}


// =========================
// 新增牆線
// =========================

function addWall(){

  const length = Number(document.getElementById("length").value);

  if(!length || length<=0){

    alert("請輸入有效長度");

    return;
  }

  const start = points[points.length-1];

  let end = {
    x:start.x,
    y:start.y
  };

  if(currentDirection==="right"){
    end.x += length;
  }

  if(currentDirection==="left"){
    end.x -= length;
  }

  if(currentDirection==="up"){
    end.y -= length;
  }

  if(currentDirection==="down"){
    end.y += length;
  }

  const wall = {
    id:Date.now(),
    start:{...start},
    end:{...end},
    length:length,
    direction:currentDirection
  };

  walls.push(wall);

  points.push(end);

  saveCase();
  render();

  /*
    重要：
    這裡故意不清空 length。
    所以你可以連續輸入、連續新增，
    不會每次新增線段就把數字區關掉。
  */

  document.getElementById("length").focus();
}


// =========================
// 新增窗戶
// =========================

function addWindow(){

  const length = Number(
    document.getElementById("windowLength").value
  );

  if(!length || length<=0){

    alert("請輸入窗戶寬度");

    return;
  }

  /*
    第一版窗戶：
    先從目前牆線最後一個端點開始，
    使用目前方向畫出獨立窗戶線段。
  */

  const start = points[points.length-1];

  let end = {
    x:start.x,
    y:start.y
  };

  if(currentDirection==="right"){
    end.x += length;
  }

  if(currentDirection==="left"){
    end.x -= length;
  }

  if(currentDirection==="up"){
    end.y -= length;
  }

  if(currentDirection==="down"){
    end.y += length;
  }

  windows.push({
    id:Date.now(),
    start:{...start},
    end:{...end},
    length:length,
    direction:currentDirection
  });

  saveCase();
  render();

  document.getElementById("windowLength").focus();
}


// =========================
// 復原
// =========================

function undo(){

  if(windows.length>0){

    windows.pop();

  }else if(walls.length>0){

    walls.pop();

    if(points.length>1){
      points.pop();
    }

  }else{

    return;
  }

  saveCase();
  render();
}


// =========================
// 清除
// =========================

function clearDrawing(){

  if(!confirm("確定要清除目前圖面嗎？")) return;

  points = [{x:0,y:0}];
  walls = [];
  windows = [];

  saveCase();
  render();
}


// =========================
// SVG 工具
// =========================

function createSvgElement(tag,attrs){

  const el = document.createElementNS(
    "http://www.w3.org/2000/svg",
    tag
  );

  Object.entries(attrs).forEach(([key,value])=>{
    el.setAttribute(key,value);
  });

  return el;
}


// =========================
// 畫面
// =========================

function render(){

  svg.innerHTML = "";

  /*
    牆線
  */

  walls.forEach(w=>{

    const line = createSvgElement("line",{
      x1:w.start.x,
      y1:w.start.y,
      x2:w.end.x,
      y2:w.end.y,
      stroke:"#111",
      "stroke-width":"8",
      "stroke-linecap":"round"
    });

    svg.appendChild(line);

    drawDimension(w);
  });


  /*
    窗戶
    使用兩條細線＋中間空間，
    與牆線明顯區隔。
  */

  windows.forEach(w=>{

    drawWindow(w);

  });


  /*
    所有牆端點
  */

  points.forEach(p=>{

    const circle = createSvgElement("circle",{
      cx:p.x,
      cy:p.y,
      r:"9",
      fill:"#111"
    });

    svg.appendChild(circle);

  });

  fitView();
}


// =========================
// 尺寸線
// =========================

function drawDimension(w){

  const x1 = w.start.x;
  const y1 = w.start.y;
  const x2 = w.end.x;
  const y2 = w.end.y;

  const offset = 90;

  let dx = x2-x1;
  let dy = y2-y1;

  const length = Math.sqrt(dx*dx+dy*dy);

  if(length===0) return;

  const nx = -dy/length;
  const ny = dx/length;

  const ax = x1 + nx*offset;
  const ay = y1 + ny*offset;

  const bx = x2 + nx*offset;
  const by = y2 + ny*offset;


  /*
    延伸線
  */

  const ext1 = createSvgElement("line",{
    x1:x1,
    y1:y1,
    x2:ax,
    y2:ay,
    stroke:"#777",
    "stroke-width":"2"
  });

  const ext2 = createSvgElement("line",{
    x1:x2,
    y1:y2,
    x2:bx,
    y2:by,
    stroke:"#777",
    "stroke-width":"2"
  });

  svg.appendChild(ext1);
  svg.appendChild(ext2);


  /*
    尺寸線
  */

  const dim = createSvgElement("line",{
    x1:ax,
    y1:ay,
    x2:bx,
    y2:by,
    stroke:"#777",
    "stroke-width":"2"
  });

  svg.appendChild(dim);


  /*
    兩端箭頭
  */

  drawArrow(ax,ay,dx,dy);
  drawArrow(bx,by,-dx,-dy);


  /*
    尺寸文字
  */

  const tx = (ax+bx)/2;
  const ty = (ay+by)/2;

  let text = createSvgElement("text",{
    x:tx,
    y:ty-10,
    "text-anchor":"middle",
    "font-size":"42",
    "font-weight":"600",
    fill:"#555"
  });

  /*
    垂直尺寸文字旋轉
  */

  if(Math.abs(dy)>Math.abs(dx)){

    text.setAttribute(
      "transform",
      `rotate(-90 ${tx} ${ty-10})`
    );

  }

  text.textContent = `${w.length} mm`;

  svg.appendChild(text);
}


function drawArrow(x,y,dx,dy){

  const len = Math.sqrt(dx*dx+dy*dy);

  if(len===0) return;

  const ux = dx/len;
  const uy = dy/len;

  const size = 18;

  const px = -uy;
  const py = ux;

  const p1 = `${x},${y}`;
  const p2 = `${x+ux*size+px*size/2},${y+uy*size+py*size/2}`;
  const p3 = `${x+ux*size-px*size/2},${y+uy*size-py*size/2}`;

  const poly = createSvgElement("polygon",{
    points:`${p1} ${p2} ${p3}`,
    fill:"#777"
  });

  svg.appendChild(poly);
}


// =========================
// 窗戶符號
// =========================

function drawWindow(w){

  const x1 = w.start.x;
  const y1 = w.start.y;

  const x2 = w.end.x;
  const y2 = w.end.y;

  const dx = x2-x1;
  const dy = y2-y1;

  const len = Math.sqrt(dx*dx+dy*dy);

  if(len===0) return;

  const nx = -dy/len;
  const ny = dx/len;

  const gap = 22;

  /*
    兩條獨立的窗戶線
  */

  const line1 = createSvgElement("line",{
    x1:x1+nx*gap,
    y1:y1+ny*gap,
    x2:x2+nx*gap,
    y2:y2+ny*gap,
    stroke:"#1976d2",
    "stroke-width":"5",
    "stroke-linecap":"round"
  });

  const line2 = createSvgElement("line",{
    x1:x1-nx*gap,
    y1:y1-ny*gap,
    x2:x2-nx*gap,
    y2:y2-ny*gap,
    stroke:"#1976d2",
    "stroke-width":"5",
    "stroke-linecap":"round"
  });

  svg.appendChild(line1);
  svg.appendChild(line2);


  /*
    窗戶尺寸
  */

  const tx = (x1+x2)/2;
  const ty = (y1+y2)/2;

  const text = createSvgElement("text",{
    x:tx,
    y:ty-35,
    "text-anchor":"middle",
    "font-size":"36",
    "font-weight":"600",
    fill:"#1976d2"
  });

  text.textContent = `${w.length} mm`;

  if(Math.abs(dy)>Math.abs(dx)){

    text.setAttribute(
      "transform",
      `rotate(-90 ${tx} ${ty-35})`
    );

  }

  svg.appendChild(text);
}


// =========================
// 自動縮放
// =========================

function fitView(){

  const all = [];

  walls.forEach(w=>{
    all.push(w.start,w.end);
  });

  windows.forEach(w=>{
    all.push(w.start,w.end);
  });

  if(all.length===0){

    svg.setAttribute(
      "viewBox",
      "-500 -500 1000 1000"
    );

    return;
  }

  let minX = Infinity;
  let maxX = -Infinity;
  let minY = Infinity;
  let maxY = -Infinity;

  all.forEach(p=>{

    minX = Math.min(minX,p.x);
    maxX = Math.max(maxX,p.x);

    minY = Math.min(minY,p.y);
    maxY = Math.max(maxY,p.y);

  });

  const padding = 300;

  minX -= padding;
  maxX += padding;
  minY -= padding;
  maxY += padding;

  let width = maxX-minX;
  let height = maxY-minY;

  /*
    避免只有一條水平／垂直線時畫面太扁
  */

  if(width<1000) width=1000;
  if(height<700) height=700;

  svg.setAttribute(
    "viewBox",
    `${minX} ${minY} ${width} ${height}`
  );
}


// =========================
// 啟動
// =========================

render();

</script>

</body>
</html>

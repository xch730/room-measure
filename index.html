<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>房屋丈量畫圖工具</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",
              "Noto Sans TC",Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#222;
  color:white;
  padding:14px 12px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.header-title{
  font-size:18px;
  font-weight:700;
}

.case-name{
  font-size:13px;
  opacity:.8;
  margin-top:4px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-size:15px;
  background:white;
  color:#222;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
  touch-action:manipulation;
}

button:active{
  transform:scale(.97);
}

.container{
  padding:12px;
  max-width:900px;
  margin:auto;
}

.panel{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.panel-title{
  font-weight:700;
  margin-bottom:10px;
}

.tool-row{
  display:flex;
  gap:8px;
}

.tool-row button{
  flex:1;
}

.tool-active{
  background:#222;
  color:white;
}

input,
select{
  width:100%;
  height:46px;
  border:1px solid #ccc;
  border-radius:10px;
  padding:0 12px;
  font-size:18px;
  background:white;
}

.input-row{
  display:flex;
  gap:8px;
}

.input-row input{
  flex:1;
}

.input-row button{
  white-space:nowrap;
}

.direction-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.direction-grid button{
  height:46px;
  font-size:20px;
}

.direction-empty{
  visibility:hidden;
}

.direction-active{
  background:#222;
  color:white;
}

.wall-panel{
  display:block;
}

.placement-panel{
  display:none;
}

.info{
  background:#f1f1f1;
  border-radius:10px;
  padding:10px;
  font-size:14px;
  line-height:1.6;
  margin-bottom:10px;
}

.selected-info{
  background:#eee7ff;
  color:#5d35a8;
}

.primary{
  background:#222;
  color:white;
}

.window-btn{
  background:#1976d2;
  color:white;
}

.door-btn{
  background:#e67e22;
  color:white;
}

.danger{
  background:#d32f2f;
  color:white;
}

.secondary{
  background:#e9e9e9;
}

.action-row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.action-row button{
  flex:1;
}

#drawingWrap{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

svg{
  width:100%;
  height:65vh;
  min-height:420px;
  display:block;
  background:#fafafa;
  touch-action:none;
}

.wall{
  stroke:#111;
  stroke-width:8;
  stroke-linecap:round;
}

.wall-hit{
  stroke:transparent;
  stroke-width:35;
  pointer-events:stroke;
}

.window-line{
  stroke:#1976d2;
  stroke-width:5;
}

.door-line{
  stroke:#e67e22;
  stroke-width:6;
}

.door-leaf{
  stroke:#e67e22;
  stroke-width:4;
}

.door-arc{
  stroke:#e67e22;
  stroke-width:3;
  stroke-dasharray:8 6;
  fill:none;
}

.dimension{
  stroke:#555;
  stroke-width:2;
}

.dimension-text{
  fill:#333;
  font-size:42px;
  font-weight:600;
  text-anchor:middle;
  dominant-baseline:middle;
}

.window-text{
  fill:#1976d2;
  font-size:34px;
  font-weight:600;
  text-anchor:middle;
  dominant-baseline:middle;
}

.offset-text{
  fill:#6a35a8;
  font-size:30px;
  font-weight:600;
  text-anchor:middle;
  dominant-baseline:middle;
}

.door-text{
  fill:#e67e22;
  font-size:34px;
  font-weight:600;
  text-anchor:middle;
  dominant-baseline:middle;
}

.point{
  fill:#111;
}

.legend{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  font-size:13px;
  padding:10px 4px 0;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
}

.legend-line{
  width:25px;
  height:4px;
}

.black{
  background:#111;
}

.blue{
  background:#1976d2;
}

.orange{
  background:#e67e22;
}

.purple{
  background:#6a35a8;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:50;
  display:none;
  align-items:flex-end;
}

.sheet{
  background:white;
  width:100%;
  max-height:80vh;
  overflow:auto;
  border-radius:20px 20px 0 0;
  padding:18px;
}

.sheet-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:12px;
}

.case-item{
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  margin-bottom:8px;
}

.case-item-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.case-item-name{
  font-weight:700;
}

.case-item-time{
  color:#777;
  font-size:12px;
  margin-top:4px;
}

.small-btn{
  padding:8px 10px;
  font-size:13px;
}

.close-btn{
  width:100%;
  margin-top:8px;
}

.tip{
  color:#666;
  font-size:13px;
  line-height:1.5;
  margin-top:7px;
}

</style>
</head>

<body>

<header>

  <div class="header-row">

    <div>
      <div class="header-title">房屋丈量畫圖工具</div>
      <div class="case-name" id="currentCaseName">尚未建立案件</div>
    </div>

    <div style="display:flex;gap:6px;">
      <button onclick="newCase()">＋案件</button>
      <button onclick="openCases()">📁</button>
    </div>

  </div>

</header>


<div class="container">

  <!-- 工具 -->
  <div class="panel">

    <div class="panel-title">目前工具</div>

    <div class="tool-row">

      <button id="toolWall"
              class="tool-active"
              onclick="selectTool('wall')">
        🧱 牆線
      </button>

      <button id="toolWindow"
              onclick="selectTool('window')">
        🪟 窗戶
      </button>

      <button id="toolDoor"
              onclick="selectTool('door')">
        🚪 門
      </button>

    </div>

  </div>


  <!-- 畫牆 -->
  <div class="panel wall-panel" id="wallPanel">

    <div class="panel-title">畫牆面</div>

    <input
      id="wallLength"
      type="number"
      inputmode="numeric"
      placeholder="輸入牆長，例如 3000"
      autocomplete="off"
    >

    <div class="direction-grid">

      <button class="direction-empty">　</button>

      <button id="upBtn"
              onclick="setDirection('up')">
        ↑
      </button>

      <button class="direction-empty">　</button>

      <button id="leftBtn"
              onclick="setDirection('left')">
        ←
      </button>

      <button id="downBtn"
              onclick="setDirection('down')">
        ↓
      </button>

      <button id="rightBtn"
              class="direction-active"
              onclick="setDirection('right')">
        →
      </button>

    </div>

    <button
      class="primary"
      style="width:100%;margin-top:10px;"
      onclick="addWall()">
      ＋新增牆面
    </button>

    <div class="tip">
      輸入牆長 → 選擇方向 → 新增牆面。<br>
      可以連續輸入，不需要一直重新點輸入框。
    </div>

  </div>


  <!-- 門窗 -->
  <div class="panel placement-panel" id="placementPanel">

    <div class="panel-title" id="placementTitle">
      放置門窗
    </div>

    <div class="info" id="selectedWallInfo">
      請先在下方圖面上點擊要放置門窗的牆面。
    </div>

    <div id="openingForm" style="display:none;">

      <div style="margin-bottom:8px;">
        <label>寬度 mm</label>
        <input
          id="openingWidth"
          type="number"
          inputmode="numeric"
          placeholder="例如 900"
        >
      </div>

      <div style="margin-bottom:8px;">
        <label>高度 mm</label>
        <input
          id="openingHeight"
          type="number"
          inputmode="numeric"
          placeholder="例如 2100"
        >
      </div>

      <div style="margin-bottom:8px;">
        <label>離地高度 / 窗台高度 mm</label>
        <input
          id="openingSill"
          type="number"
          inputmode="numeric"
          value="0"
        >
      </div>

      <div style="margin-bottom:8px;">
        <label>距離牆端 mm</label>
        <input
          id="openingOffset"
          type="number"
          inputmode="numeric"
          placeholder="例如 500"
        >
      </div>

      <div id="doorSwingBox" style="display:none;margin-bottom:8px;">

        <label>開門方向</label>

        <select id="doorSwing">
          <option value="left">左開</option>
          <option value="right">右開</option>
        </select>

      </div>

      <button
        id="addOpeningBtn"
        class="primary"
        style="width:100%;"
        onclick="addOpening()">
        新增
      </button>

      <button
        class="secondary"
        style="width:100%;margin-top:8px;"
        onclick="cancelWallSelection()">
        取消選擇
      </button>

    </div>

  </div>


  <!-- 操作 -->
  <div class="panel">

    <div class="action-row">

      <button onclick="undo()">
        ↩ 復原
      </button>

      <button onclick="fitView()">
        🔍 自動縮放
      </button>

      <button class="danger"
              onclick="clearAll()">
        🗑 清除
      </button>

    </div>

  </div>


  <!-- 圖面 -->
  <div id="drawingWrap">

    <svg id="drawing"
         viewBox="-1000 -1000 2000 2000">

      <defs>

        <marker
          id="arrow"
          markerWidth="10"
          markerHeight="10"
          refX="5"
          refY="5"
          orient="auto"
          markerUnits="strokeWidth">

          <path
            d="M 0 0 L 10 5 L 0 10 z"
            fill="#555">
          </path>

        </marker>

      </defs>

      <g id="drawingGroup"></g>

    </svg>

  </div>


  <div class="legend">

    <div class="legend-item">
      <div class="legend-line black"></div>
      牆面
    </div>

    <div class="legend-item">
      <div class="legend-line blue"></div>
      窗戶
    </div>

    <div class="legend-item">
      <div class="legend-line orange"></div>
      門
    </div>

    <div class="legend-item">
      <div class="legend-line purple"></div>
      定位尺寸
    </div>

  </div>

</div>


<!-- 案件視窗 -->

<div class="overlay" id="caseOverlay">

  <div class="sheet">

    <div class="sheet-title">
      已儲存案件
    </div>

    <div id="caseList"></div>

    <button
      class="secondary close-btn"
      onclick="closeCases()">
      關閉
    </button>

  </div>

</div>


<script>

/* =========================
   基本資料
========================= */

let points = [{x:0,y:0}];

let walls = [];

let windows = [];

let doors = [];

let currentDirection = "right";

let currentTool = "wall";

let selectedWallIndex = null;

let selectedTapDistance = 0;

let currentCaseId = null;

let currentCaseName = "";

let history = [];


/* =========================
   工具切換
========================= */

function selectTool(tool){

  currentTool = tool;

  document.getElementById("toolWall")
    .classList.toggle("tool-active",tool === "wall");

  document.getElementById("toolWindow")
    .classList.toggle("tool-active",tool === "window");

  document.getElementById("toolDoor")
    .classList.toggle("tool-active",tool === "door");


  const wallPanel =
    document.getElementById("wallPanel");

  const placementPanel =
    document.getElementById("placementPanel");


  if(tool === "wall"){

    wallPanel.style.display = "block";
    placementPanel.style.display = "none";

  }else{

    wallPanel.style.display = "none";
    placementPanel.style.display = "block";

    if(tool === "window"){

      document.getElementById("placementTitle")
        .textContent = "🪟 放置窗戶";

      document.getElementById("addOpeningBtn")
        .textContent = "＋新增窗戶";

      document.getElementById("addOpeningBtn")
        .className = "window-btn";

      document.getElementById("doorSwingBox")
        .style.display = "none";

    }else{

      document.getElementById("placementTitle")
        .textContent = "🚪 放置門";

      document.getElementById("addOpeningBtn")
        .textContent = "＋新增門";

      document.getElementById("addOpeningBtn")
        .className = "door-btn";

      document.getElementById("doorSwingBox")
        .style.display = "block";

    }

    cancelWallSelection();

  }

}


/* =========================
   方向
========================= */

function setDirection(direction){

  currentDirection = direction;

  document.getElementById("upBtn")
    .classList.remove("direction-active");

  document.getElementById("downBtn")
    .classList.remove("direction-active");

  document.getElementById("leftBtn")
    .classList.remove("direction-active");

  document.getElementById("rightBtn")
    .classList.remove("direction-active");


  const map = {
    up:"upBtn",
    down:"downBtn",
    left:"leftBtn",
    right:"rightBtn"
  };

  document.getElementById(map[direction])
    .classList.add("direction-active");


  /*
    非常重要：

    iPhone Safari 點按鈕時 input 可能失去 focus，
    所以重新 focus 回牆長輸入框。
  */

  const input =
    document.getElementById("wallLength");

  setTimeout(function(){

    input.focus();

    /*
      讓游標保持在輸入框最後面
    */
    try{
      input.setSelectionRange(
        input.value.length,
        input.value.length
      );
    }catch(e){}

  },50);

}


/* =========================
   新增牆面
========================= */

function addWall(){

  const input =
    document.getElementById("wallLength");

  const length =
    Number(input.value);


  if(!length || length <= 0){

    input.focus();

    return;
  }


  const last =
    points[points.length - 1];


  let dx = 0;
  let dy = 0;


  if(currentDirection === "right")
    dx = length;

  if(currentDirection === "left")
    dx = -length;

  if(currentDirection === "down")
    dy = length;

  if(currentDirection === "up")
    dy = -length;


  const end = {

    x:last.x + dx,

    y:last.y + dy

  };


  saveHistory();


  walls.push({

    start:{...last},

    end:{...end},

    length:length

  });


  points.push(end);


  saveCase();

  render();


  /*
    重新 focus。

    這樣：
    1. 新增牆面
    2. 鍵盤保持開啟
    3. 可以直接輸入下一個尺寸
  */

  setTimeout(function(){

    input.focus();

    try{

      input.setSelectionRange(
        input.value.length,
        input.value.length
      );

    }catch(e){}

  },50);

}


/* =========================
   案件管理
========================= */

function newCase(){

  const name =
    prompt("請輸入案件名稱");

  if(!name)
    return;


  currentCaseId =
    Date.now().toString();

  currentCaseName =
    name;


  points = [{x:0,y:0}];

  walls = [];

  windows = [];

  doors = [];

  history = [];

  selectedWallIndex = null;

  selectedTapDistance = 0;


  updateCaseName();

  saveCase();

  render();

}


function updateCaseName(){

  document.getElementById("currentCaseName")
    .textContent =
      currentCaseName
      ? currentCaseName
      : "尚未建立案件";

}


function saveCase(){

  if(!currentCaseId)
    return;


  const data =
    JSON.parse(
      localStorage.getItem("measureCases") || "[]"
    );


  const item = {

    id:currentCaseId,

    name:currentCaseName,

    points:points,

    walls:walls,

    windows:windows,

    doors:doors,

    updatedAt:Date.now()

  };


  const index =
    data.findIndex(
      x => x.id === currentCaseId
    );


  if(index >= 0){

    data[index] = item;

  }else{

    data.push(item);

  }


  localStorage.setItem(
    "measureCases",
    JSON.stringify(data)
  );

}


function openCases(){

  const overlay =
    document.getElementById("caseOverlay");

  const list =
    document.getElementById("caseList");


  const data =
    JSON.parse(
      localStorage.getItem("measureCases") || "[]"
    );


  list.innerHTML = "";


  if(data.length === 0){

    list.innerHTML =
      `<div class="info">
        目前沒有儲存的案件
       </div>`;

  }else{

    data
      .sort((a,b)=>b.updatedAt-a.updatedAt)
      .forEach(item => {

        const div =
          document.createElement("div");

        div.className =
          "case-item";


        const date =
          new Date(item.updatedAt)
            .toLocaleString();


        div.innerHTML = `

          <div class="case-item-row">

            <div>

              <div class="case-item-name">
                ${escapeHtml(item.name)}
              </div>

              <div class="case-item-time">
                ${date}
              </div>

            </div>

            <div style="display:flex;gap:6px;">

              <button
                class="small-btn"
                onclick="loadCase('${item.id}')">
                開啟
              </button>

              <button
                class="small-btn danger"
                onclick="deleteCase('${item.id}')">
                刪除
              </button>

            </div>

          </div>

        `;


        list.appendChild(div);

      });

  }


  overlay.style.display =
    "flex";

}


function closeCases(){

  document.getElementById("caseOverlay")
    .style.display = "none";

}


function loadCase(id){

  const data =
    JSON.parse(
      localStorage.getItem("measureCases") || "[]"
    );


  const item =
    data.find(x => x.id === id);


  if(!item)
    return;


  currentCaseId =
    item.id;

  currentCaseName =
    item.name;


  points =
    item.points || [{x:0,y:0}];

  walls =
    item.walls || [];

  windows =
    item.windows || [];

  doors =
    item.doors || [];


  history = [];

  selectedWallIndex = null;

  selectedTapDistance = 0;


  updateCaseName();

  closeCases();

  render();

}


function deleteCase(id){

  if(!confirm("確定要刪除這個案件嗎？"))
    return;


  let data =
    JSON.parse(
      localStorage.getItem("measureCases") || "[]"
    );


  data =
    data.filter(x => x.id !== id);


  localStorage.setItem(
    "measureCases",
    JSON.stringify(data)
  );


  openCases();

}


function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   復原
========================= */

function saveHistory(){

  history.push({

    points:
      JSON.parse(JSON.stringify(points)),

    walls:
      JSON.parse(JSON.stringify(walls)),

    windows:
      JSON.parse(JSON.stringify(windows)),

    doors:
      JSON.parse(JSON.stringify(doors))

  });

}


function undo(){

  if(history.length === 0)
    return;


  const state =
    history.pop();


  points =
    state.points;

  walls =
    state.walls;

  windows =
    state.windows;

  doors =
    state.doors;


  selectedWallIndex = null;

  saveCase();

  render();

}


/* =========================
   清除
========================= */

function clearAll(){

  if(!confirm("確定要清除目前圖面嗎？"))
    return;


  saveHistory();


  points = [{x:0,y:0}];

  walls = [];

  windows = [];

  doors = [];


  selectedWallIndex = null;

  selectedTapDistance = 0;


  saveCase();

  render();

}


/* =========================
   SVG 座標
========================= */

function screenToSvg(evt){

  const svg =
    document.getElementById("drawing");


  const point =
    svg.createSVGPoint();


  point.x =
    evt.clientX;

  point.y =
    evt.clientY;


  const matrix =
    svg.getScreenCTM();


  return point.matrixTransform(
    matrix.inverse()
  );

}


/* =========================
   點到線段距離
========================= */

function pointToSegment(
  px,
  py,
  x1,
  y1,
  x2,
  y2
){

  const dx =
    x2 - x1;

  const dy =
    y2 - y1;


  if(dx === 0 && dy === 0){

    return {

      distance:
        Math.hypot(
          px - x1,
          py - y1
        ),

      t:0

    };

  }


  const t =
    Math.max(
      0,
      Math.min(
        1,
        (
          (px - x1) * dx +
          (py - y1) * dy
        ) /
        (dx * dx + dy * dy)
      )
    );


  const x =
    x1 + t * dx;

  const y =
    y1 + t * dy;


  return {

    distance:
      Math.hypot(
        px - x,
        py - y
      ),

    t:t

  };

}


/* =========================
   選牆
========================= */

function selectWallByTap(evt){

  if(
    currentTool !== "window" &&
    currentTool !== "door"
  )
    return;


  if(walls.length === 0){

    alert("請先畫牆面。");

    return;

  }


  const p =
    screenToSvg(evt);


  let bestIndex = null;

  let bestDistance = Infinity;

  let bestT = 0;


  walls.forEach(function(wall,index){

    const result =
      pointToSegment(

        p.x,
        p.y,

        wall.start.x,
        wall.start.y,

        wall.end.x,
        wall.end.y

      );


    if(result.distance < bestDistance){

      bestDistance =
        result.distance;

      bestIndex =
        index;

      bestT =
        result.t;

    }

  });


  /*
    點擊距離牆面太遠就不選
  */

  if(bestDistance > 120){

    return;

  }


  selectedWallIndex =
    bestIndex;


  selectedTapDistance =
    Math.round(
      walls[bestIndex].length * bestT
    );


  document.getElementById("openingForm")
    .style.display = "block";


  document.getElementById("openingOffset")
    .value =
      selectedTapDistance;


  document.getElementById("selectedWallInfo")
    .className =
      "info selected-info";


  document.getElementById("selectedWallInfo")
    .textContent =
      `已選擇第 ${bestIndex + 1} 面牆｜牆長 ${walls[bestIndex].length} mm｜點擊位置約 ${selectedTapDistance} mm`;


  render();

}


/* =========================
   取消選牆
========================= */

function cancelWallSelection(){

  selectedWallIndex = null;

  selectedTapDistance = 0;


  document.getElementById("openingForm")
    .style.display = "none";


  const info =
    document.getElementById("selectedWallInfo");


  info.className = "info";


  info.textContent =
    "請先在下方圖面上點擊要放置門窗的牆面。";


  render();

}


/* =========================
   新增門窗
========================= */

function addOpening(){

  if(selectedWallIndex === null){

    alert("請先點擊要放置門窗的牆面。");

    return;

  }


  const width =
    Number(
      document.getElementById("openingWidth").value
    );


  const height =
    Number(
      document.getElementById("openingHeight").value
    );


  const sill =
    Number(
      document.getElementById("openingSill").value
    );


  const offset =
    Number(
      document.getElementById("openingOffset").value
    );


  if(!width || width <= 0){

    alert("請輸入門窗寬度。");

    return;

  }


  if(!height || height <= 0){

    alert("請輸入門窗高度。");

    return;

  }


  if(offset < 0){

    alert("距離牆端不能小於 0。");

    return;

  }


  const wall =
    walls[selectedWallIndex];


  if(offset + width > wall.length){

    alert(
      `門窗超出牆面長度。\n\n` +
      `牆長：${wall.length} mm\n` +
      `目前位置：${offset} mm\n` +
      `門窗寬度：${width} mm`
    );

    return;

  }


  /*
    檢查是否與其他門窗重疊
  */

  const existing = [

    ...windows.map(x => ({
      offset:x.offset,
      width:x.width
    })),

    ...doors.map(x => ({
      offset:x.offset,
      width:x.width
    }))

  ].filter(
    x => x.wallIndex === selectedWallIndex
  );


  const overlap =
    existing.some(function(x){

      return (
        offset < x.offset + x.width &&
        offset + width > x.offset
      );

    });


  if(overlap){

    alert("這個位置和原本的門窗重疊了。");

    return;

  }


  saveHistory();


  if(currentTool === "window"){

    windows.push({

      wallIndex:selectedWallIndex,

      offset:offset,

      width:width,

      height:height,

      sill:sill

    });

  }else{

    const swing =
      document.getElementById("doorSwing").value;


    doors.push({

      wallIndex:selectedWallIndex,

      offset:offset,

      width:width,

      height:height,

      sill:sill,

      swing:swing

    });

  }


  saveCase();

  cancelWallSelection();

  render();

}


/* =========================
   向量工具
========================= */

function wallGeometry(wall){

  const dx =
    wall.end.x - wall.start.x;

  const dy =
    wall.end.y - wall.start.y;


  const len =
    Math.hypot(dx,dy);


  const ux =
    dx / len;

  const uy =
    dy / len;


  /*
    法向量
  */

  const nx =
    -uy;

  const ny =
    ux;


  return {
    ux,
    uy,
    nx,
    ny,
    len
  };

}


function pointAlongWall(
  wall,
  distance
){

  const g =
    wallGeometry(wall);


  return {

    x:
      wall.start.x +
      g.ux * distance,

    y:
      wall.start.y +
      g.uy * distance

  };

}


/* =========================
   畫牆
========================= */

function drawWalls(group){

  walls.forEach(function(wall,index){

    const openings = [

      ...windows
        .filter(x => x.wallIndex === index)
        .map(x => ({
          ...x,
          type:"window"
        })),

      ...doors
        .filter(x => x.wallIndex === index)
        .map(x => ({
          ...x,
          type:"door"
        }))

    ];


    openings.sort(
      (a,b)=>a.offset-b.offset
    );


    let current = 0;


    openings.forEach(function(opening){

      /*
        先畫門窗前面的牆
      */

      if(opening.offset > current){

        drawWallSegment(

          group,
          wall,
          current,
          opening.offset

        );

      }


      current =
        opening.offset +
        opening.width;

    });


    /*
      最後一段牆
    */

    if(current < wall.length){

      drawWallSegment(

        group,
        wall,
        current,
        wall.length

      );

    }


    /*
      選取區域

      讓使用者更容易點到牆
    */

    const hit =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );


    hit.setAttribute(
      "x1",
      wall.start.x
    );

    hit.setAttribute(
      "y1",
      wall.start.y
    );

    hit.setAttribute(
      "x2",
      wall.end.x
    );

    hit.setAttribute(
      "y2",
      wall.end.y
    );

    hit.setAttribute(
      "class",
      "wall-hit"
    );


    group.appendChild(hit);


    /*
      牆面總尺寸
    */

    drawDimension(

      group,

      wall.start,
      wall.end,

      wall.length,

      100

    );

  });

}


/* =========================
   畫牆段
========================= */

function drawWallSegment(
  group,
  wall,
  startDistance,
  endDistance
){

  const start =
    pointAlongWall(
      wall,
      startDistance
    );


  const end =
    pointAlongWall(
      wall,
      endDistance
    );


  const line =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );


  line.setAttribute(
    "x1",
    start.x
  );

  line.setAttribute(
    "y1",
    start.y
  );

  line.setAttribute(
    "x2",
    end.x
  );

  line.setAttribute(
    "y2",
    end.y
  );

  line.setAttribute(
    "class",
    "wall"
  );


  group.appendChild(line);

}


/* =========================
   一般尺寸
========================= */

function drawDimension(
  group,
  start,
  end,
  value,
  offset
){

  const dx =
    end.x - start.x;

  const dy =
    end.y - start.y;


  const len =
    Math.hypot(dx,dy);


  if(len === 0)
    return;


  const ux =
    dx / len;

  const uy =
    dy / len;


  const nx =
    -uy;

  const ny =
    ux;


  const s = {

    x:
      start.x +
      nx * offset,

    y:
      start.y +
      ny * offset

  };


  const e = {

    x:
      end.x +
      nx * offset,

    y:
      end.y +
      ny * offset

  };


  const line =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );


  line.setAttribute(
    "x1",
    s.x
  );

  line.setAttribute(
    "y1",
    s.y
  );

  line.setAttribute(
    "x2",
    e.x
  );

  line.setAttribute(
    "y2",
    e.y
  );

  line.setAttribute(
    "class",
    "dimension"
  );

  line.setAttribute(
    "marker-start",
    "url(#arrow)"
  );

  line.setAttribute(
    "marker-end",
    "url(#arrow)"
  );


  group.appendChild(line);


  /*
    延伸線
  */

  [start,end].forEach(function(p){

    const q = {

      x:
        p.x +
        nx * offset,

      y:
        p.y +
        ny * offset

    };


    const ext =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );


    ext.setAttribute(
      "x1",
      p.x
    );

    ext.setAttribute(
      "y1",
      p.y
    );

    ext.setAttribute(
      "x2",
      q.x
    );

    ext.setAttribute(
      "y2",
      q.y
    );

    ext.setAttribute(
      "class",
      "dimension"
    );


    group.appendChild(ext);

  });


  const text =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );


  text.setAttribute(
    "x",
    (s.x + e.x) / 2
  );

  text.setAttribute(
    "y",
    (s.y + e.y) / 2
  );

  text.setAttribute(
    "class",
    "dimension-text"
  );


  text.textContent =
    `${value} mm`;


  group.appendChild(text);

}


/* =========================
   定位尺寸
========================= */

function drawOffsetDimension(
  group,
  wall,
  offset,
  width
){

  const start =
    pointAlongWall(
      wall,
      0
    );


  const end =
    pointAlongWall(
      wall,
      offset
    );


  const g =
    wallGeometry(wall);


  const dimensionOffset =
    -130;


  const s = {

    x:
      start.x +
      g.nx * dimensionOffset,

    y:
      start.y +
      g.ny * dimensionOffset

  };


  const e = {

    x:
      end.x +
      g.nx * dimensionOffset,

    y:
      end.y +
      g.ny * dimensionOffset

  };


  const line =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );


  line.setAttribute(
    "x1",
    s.x
  );

  line.setAttribute(
    "y1",
    s.y
  );

  line.setAttribute(
    "x2",
    e.x
  );

  line.setAttribute(
    "y2",
    e.y
  );

  line.setAttribute(
    "class",
    "dimension"
  );


  group.appendChild(line);


  const text =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );


  text.setAttribute(
    "x",
    (s.x + e.x) / 2
  );

  text.setAttribute(
    "y",
    (s.y + e.y) / 2 - 25
  );

  text.setAttribute(
    "class",
    "offset-text"
  );


  text.textContent =
    `${offset} mm`;


  group.appendChild(text);

}


/* =========================
   畫窗戶
========================= */

function drawWindow(
  group,
  w
){

  const wall =
    walls[w.wallIndex];


  if(!wall)
    return;


  const g =
    wallGeometry(wall);


  const start =
    pointAlongWall(
      wall,
      w.offset
    );


  const end =
    pointAlongWall(
      wall,
      w.offset + w.width
    );


  const distance =
    28;


  /*
    兩條藍線

    窗戶獨立於牆面
  */

  [-distance,distance]
    .forEach(function(offset){

      const line =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );


      line.setAttribute(
        "x1",
        start.x + g.nx * offset
      );

      line.setAttribute(
        "y1",
        start.y + g.ny * offset
      );

      line.setAttribute(
        "x2",
        end.x + g.nx * offset
      );

      line.setAttribute(
        "y2",
        end.y + g.ny * offset
      );


      line.setAttribute(
        "class",
        "window-line"
      );


      group.appendChild(line);

    });


  /*
    窗戶寬度
  */

  drawColoredDimension(

    group,

    start,
    end,

    `${w.width} × ${w.height}`,

    170,

    "window-text"

  );


  /*
    距離牆端
  */

  drawOffsetDimension(
    group,
    wall,
    w.offset,
    w.width
  );


  /*
    窗台高度
  */

  drawHeightText(

    group,

    start,
    end,

    `窗台離地 ${w.sill} mm`

  );

}


/* =========================
   畫門
========================= */

function drawDoor(
  group,
  d
){

  const wall =
    walls[d.wallIndex];


  if(!wall)
    return;


  const g =
    wallGeometry(wall);


  const start =
    pointAlongWall(
      wall,
      d.offset
    );


  const end =
    pointAlongWall(
      wall,
      d.offset + d.width
    );


  /*
    門框
  */

  [start,end]
    .forEach(function(p){

      const frame =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );


      frame.setAttribute(
        "cx",
        p.x
      );

      frame.setAttribute(
        "cy",
        p.y
      );

      frame.setAttribute(
        "r",
        8
      );

      frame.setAttribute(
        "fill",
        "#e67e22"
      );


      group.appendChild(frame);

    });


  /*
    門片方向

    左開：
    從 start 往 end 方向

    右開：
    從 end 往 start 方向
  */

  let hinge;
  let free;


  if(d.swing === "left"){

    hinge = start;
    free = end;

  }else{

    hinge = end;
    free = start;

  }


  /*
    門片打開後往牆外側
  */

  const leafEnd = {

    x:
      hinge.x +
      g.nx * d.width,

    y:
      hinge.y +
      g.ny * d.width

  };


  const leaf =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );


  leaf.setAttribute(
    "x1",
    hinge.x
  );

  leaf.setAttribute(
    "y1",
    hinge.y
  );

  leaf.setAttribute(
    "x2",
    leafEnd.x
  );

  leaf.setAttribute(
    "y2",
    leafEnd.y
  );

  leaf.setAttribute(
    "class",
    "door-leaf"
  );


  group.appendChild(leaf);


  /*
    開門弧線
  */

  const arc =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );


  const sweep =
    d.swing === "left"
    ? 1
    : 0;


  const r =
    d.width;


  const arcPath =

    `M ${free.x} ${free.y}
     A ${r} ${r} 0 0 ${sweep}
     ${leafEnd.x} ${leafEnd.y}`;


  arc.setAttribute(
    "d",
    arcPath
  );

  arc.setAttribute(
    "class",
    "door-arc"
  );


  group.appendChild(arc);


  /*
    門寬 × 高
  */

  drawColoredDimension(

    group,

    start,
    end,

    `${d.width} × ${d.height}`,

    170,

    "door-text"

  );


  /*
    定位尺寸
  */

  drawOffsetDimension(

    group,
    wall,
    d.offset,
    d.width

  );


  /*
    門檻高度
  */

  if(d.sill > 0){

    drawHeightText(

      group,

      start,
      end,

      `門檻離地 ${d.sill} mm`

    );

  }

}


/* =========================
   彩色尺寸
========================= */

function drawColoredDimension(
  group,
  start,
  end,
  textValue,
  offset,
  className
){

  const dx =
    end.x - start.x;

  const dy =
    end.y - start.y;


  const len =
    Math.hypot(dx,dy);


  if(len === 0)
    return;


  const ux =
    dx / len;

  const uy =
    dy / len;


  const nx =
    -uy;

  const ny =
    ux;


  const s = {

    x:
      start.x +
      nx * offset,

    y:
      start.y +
      ny * offset

  };


  const e = {

    x:
      end.x +
      nx * offset,

    y:
      end.y +
      ny * offset

  };


  const line =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "line"
    );


  line.setAttribute(
    "x1",
    s.x
  );

  line.setAttribute(
    "y1",
    s.y
  );

  line.setAttribute(
    "x2",
    e.x
  );

  line.setAttribute(
    "y2",
    e.y
  );

  line.setAttribute(
    "class",
    "dimension"
  );


  group.appendChild(line);


  const text =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );


  text.setAttribute(
    "x",
    (s.x + e.x) / 2
  );

  text.setAttribute(
    "y",
    (s.y + e.y) / 2
  );

  text.setAttribute(
    "class",
    className
  );


  text.textContent =
    textValue;


  group.appendChild(text);

}


/* =========================
   高度文字
========================= */

function drawHeightText(
  group,
  start,
  end,
  textValue
){

  const x =
    (start.x + end.x) / 2;

  const y =
    (start.y + end.y) / 2;


  const text =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );


  text.setAttribute(
    "x",
    x
  );

  text.setAttribute(
    "y",
    y - 65
  );

  text.setAttribute(
    "class",
    "offset-text"
  );


  text.textContent =
    textValue;


  group.appendChild(text);

}


/* =========================
   渲染
========================= */

function render(){

  const group =
    document.getElementById(
      "drawingGroup"
    );


  group.innerHTML = "";


  drawWalls(group);


  windows.forEach(function(w){

    drawWindow(
      group,
      w
    );

  });


  doors.forEach(function(d){

    drawDoor(
      group,
      d
    );

  });


  /*
    牆面端點
  */

  points.forEach(function(p){

    const circle =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "circle"
      );


    circle.setAttribute(
      "cx",
      p.x
    );

    circle.setAttribute(
      "cy",
      p.y
    );

    circle.setAttribute(
      "r",
      14
    );

    circle.setAttribute(
      "class",
      "point"
    );


    group.appendChild(circle);

  });


  /*
    選中的牆面標記
  */

  if(selectedWallIndex !== null){

    const wall =
      walls[selectedWallIndex];


    const line =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );


    line.setAttribute(
      "x1",
      wall.start.x
    );

    line.setAttribute(
      "y1",
      wall.start.y
    );

    line.setAttribute(
      "x2",
      wall.end.x
    );

    line.setAttribute(
      "y2",
      wall.end.y
    );


    line.setAttribute(
      "stroke",
      "#8e44ad"
    );

    line.setAttribute(
      "stroke-width",
      "18"
    );

    line.setAttribute(
      "opacity",
      ".35"
    );


    group.insertBefore(
      line,
      group.firstChild
    );

  }

}


/* =========================
   自動縮放
========================= */

function fitView(){

  if(points.length === 0){

    return;

  }


  let xs = [];
  let ys = [];


  points.forEach(function(p){

    xs.push(p.x);
    ys.push(p.y);

  });


  walls.forEach(function(w){

    xs.push(w.start.x);
    xs.push(w.end.x);

    ys.push(w.start.y);
    ys.push(w.end.y);

  });


  if(xs.length === 0)
    return;


  const minX =
    Math.min(...xs);

  const maxX =
    Math.max(...xs);

  const minY =
    Math.min(...ys);

  const maxY =
    Math.max(...ys);


  const padding = 500;


  const width =
    Math.max(
      maxX - minX + padding * 2,
      1500
    );


  const height =
    Math.max(
      maxY - minY + padding * 2,
      1500
    );


  document.getElementById("drawing")
    .setAttribute(

      "viewBox",

      `${minX-padding}
       ${minY-padding}
       ${width}
       ${height}`

    );

}


/* =========================
   SVG 點擊
========================= */

document
  .getElementById("drawing")
  .addEventListener(
    "pointerdown",
    function(evt){

      if(
        currentTool === "window" ||
        currentTool === "door"
      ){

        selectWallByTap(evt);

      }

    }
  );


/* =========================
   初始化
========================= */

updateCaseName();

render();

</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>房屋丈量畫圖工具</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#222;
  color:white;
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  font-size:18px;
  margin:0;
}

.headerBtns{
  display:flex;
  gap:6px;
}

.headerBtns button{
  background:#444;
  color:white;
  border:0;
  border-radius:8px;
  padding:8px 10px;
  font-size:13px;
}

.container{
  padding:12px;
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.caseName{
  font-weight:bold;
  font-size:16px;
  margin-bottom:8px;
}

.toolGrid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.toolBtn{
  padding:12px 6px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  font-size:15px;
}

.toolBtn.active{
  background:#222;
  color:white;
  border-color:#222;
}

.inputRow{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:10px;
}

.inputRow input{
  flex:1;
  min-width:0;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.inputRow button{
  white-space:nowrap;
  padding:11px 13px;
  border:0;
  border-radius:8px;
  background:#222;
  color:white;
  font-size:15px;
}

.sectionTitle{
  font-weight:bold;
  margin-bottom:8px;
}

.subInput{
  margin-top:8px;
}

.subInput label{
  display:block;
  font-size:13px;
  color:#666;
  margin-bottom:4px;
}

.direction{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px;
}

.direction button{
  padding:10px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:8px;
  font-size:18px;
}

.direction button.active{
  background:#222;
  color:white;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.actions button{
  padding:11px 5px;
  border:0;
  border-radius:8px;
  background:#e9e9e9;
  font-size:14px;
}

#drawingArea{
  background:white;
  border-radius:12px;
  overflow:hidden;
  height:60vh;
  min-height:400px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

svg{
  width:100%;
  height:100%;
  display:block;
  background:#fafafa;
}

.legend{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  font-size:13px;
  color:#555;
}

.legendItem{
  display:flex;
  align-items:center;
  gap:5px;
}

.legendLine{
  width:25px;
  height:5px;
  background:#111;
}

.legendWindow{
  width:25px;
  height:5px;
  background:#1976d2;
}

.legendDoor{
  width:25px;
  height:4px;
  background:#e67e22;
}

.caseOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  z-index:100;
}

.casePanel{
  background:white;
  width:90%;
  max-width:500px;
  max-height:80vh;
  overflow:auto;
  margin:10vh auto;
  border-radius:14px;
  padding:16px;
}

.casePanelHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.casePanelHeader button{
  border:0;
  background:#eee;
  border-radius:7px;
  padding:7px 10px;
}

.caseItem{
  border:1px solid #ddd;
  border-radius:9px;
  padding:10px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.caseItemInfo{
  flex:1;
}

.caseItemName{
  font-weight:bold;
}

.caseItemTime{
  font-size:12px;
  color:#888;
  margin-top:3px;
}

.caseItemBtns{
  display:flex;
  gap:5px;
}

.caseItemBtns button{
  border:0;
  border-radius:7px;
  padding:7px 9px;
}

.openBtn{
  background:#222;
  color:white;
}

.deleteBtn{
  background:#eee;
}

.hidden{
  display:none;
}

.hint{
  font-size:12px;
  color:#777;
  margin-top:7px;
  line-height:1.5;
}
</style>
</head>

<body>

<header>
  <h1>房屋丈量畫圖工具</h1>

  <div class="headerBtns">
    <button onclick="newCase()">＋案件</button>
    <button onclick="openCases()">案件</button>
  </div>
</header>

<div class="container">

  <div class="card">
    <div class="caseName">
      📁 <span id="currentCaseName">未命名案件</span>
    </div>
  </div>

  <!-- 工具 -->
  <div class="card">
    <div class="sectionTitle">繪圖工具</div>

    <div class="toolGrid">
      <button id="wallTool" class="toolBtn active" onclick="selectTool('wall')">
        🧱 牆線
      </button>

      <button id="windowTool" class="toolBtn" onclick="selectTool('window')">
        🪟 窗戶
      </button>

      <button id="doorTool" class="toolBtn" onclick="selectTool('door')">
        🚪 門
      </button>
    </div>
  </div>


  <!-- 牆線 -->
  <div class="card" id="wallCard">

    <div class="sectionTitle">🧱 新增牆線</div>

    <div class="inputRow">
      <input
        id="wallLength"
        type="number"
        inputmode="numeric"
        placeholder="輸入長度 mm"
      >

      <button onclick="addWall()">＋新增線段</button>
    </div>

    <div class="direction">

      <button id="dirUp" onclick="setDirection('up')">↑</button>

      <button id="dirLeft" onclick="setDirection('left')">←</button>

      <button id="dirRight" class="active" onclick="setDirection('right')">→</button>

      <button></button>

      <button id="dirDown" onclick="setDirection('down')">↓</button>

      <button></button>

    </div>

  </div>


  <!-- 窗戶 -->
  <div class="card hidden" id="windowCard">

    <div class="sectionTitle">🪟 新增窗戶</div>

    <div class="subInput">
      <label>窗戶寬度（mm）</label>
      <input
        id="windowWidth"
        type="number"
        inputmode="numeric"
        placeholder="例如 1500"
        style="width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px;"
      >
    </div>

    <div class="subInput">
      <label>窗戶高度（mm）</label>
      <input
        id="windowHeight"
        type="number"
        inputmode="numeric"
        placeholder="例如 1200"
        style="width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px;"
      >
    </div>

    <div class="subInput">
      <label>窗台離地（mm）</label>
      <input
        id="windowSill"
        type="number"
        inputmode="numeric"
        placeholder="例如 900"
        style="width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px;"
      >
    </div>

    <div class="inputRow">
      <button style="width:100%;" onclick="addWindow()">＋新增窗戶</button>
    </div>

    <div class="hint">
      目前窗戶會從最後一個牆線端點開始繪製。
    </div>

  </div>


  <!-- 門 -->
  <div class="card hidden" id="doorCard">

    <div class="sectionTitle">🚪 新增門</div>

    <div class="subInput">
      <label>門寬（mm）</label>
      <input
        id="doorWidth"
        type="number"
        inputmode="numeric"
        placeholder="例如 900"
        style="width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px;"
      >
    </div>

    <div class="subInput">
      <label>門高（mm）</label>
      <input
        id="doorHeight"
        type="number"
        inputmode="numeric"
        placeholder="例如 2100"
        style="width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px;"
      >
    </div>

    <div class="subInput">
      <label>門框離地（mm）</label>
      <input
        id="doorSill"
        type="number"
        inputmode="numeric"
        value="0"
        placeholder="通常 0"
        style="width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px;"
      >
    </div>

    <div class="subInput">
      <label>開門方向</label>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">

        <button
          id="doorLeft"
          onclick="setDoorSwing('left')"
          style="padding:11px;border:1px solid #222;border-radius:8px;background:#222;color:white;"
        >
          ↖ 左開
        </button>

        <button
          id="doorRight"
          onclick="setDoorSwing('right')"
          style="padding:11px;border:1px solid #ccc;border-radius:8px;background:white;"
        >
          ↗ 右開
        </button>

      </div>
    </div>

    <div class="inputRow">
      <button style="width:100%;" onclick="addDoor()">＋新增門</button>
    </div>

  </div>


  <!-- 操作 -->
  <div class="card">

    <div class="actions">
      <button onclick="undo()">↩ 復原</button>
      <button onclick="clearAll()">🗑 清除</button>
      <button onclick="fitView()">⛶ 自動縮放</button>
    </div>

  </div>


  <!-- 圖面 -->
  <div id="drawingArea">

    <svg id="svg" viewBox="-1000 -1000 2000 2000">

      <defs>

        <marker
          id="arrow"
          markerWidth="8"
          markerHeight="8"
          refX="4"
          refY="4"
          orient="auto"
        >
          <path d="M0,0 L8,4 L0,8 Z" fill="#555"></path>
        </marker>

      </defs>

      <g id="drawing"></g>

    </svg>

  </div>


  <div class="card">

    <div class="legend">

      <div class="legendItem">
        <span class="legendLine"></span>
        牆線
      </div>

      <div class="legendItem">
        <span class="legendWindow"></span>
        窗戶
      </div>

      <div class="legendItem">
        <span class="legendDoor"></span>
        門
      </div>

      <div class="legendItem">
        📏 自動尺寸
      </div>

    </div>

  </div>

</div>


<!-- 案件 -->
<div id="caseOverlay" class="caseOverlay">

  <div class="casePanel">

    <div class="casePanelHeader">

      <strong>📁 已儲存案件</strong>

      <button onclick="closeCases()">✕</button>

    </div>

    <div id="caseList"></div>

  </div>

</div>


<script>

let points = [{x:0,y:0}];

let walls = [];
let windows = [];
let doors = [];

let currentDirection = "right";
let currentTool = "wall";
let currentDoorSwing = "left";

let currentCaseId = null;


/* =========================
   工具
========================= */

function selectTool(tool){

  currentTool = tool;

  document.getElementById("wallTool").classList.remove("active");
  document.getElementById("windowTool").classList.remove("active");
  document.getElementById("doorTool").classList.remove("active");

  document.getElementById("wallCard").classList.add("hidden");
  document.getElementById("windowCard").classList.add("hidden");
  document.getElementById("doorCard").classList.add("hidden");

  if(tool === "wall"){

    document.getElementById("wallTool").classList.add("active");
    document.getElementById("wallCard").classList.remove("hidden");

  }

  if(tool === "window"){

    document.getElementById("windowTool").classList.add("active");
    document.getElementById("windowCard").classList.remove("hidden");

  }

  if(tool === "door"){

    document.getElementById("doorTool").classList.add("active");
    document.getElementById("doorCard").classList.remove("hidden");

  }
}


/* =========================
   方向
========================= */

function setDirection(direction){

  currentDirection = direction;

  document.querySelectorAll(".direction button").forEach(btn=>{
    btn.classList.remove("active");
  });

  const map = {
    up:"dirUp",
    down:"dirDown",
    left:"dirLeft",
    right:"dirRight"
  };

  document.getElementById(map[direction]).classList.add("active");
}


/* =========================
   門方向
========================= */

function setDoorSwing(direction){

  currentDoorSwing = direction;

  const left = document.getElementById("doorLeft");
  const right = document.getElementById("doorRight");

  left.style.background = direction === "left" ? "#222" : "white";
  left.style.color = direction === "left" ? "white" : "#222";

  right.style.background = direction === "right" ? "#222" : "white";
  right.style.color = direction === "right" ? "white" : "#222";
}


/* =========================
   新增牆線
========================= */

function addWall(){

  const length = Number(
    document.getElementById("wallLength").value
  );

  if(!length || length <= 0){
    alert("請輸入有效的牆線長度");
    return;
  }

  const start = points[points.length - 1];

  let end = {
    x:start.x,
    y:start.y
  };

  if(currentDirection === "right"){
    end.x += length;
  }

  if(currentDirection === "left"){
    end.x -= length;
  }

  if(currentDirection === "down"){
    end.y += length;
  }

  if(currentDirection === "up"){
    end.y -= length;
  }

  walls.push({
    x1:start.x,
    y1:start.y,
    x2:end.x,
    y2:end.y,
    length:length
  });

  points.push(end);

  saveCase();
  render();
  fitView();

  document.getElementById("wallLength").focus();
}


/* =========================
   新增窗戶
========================= */

function addWindow(){

  const width = Number(
    document.getElementById("windowWidth").value
  );

  const height = Number(
    document.getElementById("windowHeight").value
  );

  const sill = Number(
    document.getElementById("windowSill").value
  );

  if(!width || width <= 0){
    alert("請輸入窗戶寬度");
    return;
  }

  if(!height || height <= 0){
    alert("請輸入窗戶高度");
    return;
  }

  const start = points[points.length - 1];

  let end = {
    x:start.x,
    y:start.y
  };

  if(currentDirection === "right"){
    end.x += width;
  }

  if(currentDirection === "left"){
    end.x -= width;
  }

  if(currentDirection === "down"){
    end.y += width;
  }

  if(currentDirection === "up"){
    end.y -= width;
  }

  windows.push({
    x1:start.x,
    y1:start.y,
    x2:end.x,
    y2:end.y,
    width:width,
    height:height,
    sill:sill,
    direction:currentDirection
  });

  saveCase();
  render();
  fitView();

  document.getElementById("windowWidth").focus();
}


/* =========================
   新增門
========================= */

function addDoor(){

  const width = Number(
    document.getElementById("doorWidth").value
  );

  const height = Number(
    document.getElementById("doorHeight").value
  );

  const sill = Number(
    document.getElementById("doorSill").value
  );

  if(!width || width <= 0){
    alert("請輸入門寬");
    return;
  }

  if(!height || height <= 0){
    alert("請輸入門高");
    return;
  }

  const start = points[points.length - 1];

  let end = {
    x:start.x,
    y:start.y
  };

  if(currentDirection === "right"){
    end.x += width;
  }

  if(currentDirection === "left"){
    end.x -= width;
  }

  if(currentDirection === "down"){
    end.y += width;
  }

  if(currentDirection === "up"){
    end.y -= width;
  }

  doors.push({
    x1:start.x,
    y1:start.y,
    x2:end.x,
    y2:end.y,
    width:width,
    height:height,
    sill:sill,
    direction:currentDirection,
    swing:currentDoorSwing
  });

  saveCase();
  render();
  fitView();

  document.getElementById("doorWidth").focus();
}


/* =========================
   SVG 工具
========================= */

function svgLine(x1,y1,x2,y2,attrs={}){

  const line = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "line"
  );

  line.setAttribute("x1",x1);
  line.setAttribute("y1",y1);
  line.setAttribute("x2",x2);
  line.setAttribute("y2",y2);

  Object.keys(attrs).forEach(k=>{
    line.setAttribute(k,attrs[k]);
  });

  return line;
}


function svgText(x,y,text,attrs={}){

  const t = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "text"
  );

  t.setAttribute("x",x);
  t.setAttribute("y",y);
  t.textContent=text;

  Object.keys(attrs).forEach(k=>{
    t.setAttribute(k,attrs[k]);
  });

  return t;
}


/* =========================
   牆尺寸
========================= */

function drawDimension(x1,y1,x2,y2,length){

  const g = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "g"
  );

  const offset = 90;

  if(y1 === y2){

    const yy = y1 - offset;

    g.appendChild(
      svgLine(x1,y1,x1,yy,{
        stroke:"#777",
        "stroke-width":2
      })
    );

    g.appendChild(
      svgLine(x2,y2,x2,yy,{
        stroke:"#777",
        "stroke-width":2
      })
    );

    g.appendChild(
      svgLine(x1,yy,x2,yy,{
        stroke:"#555",
        "stroke-width":2,
        "marker-start":"url(#arrow)",
        "marker-end":"url(#arrow)"
      })
    );

    g.appendChild(
      svgText(
        (x1+x2)/2,
        yy-12,
        length+" mm",
        {
          "text-anchor":"middle",
          fill:"#333",
          "font-size":28,
          "font-weight":"bold"
        }
      )
    );

  }else{

    const xx = x1 + offset;

    g.appendChild(
      svgLine(x1,y1,xx,y1,{
        stroke:"#777",
        "stroke-width":2
      })
    );

    g.appendChild(
      svgLine(x2,y2,xx,y2,{
        stroke:"#777",
        "stroke-width":2
      })
    );

    g.appendChild(
      svgLine(x1,y1,xx,y2,{
        stroke:"#555",
        "stroke-width":2,
        "marker-start":"url(#arrow)",
        "marker-end":"url(#arrow)"
      })
    );

    const midY = (y1+y2)/2;

    g.appendChild(
      svgText(
        xx+12,
        midY,
        length+" mm",
        {
          fill:"#333",
          "font-size":28,
          "font-weight":"bold",
          transform:`rotate(90 ${xx+12} ${midY})`
        }
      )
    );
  }

  return g;
}


/* =========================
   窗戶
========================= */

function drawWindow(w){

  const g = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "g"
  );

  let dx = w.x2 - w.x1;
  let dy = w.y2 - w.y1;

  const len = Math.sqrt(dx*dx + dy*dy);

  let nx = 0;
  let ny = 0;

  if(len > 0){
    nx = -dy / len;
    ny = dx / len;
  }

  const gap = 18;

  g.appendChild(
    svgLine(
      w.x1 + nx*gap,
      w.y1 + ny*gap,
      w.x2 + nx*gap,
      w.y2 + ny*gap,
      {
        stroke:"#1976d2",
        "stroke-width":7
      }
    )
  );

  g.appendChild(
    svgLine(
      w.x1 - nx*gap,
      w.y1 - ny*gap,
      w.x2 - nx*gap,
      w.y2 - ny*gap,
      {
        stroke:"#1976d2",
        "stroke-width":7
      }
    )
  );

  const mx = (w.x1+w.x2)/2;
  const my = (w.y1+w.y2)/2;

  g.appendChild(
    svgText(
      mx,
      my-25,
      `${w.width} × ${w.height} mm`,
      {
        "text-anchor":"middle",
        fill:"#1976d2",
        "font-size":26,
        "font-weight":"bold"
      }
    )
  );

  g.appendChild(
    svgText(
      mx,
      my+10,
      `窗台離地 ${w.sill} mm`,
      {
        "text-anchor":"middle",
        fill:"#1976d2",
        "font-size":22
      }
    )
  );

  return g;
}


/* =========================
   門
========================= */

function drawDoor(d){

  const g = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "g"
  );

  let dx = d.x2-d.x1;
  let dy = d.y2-d.y1;

  const len = Math.sqrt(dx*dx+dy*dy);

  if(len === 0) return g;

  const ux = dx/len;
  const uy = dy/len;

  /*
    門片打開方向
    依照牆線方向決定另一側
  */

  let sx;
  let sy;

  if(d.swing === "left"){
    sx = -uy;
    sy = ux;
  }else{
    sx = uy;
    sy = -ux;
  }

  const doorEndX = d.x1 + sx*d.width;
  const doorEndY = d.y1 + sy*d.width;

  /* 門框 */
  g.appendChild(
    svgLine(
      d.x1,
      d.y1,
      d.x2,
      d.y2,
      {
        stroke:"#e67e22",
        "stroke-width":10
      }
    )
  );

  /* 門片 */
  g.appendChild(
    svgLine(
      d.x1,
      d.y1,
      doorEndX,
      doorEndY,
      {
        stroke:"#e67e22",
        "stroke-width":7
      }
    )
  );

  /* 開門弧線 */

  const arc = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "path"
  );

  const sweep = d.swing === "left" ? 1 : 0;

  arc.setAttribute(
    "d",
    `M ${d.x2} ${d.y2}
     A ${d.width} ${d.width} 0 0 ${sweep}
     ${doorEndX} ${doorEndY}`
  );

  arc.setAttribute("fill","none");
  arc.setAttribute("stroke","#e67e22");
  arc.setAttribute("stroke-width","4");
  arc.setAttribute("stroke-dasharray","10 8");

  g.appendChild(arc);

  /* 門尺寸 */

  const mx = (d.x1+d.x2)/2;
  const my = (d.y1+d.y2)/2;

  g.appendChild(
    svgText(
      mx,
      my-25,
      `${d.width} × ${d.height} mm`,
      {
        "text-anchor":"middle",
        fill:"#e67e22",
        "font-size":26,
        "font-weight":"bold"
      }
    )
  );

  g.appendChild(
    svgText(
      mx,
      my+10,
      `離地 ${d.sill} mm`,
      {
        "text-anchor":"middle",
        fill:"#e67e22",
        "font-size":22
      }
    )
  );

  return g;
}


/* =========================
   Render
========================= */

function render(){

  const drawing = document.getElementById("drawing");

  drawing.innerHTML = "";

  /* 牆 */

  walls.forEach(w=>{

    drawing.appendChild(
      svgLine(
        w.x1,
        w.y1,
        w.x2,
        w.y2,
        {
          stroke:"#111",
          "stroke-width":12,
          "stroke-linecap":"square"
        }
      )
    );

    drawing.appendChild(
      drawDimension(
        w.x1,
        w.y1,
        w.x2,
        w.y2,
        w.length
      )
    );

  });


  /* 窗戶 */

  windows.forEach(w=>{
    drawing.appendChild(drawWindow(w));
  });


  /* 門 */

  doors.forEach(d=>{
    drawing.appendChild(drawDoor(d));
  });


  /* 點 */

  points.forEach(p=>{

    const circle = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

    circle.setAttribute("cx",p.x);
    circle.setAttribute("cy",p.y);
    circle.setAttribute("r",7);
    circle.setAttribute("fill","#111");

    drawing.appendChild(circle);

  });
}


/* =========================
   自動縮放
========================= */

function fitView(){

  const svg = document.getElementById("svg");

  let all = [];

  walls.forEach(w=>{
    all.push({x:w.x1,y:w.y1});
    all.push({x:w.x2,y:w.y2});
  });

  windows.forEach(w=>{
    all.push({x:w.x1,y:w.y1});
    all.push({x:w.x2,y:w.y2});
  });

  doors.forEach(d=>{
    all.push({x:d.x1,y:d.y1});
    all.push({x:d.x2,y:d.y2});
  });

  if(all.length === 0){

    svg.setAttribute(
      "viewBox",
      "-1000 -1000 2000 2000"
    );

    return;
  }

  let minX = Math.min(...all.map(p=>p.x));
  let maxX = Math.max(...all.map(p=>p.x));
  let minY = Math.min(...all.map(p=>p.y));
  let maxY = Math.max(...all.map(p=>p.y));

  const padding = 500;

  minX -= padding;
  maxX += padding;
  minY -= padding;
  maxY += padding;

  svg.setAttribute(
    "viewBox",
    `${minX} ${minY} ${maxX-minX} ${maxY-minY}`
  );
}


/* =========================
   復原
========================= */

function undo(){

  if(doors.length > 0){

    doors.pop();

  }else if(windows.length > 0){

    windows.pop();

  }else if(walls.length > 0){

    walls.pop();

    if(points.length > 1){
      points.pop();
    }

  }else{
    return;
  }

  saveCase();
  render();
  fitView();
}


/* =========================
   清除
========================= */

function clearAll(){

  if(!confirm("確定要清除目前案件的所有圖面嗎？")){
    return;
  }

  points = [{x:0,y:0}];
  walls = [];
  windows = [];
  doors = [];

  saveCase();
  render();
  fitView();
}


/* =========================
   案件
========================= */

function newCase(){

  const name = prompt(
    "請輸入案件名稱",
    "新案件"
  );

  if(!name){
    return;
  }

  currentCaseId = Date.now().toString();

  points = [{x:0,y:0}];
  walls = [];
  windows = [];
  doors = [];

  document.getElementById(
    "currentCaseName"
  ).textContent = name;

  saveCase();

  render();
  fitView();
}


function saveCase(){

  if(!currentCaseId){

    currentCaseId = Date.now().toString();

    document.getElementById(
      "currentCaseName"
    ).textContent = "未命名案件";
  }

  const cases =
    JSON.parse(
      localStorage.getItem("measureCases") || "{}"
    );

  cases[currentCaseId] = {

    id:currentCaseId,

    name:
      document.getElementById(
        "currentCaseName"
      ).textContent,

    points:points,

    walls:walls,

    windows:windows,

    doors:doors,

    updatedAt:new Date().toISOString()

  };

  localStorage.setItem(
    "measureCases",
    JSON.stringify(cases)
  );
}


function openCases(){

  const overlay =
    document.getElementById("caseOverlay");

  const list =
    document.getElementById("caseList");

  const cases =
    JSON.parse(
      localStorage.getItem("measureCases") || "{}"
    );

  list.innerHTML = "";

  const arr =
    Object.values(cases)
      .sort(
        (a,b)=>
          new Date(b.updatedAt) -
          new Date(a.updatedAt)
      );

  if(arr.length === 0){

    list.innerHTML =
      "<p style='color:#777;'>目前沒有儲存案件</p>";

  }else{

    arr.forEach(c=>{

      const item =
        document.createElement("div");

      item.className = "caseItem";

      const info =
        document.createElement("div");

      info.className = "caseItemInfo";

      info.innerHTML = `
        <div class="caseItemName">
          ${escapeHtml(c.name)}
        </div>

        <div class="caseItemTime">
          ${new Date(c.updatedAt).toLocaleString()}
        </div>
      `;

      const btns =
        document.createElement("div");

      btns.className = "caseItemBtns";

      const openBtn =
        document.createElement("button");

      openBtn.className = "openBtn";
      openBtn.textContent = "開啟";

      openBtn.onclick = ()=>{
        loadCase(c.id);
        closeCases();
      };


      const deleteBtn =
        document.createElement("button");

      deleteBtn.className = "deleteBtn";
      deleteBtn.textContent = "刪除";

      deleteBtn.onclick = ()=>{

        if(confirm("確定要刪除這個案件嗎？")){

          delete cases[c.id];

          localStorage.setItem(
            "measureCases",
            JSON.stringify(cases)
          );

          openCases();
        }
      };


      btns.appendChild(openBtn);
      btns.appendChild(deleteBtn);

      item.appendChild(info);
      item.appendChild(btns);

      list.appendChild(item);

    });

  }

  overlay.style.display = "block";
}


function closeCases(){

  document.getElementById(
    "caseOverlay"
  ).style.display = "none";
}


function loadCase(id){

  const cases =
    JSON.parse(
      localStorage.getItem("measureCases") || "{}"
    );

  const c = cases[id];

  if(!c){
    return;
  }

  currentCaseId = c.id;

  points = c.points || [{x:0,y:0}];
  walls = c.walls || [];
  windows = c.windows || [];
  doors = c.doors || [];

  document.getElementById(
    "currentCaseName"
  ).textContent = c.name;

  render();
  fitView();
}


function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* =========================
   初始化
========================= */

render();
fitView();

</script>
